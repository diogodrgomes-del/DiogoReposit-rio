/* ---------------------------------------------------- arrastar e soltar */
let arrastando = null;

function ligarArrasto() {
  document.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("dragstart", () => { arrastando = card.dataset.lead; card.classList.add("arrastando"); });
    card.addEventListener("dragend", () => { arrastando = null; card.classList.remove("arrastando"); document.querySelectorAll(".alvo").forEach((c) => c.classList.remove("alvo")); });
    card.addEventListener("dragover", (e) => e.preventDefault());
    card.addEventListener("drop", (e) => {
      e.preventDefault(); e.stopPropagation();
      const coluna = card.closest(".quadro__coluna");
      moverLead(arrastando, coluna.dataset.etapa, card.dataset.lead);
    });
  });

  document.querySelectorAll(".quadro__coluna").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("alvo"); });
    col.addEventListener("dragleave", () => col.classList.remove("alvo"));
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("alvo"); moverLead(arrastando, col.dataset.etapa, null); });
  });
}

/**
 * Move o card. Mesma lógica de core/leads.ts: a posição sai de `entre()`, então
 * é uma alteração de um registro só, sem tocar nos vizinhos.
 */
function moverLead(leadId, etapaId, antesDe) {
  if (!leadId) return;
  const l = leadDe(leadId);
  if (!l) return;

  const destino = leadsVivos().filter((x) => x.etapaId === etapaId && x.id !== leadId).sort((a, b) => a.ordem - b.ordem);
  const idx = antesDe ? destino.findIndex((x) => x.id === antesDe) : destino.length;
  const i = idx < 0 ? destino.length : idx;
  const anterior = i > 0 ? destino[i - 1].ordem : null;
  const proximo = i < destino.length ? destino[i].ordem : null;

  let ordem = entre(anterior, proximo);
  if (ordem === null) {
    // Espaço esgotado: redistribui a coluna. Raro, e invisível para quem arrasta.
    destino.forEach((x, k) => { x.ordem = (k + 1) * PASSO; });
    ordem = (destino.length + 1) * PASSO;
  }

  const etapaAntiga = etapaDe(l.etapaId);
  const etapaNova = etapaDe(etapaId);
  const mudou = l.etapaId !== etapaId;

  l.etapaId = etapaId;
  l.ordem = ordem;

  if (mudou) {
    registrar("lead", l.id, "lead.etapa_alterada", { de: etapaAntiga.nome, para: etapaNova.nome });
    if (etapaNova.tipo === "ganho") { l.fechadoEm = new Date().toISOString(); l.perdidoEm = null; }
    else if (etapaNova.tipo === "perda") { l.perdidoEm = new Date().toISOString(); l.fechadoEm = null; }
    else { l.fechadoEm = null; l.perdidoEm = null; }
    toast(`Movido para “${etapaNova.nome}”`);
  }

  salvar();
  render();
}

/* ------------------------------------------ arrastar e soltar: operacional */
let arrastandoDemanda = null;

function ligarArrastoDemandas() {
  document.querySelectorAll(".card[data-demanda]").forEach((card) => {
    card.addEventListener("dragstart", () => { arrastandoDemanda = card.dataset.demanda; card.classList.add("arrastando"); });
    card.addEventListener("dragend", () => { arrastandoDemanda = null; card.classList.remove("arrastando"); document.querySelectorAll(".alvo").forEach((c) => c.classList.remove("alvo")); });
    card.addEventListener("dragover", (e) => e.preventDefault());
    card.addEventListener("drop", (e) => {
      e.preventDefault(); e.stopPropagation();
      moverDemanda(arrastandoDemanda, card.closest(".quadro__coluna").dataset.fase, card.dataset.demanda);
    });
  });

  document.querySelectorAll(".quadro__coluna[data-fase]").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("alvo"); });
    col.addEventListener("dragleave", () => col.classList.remove("alvo"));
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("alvo"); moverDemanda(arrastandoDemanda, col.dataset.fase, null); });
  });
}

/** Mesma ordenação fracionária do funil — um registro alterado, vizinhos intactos. */
function moverDemanda(demandaId, faseId, antesDe) {
  if (!demandaId) return;
  const d = demandaDe(demandaId);
  if (!d) return;
  if (!pode("operacional.editar")) return toast("Seu papel não edita a entrega.");

  const destino = demandasVivas().filter((x) => x.fase === faseId && x.id !== demandaId).sort((a, b) => a.ordem - b.ordem);
  const idx = antesDe ? destino.findIndex((x) => x.id === antesDe) : destino.length;
  const i = idx < 0 ? destino.length : idx;

  let ordem = entre(i > 0 ? destino[i - 1].ordem : null, i < destino.length ? destino[i].ordem : null);
  if (ordem === null) {
    destino.forEach((x, k) => { x.ordem = (k + 1) * PASSO; });
    ordem = (destino.length + 1) * PASSO;
  }

  const mudou = d.fase !== faseId;
  const nova = faseDe(faseId);
  d.fase = faseId;
  d.ordem = ordem;

  if (mudou) {
    // A fase final é quem carimba a conclusão. Sair dela reabre a demanda —
    // senão uma volta atrás deixaria um registro concluído em fase aberta.
    d.concluidaEm = nova.final ? new Date().toISOString() : null;
    registrar("demanda", d.id, "demanda.fase_alterada", { para: nova.nome });

    // Mandar para o cliente é o mesmo gesto de pedir aprovação. Fazer disso
    // duas telas garantiria que uma das duas ficasse desatualizada.
    if (faseId === "cliente" && !S.aprovacoes.some((a) => a.demandaId === d.id && a.status === "pendente")) {
      S.aprovacoes.push({ id: uid(), clienteId: d.clienteId, demandaId: d.id, titulo: d.titulo,
        tipo: d.tipo, status: "pendente", enviadoEm: new Date().toISOString(), respondidoEm: null, comentario: null });
      toast(`“${nova.nome}” — pedido de aprovação criado`);
    } else {
      toast(`Movida para “${nova.nome}”`);
    }
  }

  salvar();
  render();
}

/* ------------------------------------------------------------------ ações */
document.addEventListener("click", (e) => {
  const alvo = e.target.closest("[data-acao]");
  const itemBusca = e.target.closest(".busca-item");

  if (itemBusca) { const href = itemBusca.dataset.href; fecharBusca(); ir(href); return; }
  if (!alvo) return;

  const acao = alvo.dataset.acao;
  const id = alvo.dataset.id;

  if (acao === "abrir-busca") abrirBusca();
  else if (acao === "fechar-modal") fecharModal();
  else if (acao === "reiniciar") { if (confirm("Restaurar os dados de exemplo? O que você criou aqui será apagado.")) reiniciar(); }
  else if (acao === "tema") {
    const atual = document.documentElement.dataset.theme;
    const escuro = atual ? atual === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = escuro ? "light" : "dark";
  }
  else if (acao === "novo-lead") abrirModal(modalLead(null));
  else if (acao === "editar-lead") abrirModal(modalLead(leadDe(id)));
  else if (acao === "novo-cliente") abrirModal(modalCliente(null));
  else if (acao === "editar-cliente") abrirModal(modalCliente(clienteDe(id)));
  else if (acao === "limpar-filtros") { filtrosVendas = { q: "", responsavel: "", temperatura: "" }; render(); }
  else if (acao === "limpar-clientes") { filtrosClientes = { q: "", status: "" }; ir("#/clientes"); }
  else if (acao === "trocar-usuario") { S.usuarioId = id; salvar(); render(); toast(`Agora você é ${usuarioDe(id).nome}`); }
  else if (acao === "concluir-atividade") {
    const a = S.atividades.find((x) => x.id === id);
    if (a) { a.concluidaEm = new Date().toISOString(); registrar("lead", a.leadId, "lead.atividade_concluida", { titulo: a.titulo }); salvar(); render(); toast("Atividade concluída"); }
  }
  else if (acao === "excluir-lead") {
    if (!confirm("Enviar este lead para a lixeira?")) return;
    const l = leadDe(id);
    l.excluidoEm = new Date().toISOString();
    registrar("lead", l.id, "lead.excluido");
    salvar(); ir("#/vendas"); toast("Lead enviado para a lixeira");
  }
  else if (acao === "excluir-cliente") {
    if (!confirm("Enviar este cliente para a lixeira?")) return;
    const c = clienteDe(id);
    c.excluidoEm = new Date().toISOString();
    salvar(); ir("#/clientes"); toast("Cliente enviado para a lixeira");
  }
  else if (acao === "aba-cliente") { abaCliente = alvo.dataset.aba; render(); }

  /* ------------------------------------------------------------ operacional */
  else if (acao === "nova-demanda") abrirModal(modalDemanda(null));
  else if (acao === "editar-demanda") abrirModal(modalDemanda(demandaDe(id)));
  else if (acao === "limpar-op") { filtrosOp = { cliente: "", responsavel: "", q: "" }; ir("#/operacional"); }
  else if (acao === "excluir-demanda") {
    if (!confirm("Excluir esta demanda?")) return;
    demandaDe(id).excluidoEm = new Date().toISOString();
    salvar(); fecharModal(); render(); toast("Demanda excluída");
  }
  else if (acao === "concluir-demanda") {
    const d = demandaDe(id);
    moverDemanda(d.id, "concluida", null);
  }

  /* ------------------------------------------------------------- aprovações */
  else if (acao === "nova-aprovacao") abrirModal(modalAprovacao());
  else if (acao === "reenviar-aprovacao") {
    const a = S.aprovacoes.find((x) => x.id === id);
    a.status = "pendente"; a.enviadoEm = new Date().toISOString(); a.respondidoEm = null;
    salvar(); render(); toast("Reenviado para aprovação");
  }

  /* -------------------------------------------------------------- financeiro */
  else if (acao === "receber") {
    const b = S.cobrancas.find((x) => x.id === id);
    b.pagoEm = hojeISO();
    registrar("cliente", b.clienteId, "financeiro.recebido", { valor: b.valor, competencia: b.competencia });
    salvar(); render(); toast(`Recebido — ${moedaExata.format(b.valor)}`);
  }
  else if (acao === "desfazer-recebimento") {
    const b = S.cobrancas.find((x) => x.id === id);
    b.pagoEm = null;
    salvar(); render(); toast("Recebimento desfeito");
  }
  else if (acao === "nova-despesa") abrirModal(modalDespesa());
  else if (acao === "pagar-despesa") {
    S.despesas.find((x) => x.id === id).pagoEm = hojeISO();
    salvar(); render(); toast("Despesa paga");
  }

  /* ------------------------------------------------------ estratégia e apoio */
  else if (acao === "editar-estrategia") abrirModal(modalEstrategia(id));
  else if (acao === "novo-arquivo") abrirModal(modalArquivo());
  else if (acao === "nova-senha") abrirModal(modalSenha(null));
  else if (acao === "editar-senha") abrirModal(modalSenha(S.senhas.find((x) => x.id === id)));
  else if (acao === "excluir-senha") {
    if (!confirm("Apagar este acesso?")) return;
    S.senhas = S.senhas.filter((x) => x.id !== id);
    salvar(); fecharModal(); render(); toast("Acesso apagado");
  }
  else if (acao === "revelar") {
    // Revelar é um evento, não um detalhe de interface: no sistema real
    // fica no histórico com quem olhou e quando.
    if (revelados.has(id)) revelados.delete(id);
    else { revelados.add(id); registrar("senha", id, "senha.revelada"); salvar(); }
    render();
  }
  else if (acao === "copiar-senha") {
    const s = S.senhas.find((x) => x.id === id);
    const escrever = navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(s.segredo) : Promise.reject();
    escrever.then(() => toast("Senha copiada")).catch(() => toast("O navegador não deixou copiar aqui"));
    registrar("senha", id, "senha.copiada");
    salvar();
  }
});

/* ---------------------------------------------------------------- submits */
document.addEventListener("submit", (e) => {
  const form = e.target;
  const tipo = form.dataset.form;
  if (!tipo) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form).entries());

  if (tipo === "filtros-vendas") { filtrosVendas = { q: d.q || "", responsavel: d.responsavel || "", temperatura: d.temperatura || "" }; render(); return; }
  if (tipo === "filtros-clientes") { filtrosClientes = { q: d.q || "", status: d.status || "" }; render(); return; }
  if (tipo === "filtros-op") { filtrosOp = { q: d.q || "", cliente: d.cliente || "", responsavel: d.responsavel || "" }; render(); return; }
  if (tipo === "filtros-arquivos") { clienteArquivos = d.cliente || ""; render(); return; }
  if (tipo === "mes-financeiro") { mesFinanceiro = d.mes; render(); return; }
  if (tipo === "cliente-trafego") { clienteTrafego = d.cliente; render(); return; }

  if (tipo === "salvar-lead") return salvarLead(form, d);
  if (tipo === "salvar-cliente") return salvarCliente(form, d);
  if (tipo === "nova-atividade") return novaAtividade(form, d);
  if (tipo === "converter") return converter(form, d);
  if (tipo === "motivo-perda") return motivoPerda(form, d);
  if (tipo === "salvar-demanda") return salvarDemanda(form, d);
  if (tipo === "nova-aprovacao") return novaAprovacao(form, d);
  if (tipo === "responder-aprovacao") return responderAprovacao(form, e.submitter);
  if (tipo === "salvar-senha") return salvarSenha(form, d);
  if (tipo === "salvar-arquivo") return salvarArquivo(form, d);
  if (tipo === "salvar-despesa") return salvarDespesa(form, d);
  if (tipo === "salvar-estrategia") return salvarEstrategia(form, d);
});

/** Aceita "2.500,90" e "2500.90" — as duas formas que alguém digita de verdade. */
function numero(txt) {
  if (!txt) return null;
  const n = Number(String(txt).replace(/\s/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function erroNoForm(form, mensagem) {
  const caixa = form.querySelector(".erro-form");
  if (caixa) caixa.innerHTML = `<p class="aviso-erro">${esc(mensagem)}</p>`;
  else toast(mensagem);
}

function salvarLead(form, d) {
  const nome = (d.nome || "").trim();
  if (!nome) return erroNoForm(form, "O nome é obrigatório.");

  const telefone = normalizarTelefone(d.telefone);
  if (!telefone) return erroNoForm(form, "Telefone não reconhecido. Use DDD + número — por exemplo (44) 99888-7777.");

  const editandoId = form.dataset.lead;
  const valor = d.valorEstimado ? Number(String(d.valorEstimado).replace(/\./g, "").replace(",", ".")) : null;

  if (editandoId) {
    const l = leadDe(editandoId);
    const ct = contatoDe(l.contatoId);
    ct.nome = nome; ct.telefone = telefone; ct.email = d.email || null;
    Object.assign(l, {
      empresa: d.empresa || null, cidade: d.cidade || null, origem: d.origem || null,
      servico: d.servico || null, valorEstimado: Number.isFinite(valor) ? valor : null,
      temperatura: d.temperatura || null, responsavelId: d.responsavelId || S.usuarioId,
    });
    registrar("lead", l.id, "lead.editado");
    salvar(); fecharModal(); render(); toast("Alterações salvas");
    return;
  }

  // Contato existente pelo telefone, ou um novo. É a âncora de identidade:
  // se essa pessoa já falou com a agência, o lead nasce ligado ao histórico.
  let ct = S.contatos.find((c) => c.telefone === telefone);
  const reaproveitado = Boolean(ct);
  if (!ct) { ct = { id: uid(), nome, telefone, email: d.email || null }; S.contatos.push(ct); }

  const naColuna = leadsVivos().filter((l) => l.etapaId === "e1").sort((a, b) => a.ordem - b.ordem);
  const l = {
    id: uid(), contatoId: ct.id, etapaId: "e1",
    ordem: aoInicio(naColuna.length ? naColuna[0].ordem : null),
    empresa: d.empresa || null, cidade: d.cidade || null, origem: d.origem || null,
    servico: d.servico || null, valorEstimado: Number.isFinite(valor) ? valor : null,
    temperatura: d.temperatura || null, responsavelId: d.responsavelId || S.usuarioId,
    observacoes: null, proximaAcao: null, proximoContatoEm: null,
    motivoPerda: null, fechadoEm: null, perdidoEm: null, clienteId: null,
    criadoEm: new Date().toISOString(),
  };
  S.leads.push(l);
  registrar("lead", l.id, "lead.criado", { contatoReaproveitado: reaproveitado });

  salvar(); fecharModal(); ir(`#/lead/${l.id}`);
  toast(reaproveitado ? "Lead criado — o contato já existia, histórico aproveitado" : "Lead criado");
}

function salvarCliente(form, d) {
  const nome = (d.nome || "").trim();
  if (!nome) return erroNoForm(form, "O nome do cliente é obrigatório.");

  const telefone = d.telefone ? normalizarTelefone(d.telefone) : null;
  if (d.telefone && !telefone) return erroNoForm(form, "Telefone não reconhecido. Use DDD + número.");

  const editandoId = form.dataset.cliente;
  const campos = {
    nome, segmento: d.segmento || null, telefone, cidade: d.cidade || null,
    status: d.status, saude: d.saude, responsavelId: d.responsavelId || null,
    observacoes: d.observacoes || "", atualizadoEm: new Date().toISOString(),
  };

  if (editandoId) {
    const c = clienteDe(editandoId);
    Object.assign(c, campos);
    registrar("cliente", c.id, "cliente.editado");
    salvar(); fecharModal(); render(); toast("Alterações salvas");
    return;
  }

  const c = { id: uid(), ...campos, estado: null, contatoId: null, criadoEm: new Date().toISOString() };
  S.clientes.push(c);
  registrar("cliente", c.id, "cliente.criado", { nome });
  salvar(); fecharModal(); ir(`#/cliente/${c.id}`); toast("Cliente criado");
}

function novaAtividade(form, d) {
  const leadId = form.dataset.lead;
  const titulo = (d.titulo || "").trim();
  if (!titulo) return toast("Descreva a atividade.");

  const agendada = d.agendadaPara ? new Date(d.agendadaPara).toISOString() : null;
  S.atividades.push({
    id: uid(), leadId, tipo: d.tipo, titulo,
    responsavelId: S.usuarioId, agendadaPara: agendada, concluidaEm: null,
    criadoEm: new Date().toISOString(),
  });

  // Agendar é definir o próximo contato do lead. Sem isso, o painel mostraria
  // "sem retorno" para quem tem reunião marcada.
  if (agendada) {
    const l = leadDe(leadId);
    l.proximoContatoEm = agendada.slice(0, 10);
    l.proximaAcao = titulo;
  }

  registrar("lead", leadId, "lead.atividade_criada", { titulo });
  salvar(); render(); toast("Atividade registrada");
}

function converter(form, d) {
  const l = leadDe(form.dataset.lead);
  if (!l || l.clienteId) return;

  const ct = contatoDe(l.contatoId);
  const nome = (d.nomeCliente || "").trim() || l.empresa || ct.nome;

  const c = {
    id: uid(), nome, segmento: null, telefone: ct.telefone,
    cidade: l.cidade || null, estado: null, status: "onboarding", saude: "verde",
    responsavelId: l.responsavelId, contatoId: l.contatoId,
    observacoes: l.observacoes || "",
    criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString(),
  };
  S.clientes.push(c);

  const ganho = ETAPAS.find((x) => x.tipo === "ganho");
  l.clienteId = c.id;
  l.fechadoEm = new Date().toISOString();
  l.perdidoEm = null;
  if (ganho) l.etapaId = ganho.id;

  registrar("lead", l.id, "lead.convertido", { cliente: nome, clienteId: c.id });
  registrar("cliente", c.id, "cliente.criado", { nome, origem: "onboarding", leadId: l.id });

  salvar(); ir(`#/cliente/${c.id}`);
  toast("Virou cliente — o contato e o histórico continuam os mesmos");
}

function motivoPerda(form, d) {
  const l = leadDe(form.dataset.lead);
  l.motivoPerda = d.motivo || null;
  registrar("lead", l.id, "lead.perdido", { motivo: d.motivo || null });
  salvar(); render(); toast("Motivo registrado");
}

function salvarDemanda(form, d) {
  const titulo = (d.titulo || "").trim();
  if (!titulo) return erroNoForm(form, "Descreva o que precisa ser feito.");
  if (!d.clienteId) return erroNoForm(form, "Escolha o cliente.");

  const campos = {
    titulo, clienteId: d.clienteId, tipo: d.tipo, responsavelId: d.responsavelId,
    prioridade: d.prioridade, prazo: d.prazo || null, descricao: d.descricao || null,
  };
  const editandoId = form.dataset.id;

  if (editandoId) {
    const atual = demandaDe(editandoId);
    const mudouFase = atual.fase !== d.fase;
    Object.assign(atual, campos);
    registrar("demanda", atual.id, "demanda.editada");
    salvar(); fecharModal();
    // A fase passa pelo mesmo caminho do arrasto: é lá que mora a regra de
    // concluir e a de abrir aprovação. Duplicá-la aqui seria criar duas verdades.
    if (mudouFase) moverDemanda(atual.id, d.fase, null);
    else { render(); toast("Demanda salva"); }
    return;
  }

  const naFase = demandasVivas().filter((x) => x.fase === d.fase).sort((a, b) => a.ordem - b.ordem);
  const nova = {
    id: uid(), ...campos, fase: "backlog",
    ordem: aoInicio(naFase.length ? naFase[0].ordem : null),
    criadoEm: new Date().toISOString(), concluidaEm: null,
  };
  S.demandas.push(nova);
  registrar("demanda", nova.id, "demanda.criada", { titulo });
  salvar(); fecharModal();
  if (d.fase !== "backlog") moverDemanda(nova.id, d.fase, null);
  else { ir("#/operacional"); toast("Demanda criada"); }
}

function novaAprovacao(form, d) {
  const titulo = (d.titulo || "").trim();
  if (!titulo) return erroNoForm(form, "Descreva o que está sendo enviado.");

  S.aprovacoes.push({
    id: uid(), clienteId: d.clienteId, demandaId: null, titulo, tipo: d.tipo,
    status: "pendente", enviadoEm: new Date().toISOString(), respondidoEm: null, comentario: null,
  });
  salvar(); fecharModal(); ir("#/aprovacoes"); toast("Enviado para aprovação");
}

function responderAprovacao(form, botao) {
  const a = S.aprovacoes.find((x) => x.id === form.dataset.id);
  const decisao = botao && botao.value;
  const comentario = (new FormData(form).get("comentario") || "").trim();

  if (decisao === "ajuste" && !comentario) {
    return erroNoForm(form, "Escreva o que o cliente pediu — sem isso ninguém sabe o que refazer.");
  }

  a.status = decisao;
  a.comentario = comentario || null;
  a.respondidoEm = new Date().toISOString();

  // Aprovar fecha a demanda que gerou o pedido; pedir ajuste devolve para a
  // fila de quem faz, com o comentário virando o detalhe da tarefa.
  if (a.demandaId) {
    const d = demandaDe(a.demandaId);
    if (d) {
      if (decisao === "aprovado") moverDemanda(d.id, "concluida", null);
      else {
        d.fase = "fazendo";
        d.descricao = comentario;
        registrar("demanda", d.id, "demanda.ajuste_pedido", { comentario });
      }
    }
  }

  registrar("cliente", a.clienteId, decisao === "aprovado" ? "aprovacao.aprovada" : "aprovacao.ajuste", { titulo: a.titulo });
  salvar(); render();
  toast(decisao === "aprovado" ? "Aprovação registrada" : "Ajuste registrado — voltou para “Fazendo”");
}

function salvarSenha(form, d) {
  if (!d.servico || !d.usuario || !d.segredo) return erroNoForm(form, "Serviço, usuário e senha são obrigatórios.");

  const campos = {
    clienteId: d.clienteId, servico: d.servico.trim(), usuario: d.usuario.trim(),
    segredo: d.segredo, url: d.url || null, atualizadoEm: new Date().toISOString(),
  };
  const editandoId = form.dataset.id;

  if (editandoId) Object.assign(S.senhas.find((x) => x.id === editandoId), campos);
  else S.senhas.push({ id: uid(), ...campos });

  salvar(); fecharModal(); render(); toast("Acesso guardado");
}

function salvarArquivo(form, d) {
  const nome = (d.nome || "").trim();
  if (!nome) return erroNoForm(form, "Dê um nome ao arquivo.");

  const mb = numero(d.mb);
  S.arquivos.push({
    id: uid(), clienteId: d.clienteId, nome, tipo: d.tipo,
    tamanho: Math.round((mb || 1) * 1048576), criadoEm: new Date().toISOString(),
  });
  salvar(); fecharModal(); render(); toast("Arquivo registrado");
}

function salvarDespesa(form, d) {
  const valor = numero(d.valor);
  if (!d.descricao || !d.descricao.trim()) return erroNoForm(form, "Descreva a despesa.");
  if (valor === null || valor <= 0) return erroNoForm(form, "Informe um valor — por exemplo 480 ou 1.250,90.");

  S.despesas.push({
    id: uid(), descricao: d.descricao.trim(), categoria: d.categoria,
    valor, vencimento: d.vencimento, pagoEm: null, recorrente: false,
  });
  // Salta para a competência do lançamento: senão a despesa some da tela,
  // e quem lançou acha que não gravou.
  mesFinanceiro = d.vencimento.slice(0, 7);
  salvar(); fecharModal(); render(); toast("Despesa lançada");
}

function salvarEstrategia(form, d) {
  const clienteId = form.dataset.id;
  const objetivo = (d.objetivo || "").trim();
  if (!objetivo) return erroNoForm(form, "Escreva ao menos o objetivo.");

  const campos = {
    objetivo, publico: (d.publico || "").trim(), canais: (d.canais || "").trim(),
    verbaMensal: numero(d.verbaMensal), atualizadoEm: new Date().toISOString(),
  };
  const atual = S.estrategias.find((x) => x.clienteId === clienteId);
  if (atual) Object.assign(atual, campos);
  else S.estrategias.push({ id: uid(), clienteId, ...campos });

  registrar("cliente", clienteId, "estrategia.atualizada");
  salvar(); fecharModal(); render(); toast("Estratégia salva");
}

/* --------------------------------------------------------------- atalhos */
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); buscaAberta ? fecharBusca() : abrirBusca(); }
  if (e.key === "Escape") { if (buscaAberta) fecharBusca(); else fecharModal(); }
});

window.addEventListener("hashchange", render);
render();
</script>
