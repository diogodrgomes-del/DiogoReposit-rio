<title>MARK SISTEM — sistema funcionando</title>

<style>
  /* ============================================================
     Tokens do sistema real (apps/web/src/app/sistema.css).
     Neutro com viés verde herdado da paleta validada para
     daltonismo; acento #2563EB do briefing.
     ============================================================ */
  :root {
    color-scheme: light;
    --ink: #101917; --ink-2: #4e5c58; --ink-3: #82908b;
    --surface: #f5f7f5; --card: #ffffff; --card-2: #fafbfa;
    --border: #dfe5e2; --border-2: #edf1ef;
    --acento: #2563eb; --acento-forte: #1d4ed8; --acento-suave: #eff6ff; --acento-texto: #fff;
    --good: #0f7b4f; --warn: #b26a00; --crit: #c0392b; --s1: #008b80;
    --raio: 6px; --raio-card: 8px;
    --elev-1: 0 1px 2px rgba(16,25,23,.06);
    --elev-2: 0 10px 30px rgba(16,25,23,.14);
    --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ink: #edf2f0; --ink-2: #a5b3ae; --ink-3: #71807a;
      --surface: #121817; --card: #19201e; --card-2: #1d2523;
      --border: #2a3431; --border-2: #222b29;
      --acento: #4b83f0; --acento-forte: #6d9bf5; --acento-suave: #16233c;
      --good: #35a96f; --warn: #d69324; --crit: #e06b5c; --s1: #12a094;
      --elev-1: 0 1px 2px rgba(0,0,0,.35); --elev-2: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #edf2f0; --ink-2: #a5b3ae; --ink-3: #71807a;
    --surface: #121817; --card: #19201e; --card-2: #1d2523;
    --border: #2a3431; --border-2: #222b29;
    --acento: #4b83f0; --acento-forte: #6d9bf5; --acento-suave: #16233c;
    --good: #35a96f; --warn: #d69324; --crit: #e06b5c; --s1: #12a094;
    --elev-1: 0 1px 2px rgba(0,0,0,.35); --elev-2: 0 10px 30px rgba(0,0,0,.5);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ink: #101917; --ink-2: #4e5c58; --ink-3: #82908b;
    --surface: #f5f7f5; --card: #ffffff; --card-2: #fafbfa;
    --border: #dfe5e2; --border-2: #edf1ef;
    --acento: #2563eb; --acento-forte: #1d4ed8; --acento-suave: #eff6ff;
    --good: #0f7b4f; --warn: #b26a00; --crit: #c0392b; --s1: #008b80;
    --elev-1: 0 1px 2px rgba(16,25,23,.06); --elev-2: 0 10px 30px rgba(16,25,23,.14);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .sistema { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 56px 1fr; grid-template-areas: "barra topo" "barra conteudo"; min-height: 100vh; }

  .barra { grid-area: barra; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .marca { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border-2); font-weight: 650; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .logo { width: 26px; height: 26px; border-radius: var(--raio); background: var(--acento); color: var(--acento-texto); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
  .nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
  .nav__grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 14px 12px 6px; }
  .nav__item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--raio); color: var(--ink-2); text-decoration: none; transition: background 150ms ease-out, color 150ms ease-out; white-space: nowrap; cursor: pointer; }
  .nav__item:hover { background: var(--border-2); color: var(--ink); }
  .nav__item[aria-current="page"] { background: var(--acento-suave); color: var(--acento-forte); font-weight: 550; }
  .nav__item svg { flex: none; width: 17px; height: 17px; }
  .barra__pe { padding: 10px 14px; border-top: 1px solid var(--border-2); font-size: 11px; color: var(--ink-3); }
  .barra__pe button { font: inherit; font-size: 11px; background: none; border: none; color: var(--acento); cursor: pointer; padding: 0; text-decoration: underline; }

  .topo { grid-area: topo; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; position: sticky; top: 0; z-index: 20; min-width: 0; }
  .topo__org { flex: none; }
  .topo__org { font-weight: 600; margin: 0; font-size: 15px; }
  .topo__dir { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .topo__dir strong { color: var(--ink); }

  .conteudo { grid-area: conteudo; padding: 24px; max-width: 1400px; width: 100%; min-width: 0; }

  @media (max-width: 1024px) { .sistema { grid-template-columns: 62px 1fr; } .nav__item span, .marca span:last-child { display: none; } .nav__grupo { font-size: 0; padding: 8px 0 2px; } }
  @media (max-width: 720px) {
    .sistema { grid-template-columns: 1fr; grid-template-areas: "topo" "conteudo"; }
    .barra { display: none; }
    .conteudo { padding: 14px; }
    .topo { padding: 0 12px; gap: 10px; }
    /* Nome e papel saem: quem está no celular sabe quem é. O que não pode
       sumir é a busca, que é como se navega sem a barra lateral. */
    .topo__dir span { display: none; }
    .busca-gatilho { flex: 1; }
    .duas-colunas { grid-template-columns: 1fr; }
  }

  /* ---------- controles ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--border); background: var(--card); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 150ms ease-out, border-color 150ms ease-out; }
  .btn:hover:not(:disabled) { background: var(--card-2); border-color: var(--ink-3); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn--acento { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
  .btn--acento:hover:not(:disabled) { background: var(--acento-forte); border-color: var(--acento-forte); }
  .btn--risco { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 35%, var(--border)); }
  .btn--discreto { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn--discreto:hover:not(:disabled) { background: var(--border-2); }
  .btn--pequeno { height: 27px; padding: 0 10px; font-size: 12px; }

  :is(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: var(--raio); }

  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo > span { font-size: 12px; font-weight: 550; color: var(--ink-2); }
  .campo .opcional { font-weight: 400; color: var(--ink-3); }
  .campo :is(input, select, textarea) { height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--raio); background: var(--card); color: var(--ink); font: inherit; width: 100%; }
  .campo textarea { height: auto; min-height: 80px; padding: 8px 10px; resize: vertical; }
  .campo :is(input, select, textarea):focus { border-color: var(--acento); }
  .campo--erro :is(input, select, textarea) { border-color: var(--crit); }
  .campo__erro { font-size: 12px; color: var(--crit); }

  /* ---------- estrutura de página ---------- */
  .pagina__cabeca { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .pagina__titulo { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 4px; text-wrap: balance; }
  .pagina__sub { color: var(--ink-3); font-size: 13px; margin: 0; }
  .secao-rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 10px; font-weight: 600; }

  .cartao { background: var(--card); border: 1px solid var(--border); border-radius: var(--raio-card); box-shadow: var(--elev-1); }
  .cartao__cabeca { padding: 14px 16px; border-bottom: 1px solid var(--border-2); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cartao__corpo { padding: 16px; }
  .grade-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

  .indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .indicador { background: var(--card); border: 1px solid var(--border); border-radius: var(--raio-card); padding: 14px 16px; display: block; color: inherit; text-decoration: none; }
  a.indicador { cursor: pointer; transition: border-color 150ms ease-out; }
  a.indicador:hover { border-color: var(--acento); }
  .indicador__rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 4px; }
  .indicador__valor { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 0; font-variant-numeric: tabular-nums; }
  .indicador__nota { margin: 4px 0 0; font-size: 12px; color: var(--ink-3); }

  .selo { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; border: 1px solid var(--border); background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
  .selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .selo--verde { color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
  .selo--ambar { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .selo--vermelho { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 30%, transparent); background: color-mix(in srgb, var(--crit) 10%, transparent); }

  .rolagem { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--card-2); }
  td a { color: var(--ink); text-decoration: none; font-weight: 550; cursor: pointer; }
  td a:hover { color: var(--acento); }
  .num { font-variant-numeric: tabular-nums; }

  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }

  .estado { text-align: center; padding: 44px 24px; color: var(--ink-3); }
  .estado__titulo { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; }
  .estado__texto { margin: 0 auto 16px; max-width: 380px; font-size: 13px; }

  .aviso-erro { background: color-mix(in srgb, var(--crit) 10%, transparent); border: 1px solid color-mix(in srgb, var(--crit) 30%, transparent); color: var(--crit); border-radius: var(--raio); padding: 10px 12px; font-size: 13px; margin: 0 0 16px; }

  /* ---------- quadro Kanban ---------- */
  .quadro { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; min-height: 320px; }
  .quadro__coluna { flex: 0 0 250px; background: var(--card-2); border: 1px solid var(--border); border-radius: var(--raio-card); display: flex; flex-direction: column; transition: border-color 120ms ease-out, background 120ms ease-out; }
  .quadro__coluna.alvo { border-color: var(--acento); background: var(--acento-suave); }
  .quadro__cabeca { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
  .contagem { background: var(--border); color: var(--ink-2); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .quadro__cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 70px; flex: 1; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--raio); padding: 10px; box-shadow: var(--elev-1); cursor: grab; transition: box-shadow 150ms ease-out, opacity 150ms ease-out; }
  .card:hover { box-shadow: var(--elev-2); }
  .card.arrastando { opacity: .4; }
  .card__nome { display: block; font-weight: 600; color: var(--ink); text-decoration: none; margin-bottom: 4px; cursor: pointer; }
  .card__nome:hover { color: var(--acento); }
  .card__linha { margin: 0; font-size: 12px; color: var(--ink-3); }
  .card__pe { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; }
  .card__pe strong { font-variant-numeric: tabular-nums; }
  .card__resp { margin: 6px 0 0; font-size: 11px; color: var(--ink-3); }
  .vazio { color: var(--ink-3); font-size: 12px; text-align: center; padding: 20px 8px; margin: 0; }

  /* ---------- linha do tempo ---------- */
  .tempo { list-style: none; margin: 0; padding: 0; }
  .tempo__item { display: grid; grid-template-columns: 12px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
  .tempo__item:not(:last-child)::before { content: ""; position: absolute; left: 5px; top: 14px; bottom: 0; width: 1px; background: var(--border); }
  .tempo__ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--acento); margin-top: 5px; z-index: 1; }
  .tempo__texto { font-size: 13px; margin: 0; }
  .tempo__quando { font-size: 12px; color: var(--ink-3); margin: 2px 0 0; }

  /* `min-width: 0` nos filhos: sem isso um item de grid cresce até caber a
     tabela mais larga que ele contém, e a página inteira ganha rolagem
     lateral no celular — mesmo com a tabela dentro de `.rolagem`. */
  .duas-colunas { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); }
  .duas-colunas > * { min-width: 0; }
  @media (max-width: 900px) { .duas-colunas { grid-template-columns: 1fr; } }
  .dado__rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
  .dado__valor { margin-top: 2px; }
  .link-acento { color: var(--acento); text-decoration: none; }

  /* ---------- busca ⌘K ---------- */
  .busca-gatilho { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--raio); background: var(--card-2); color: var(--ink-3); font: inherit; font-size: 13px; cursor: pointer; min-width: 210px; }
  .busca-gatilho:hover { border-color: var(--ink-3); color: var(--ink-2); }
  .busca-gatilho svg { width: 15px; height: 15px; flex: none; }
  .busca-gatilho span { flex: 1; text-align: left; }
  .busca-gatilho kbd { font: inherit; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--card); }
  @media (max-width: 720px) { .busca-gatilho { min-width: 0; } .busca-gatilho span, .busca-gatilho kbd { display: none; } }

  .fundo { position: fixed; inset: 0; background: rgba(16,25,23,.4); backdrop-filter: blur(2px); z-index: 100; display: flex; justify-content: center; padding: 12vh 16px 16px; }
  .busca-caixa { width: min(560px, 100%); max-height: 62vh; background: var(--card); border: 1px solid var(--border); border-radius: var(--raio-card); box-shadow: var(--elev-2); display: flex; flex-direction: column; overflow: hidden; align-self: flex-start; }
  .busca-campo { border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 14px 16px; outline: none; width: 100%; }
  .busca-lista { overflow-y: auto; padding: 6px; }
  .busca-item { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: none; border-radius: var(--raio); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .busca-item--ativo { background: var(--acento-suave); }
  .busca-tipo { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; flex: none; }
  .busca-titulo { font-weight: 550; }
  .busca-sub { color: var(--ink-3); font-size: 12px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .busca-aviso { color: var(--ink-3); font-size: 13px; padding: 16px; margin: 0; text-align: center; }

  /* ---------- modal ---------- */
  .modal { width: min(620px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: var(--raio-card); box-shadow: var(--elev-2); align-self: flex-start; max-height: 84vh; display: flex; flex-direction: column; }
  .modal__cabeca { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .modal__corpo { padding: 18px; overflow-y: auto; }
  .modal__pe { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .modal h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }

  /* ---------- aviso de sessão / feedback ---------- */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 999px; font-size: 13px; box-shadow: var(--elev-2); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 200ms ease-out, transform 200ms ease-out; }
  .toast.visivel { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .faixa-demo { background: var(--acento-suave); border-bottom: 1px solid color-mix(in srgb, var(--acento) 25%, transparent); color: var(--acento-forte); font-size: 12.5px; padding: 8px 20px; display: flex; gap: 10px; align-items: center; justify-content: center; text-align: center; }
  .faixa-demo b { font-weight: 650; }

  /* ---------- login ---------- */
  .login-tela { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-caixa { width: min(360px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: var(--raio-card); box-shadow: var(--elev-1); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .login-caixa h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }

  /* ---------- avisos no menu ---------- */
  .pino { margin-left: auto; background: var(--acento); color: var(--acento-texto); border-radius: 999px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
  @media (max-width: 1024px) { .pino { position: absolute; margin: 0; transform: translate(14px, -10px); } .nav__item { position: relative; } }

  /* ---------- abas da ficha ---------- */
  .abas { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
  .aba { border: none; background: none; font: inherit; color: var(--ink-2); padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; border-radius: var(--raio) var(--raio) 0 0; }
  .aba:hover { background: var(--border-2); color: var(--ink); }
  .aba[aria-selected="true"] { color: var(--acento-forte); border-bottom-color: var(--acento); font-weight: 600; }

  /* ---------- barra de progresso / mini-gráfico ---------- */
  .barra-prog { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .barra-prog > i { display: block; height: 100%; background: var(--acento); border-radius: 999px; }
  .colunas-mini { display: flex; align-items: flex-end; gap: 2px; height: 44px; }
  .colunas-mini i { flex: 1; background: color-mix(in srgb, var(--acento) 55%, transparent); border-radius: 2px 2px 0 0; min-height: 2px; }
  .colunas-mini i:last-child { background: var(--acento); }

  /* ---------- cofre ---------- */
  .segredo { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 13px; letter-spacing: .04em; }
  .caixa-aviso { background: var(--card-2); border: 1px solid var(--border); border-left: 3px solid var(--acento); border-radius: var(--raio); padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
  .caixa-aviso strong { color: var(--ink); }
  .caixa-bloqueio { text-align: center; padding: 40px 24px; }
  .caixa-bloqueio svg { width: 34px; height: 34px; color: var(--ink-3); margin-bottom: 10px; }

  .lista-seca { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .lista-seca li { display: flex; gap: 12px; align-items: center; justify-content: space-between; }

  .dia { border-top: 1px solid var(--border-2); padding: 14px 16px; }
  .dia:first-child { border-top: none; }
  .dia__cabeca { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .dia__nome { font-weight: 600; text-transform: capitalize; }
  .dia--hoje .dia__nome { color: var(--acento-forte); }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

const DDDS = new Set([11,12,13,14,15,16,17,18,19,21,22,24,27,28,31,32,33,34,35,37,38,
  41,42,43,44,45,46,47,48,49,51,53,54,55,61,62,63,64,65,66,67,68,69,71,73,74,75,77,79,

function normalizarTelefone(bruto) {
  if (!bruto) return null;
  const tinhaMais = String(bruto).trim().startsWith("+");
  let d = String(bruto).replace(/\D/g, "");
  if (!d) return null;

  if (tinhaMais && !d.startsWith("55")) return d.length >= 8 && d.length <= 15 ? "+" + d : null;
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length >= 12 && d.startsWith("55")) d = d.slice(2);
  if (d.length > 11 && d.startsWith("0")) d = d.replace(/^0+/, "");
  if ((d.length === 11 || d.length === 12) && d.startsWith("0")) d = d.slice(1);
  if (d.length !== 10 && d.length !== 11) return null;

  const ddd = Number(d.slice(0, 2));
  if (!DDDS.has(ddd)) return null;

  let ass = d.slice(2);
  // Nono dígito: celular antigo de 8 dígitos ganha o 9 na frente.
  if (ass.length === 8 && /^[6-9]/.test(ass)) ass = "9" + ass;
  if (ass.length === 9 && !ass.startsWith("9")) return null;
  if (ass.length === 8 && !/^[2-5]/.test(ass)) return null;
  return "+55" + ddd + ass;
}

function formatarTelefone(e164) {
  if (!e164) return "";
  if (!e164.startsWith("+55")) return e164;
  const d = e164.slice(3);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return e164;
}

/* ----------------------------------------------------- ordenação do Kanban */
const PASSO = 1000, MINIMO = 1e-6;

function entre(anterior, proximo) {
  if (anterior === null && proximo === null) return PASSO;
  if (anterior === null) return proximo - PASSO;
  if (proximo === null) return anterior + PASSO;
  if (proximo - anterior < MINIMO) return null;
  return anterior + (proximo - anterior) / 2;
}
const aoInicio = (p) => p === null ? PASSO : p - PASSO;

/* ---------------------------------------------------------------- utilidades */
const semAcento = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/** Similaridade por bigramas — o que o pg_trgm faz no banco. */
function similaridade(a, b) {
  const A = semAcento(a), B = semAcento(b);
  if (!A || !B) return 0;
  if (A.includes(B) || B.includes(A)) return 1;
  const par = (s) => { const r = new Set(); for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i + 2)); return r; };
  const pa = par(A), pb = par(B);
  if (!pa.size || !pb.size) return 0;
  let comuns = 0;
  pb.forEach((g) => { if (pa.has(g)) comuns++; });
  return (2 * comuns) / (pa.size + pb.size);
}

  if (seg < 604800) return `há ${Math.floor(seg / 86400)} d`;
  return fmtData.format(new Date(iso));
}

let S = carregar();

function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE);
    if (bruto) {
      // Preenche coleções que não existiam quando o dado foi gravado. Sem isso,
      // uma tela nova quebraria no primeiro `.filter` de quem já tinha usado.
      const salvo = JSON.parse(bruto);
      const padrao = dadosIniciais();
      for (const chave of Object.keys(padrao)) {
        if (salvo[chave] === undefined) salvo[chave] = Array.isArray(padrao[chave]) ? [] : padrao[chave];
      }
      return salvo;
    }
  } catch (e) { /* storage indisponível: segue com dados de exemplo */ }
  return dadosIniciais();
}

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); }
  catch (e) { /* modo privado pode recusar; o app continua em memória */ }
}

function reiniciar() {
  S = dadosIniciais();
  salvar();
  ir("#/painel");
  toast("Dados de exemplo restaurados");
}

const tamanho = (bytes) => {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return Math.round(bytes / 1024) + " KB";
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1).replace(".", ",") + " MB";
  return (bytes / 1073741824).toFixed(1).replace(".", ",") + " GB";
};

function telaPainel() {
  const vivos = leadsVivos();
  const abertos = vivos.filter((l) => !l.fechadoEm && !l.perdidoEm);
  const hoje = hojeISO();
  const semRetorno = abertos.filter((l) => l.proximoContatoEm && l.proximoContatoEm < hoje);
  const paraHoje = abertos.filter((l) => l.proximoContatoEm && l.proximoContatoEm <= hoje);
  const novos = vivos.filter((l) => new Date(l.criadoEm) > new Date(Date.now() - 7 * 86400000));
  const fechados = vivos.filter((l) => l.fechadoEm);
  const valorAberto = abertos.reduce((s, l) => s + (l.valorEstimado || 0), 0);

  const cli = clientesVivos();
  const eu = usuarioDe(S.usuarioId);

  const andamento = demandasVivas().filter((d) => d.fase !== "concluida");
  const atrasadas = andamento.filter((d) => d.prazo && d.prazo < hoje);
  const minhas = andamento.filter((d) => d.responsavelId === S.usuarioId);

  const comp = competencia();

  const doMes = S.cobrancas.filter((b) => b.competencia === comp);
  const recebido = doMes.filter((b) => b.pagoEm).reduce((s, b) => s + b.valor, 0);
  const aReceber = doMes.filter((b) => !b.pagoEm && b.vencimento >= hoje).reduce((s, b) => s + b.valor, 0);
  const vencido = vencidas().reduce((s, b) => s + b.valor, 0);
  const despesasPagas = S.despesas.filter((x) => x.pagoEm && x.pagoEm.startsWith(comp)).reduce((s, x) => s + x.valor, 0);

  const linhaAtencao = paraHoje.map((l) => {
    const ct = contatoDe(l.contatoId);

  return `

    </section>` : ""}`;

let filtrosVendas = { q: "", responsavel: "", temperatura: "" };

function telaVendas() {
  const vivos = leadsVivos().filter((l) => {
    if (filtrosVendas.responsavel && l.responsavelId !== filtrosVendas.responsavel) return false;
    if (filtrosVendas.temperatura && l.temperatura !== filtrosVendas.temperatura) return false;
    if (filtrosVendas.q) {
      const ct = contatoDe(l.contatoId);
      const alvo = semAcento(`${ct.nome} ${ct.telefone || ""} ${l.empresa || ""}`);
      if (!alvo.includes(semAcento(filtrosVendas.q))) return false;
    }
    return true;
  });

  const abertos = leadsVivos().filter((l) => !l.fechadoEm && !l.perdidoEm);
  const valorAberto = abertos.reduce((s, l) => s + (l.valorEstimado || 0), 0);
  const hoje = hojeISO();
  const semRetorno = abertos.filter((l) => l.proximoContatoEm && l.proximoContatoEm < hoje).length;

  const colunas = ETAPAS.map((et) => {
    const cards = vivos.filter((l) => l.etapaId === et.id).sort((a, b) => a.ordem - b.ordem);
    return `
      <section class="quadro__coluna" data-etapa="${et.id}" aria-label="${et.nome}">
        <header class="quadro__cabeca"><span>${et.nome}</span><span class="contagem">${cards.length}</span></header>
        <div class="quadro__cards" data-cards="${et.id}">
          ${cards.length === 0 ? '<p class="vazio">Arraste um card para cá</p>' : ""}
          ${cards.map((l) => {
            const ct = contatoDe(l.contatoId);
            const resp = usuarioDe(l.responsavelId);
            const tempClasse = l.temperatura === "quente" ? "selo--vermelho" : l.temperatura === "morno" ? "selo--ambar" : "";
            return `
              <article class="card" draggable="true" data-lead="${l.id}">
                <a class="card__nome" href="#/lead/${l.id}">${esc(ct.nome)}</a>
                ${l.empresa ? `<p class="card__linha">${esc(l.empresa)}</p>` : ""}
                ${ct.telefone ? `<p class="card__linha">${formatarTelefone(ct.telefone)}</p>` : ""}
                <div class="card__pe">
                  ${l.valorEstimado ? `<strong>${moeda.format(l.valorEstimado)}</strong>` : "<span></span>"}
                  ${l.temperatura ? `<span class="selo ${tempClasse}">${l.temperatura}</span>` : ""}
                </div>
                ${resp ? `<p class="card__resp">${esc(resp.nome)}</p>` : ""}
              </article>`;
          }).join("")}
        </div>
      </section>`;
  }).join("");

  return `
    <div class="pagina__cabeca">
      <div>
        <h1 class="pagina__titulo">Comercial</h1>
        <p class="pagina__sub">Arraste os cards entre as etapas</p>
      </div>
      ${pode("vendas.criar") || pode("vendas.editar") ? '<button class="btn btn--acento" data-acao="novo-lead">Novo lead</button>' : ""}
    </div>

    <div class="indicadores" style="margin-bottom:18px">
      <div class="indicador"><p class="indicador__rotulo">Em aberto</p><p class="indicador__valor">${abertos.length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Valor em aberto</p><p class="indicador__valor">${moeda.format(valorAberto)}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Fechados</p><p class="indicador__valor">${leadsVivos().filter((l) => l.fechadoEm).length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Perdidos</p><p class="indicador__valor">${leadsVivos().filter((l) => l.perdidoEm).length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Sem retorno</p><p class="indicador__valor"${semRetorno ? ' style="color:var(--crit)"' : ""}>${semRetorno}</p></div>
    </div>

    <form class="filtros" data-form="filtros-vendas">
      <label class="campo" style="min-width:220px"><span>Buscar</span>
        <input name="q" value="${esc(filtrosVendas.q)}" placeholder="Nome, telefone ou empresa"></label>
      <label class="campo" style="min-width:170px"><span>Responsável</span>
        <select name="responsavel">
          <option value="">Todos</option>
          ${EQUIPE.map((u) => `<option value="${u.id}"${filtrosVendas.responsavel === u.id ? " selected" : ""}>${u.nome}</option>`).join("")}
        </select></label>
      <label class="campo" style="min-width:150px"><span>Temperatura</span>
        <select name="temperatura">
          <option value="">Todas</option>
          ${["quente", "morno", "frio"].map((t) => `<option value="${t}"${filtrosVendas.temperatura === t ? " selected" : ""}>${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}
        </select></label>
      <button class="btn" type="submit">Filtrar</button>
      ${(filtrosVendas.q || filtrosVendas.responsavel || filtrosVendas.temperatura)
        ? '<button class="btn btn--discreto" type="button" data-acao="limpar-filtros">Limpar</button>' : ""}
    </form>

    <div class="quadro">${colunas}</div>`;
}

/* -------------------------------------------------------------- tela: lead */
function telaLead(id) {
  const l = leadDe(id);
  if (!l) return `<div class="cartao"><div class="estado">
    <h2 class="estado__titulo">Lead não encontrado</h2>
    <a class="btn" href="#/vendas">Voltar ao quadro</a></div></div>`;

  const ct = contatoDe(l.contatoId);
  const resp = usuarioDe(l.responsavelId);
  const zap = linkWhatsApp(ct.telefone);
  const etapa = etapaDe(l.etapaId);
  const perdido = Boolean(l.perdidoEm);
  const atividades = S.atividades.filter((a) => a.leadId === l.id && !a.excluidoEm)
    .sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));

  const dado = (rotulo, valor) =>
    `<div><div class="dado__rotulo">${rotulo}</div><div class="dado__valor">${valor || "—"}</div></div>`;

  return `
    <div class="pagina__cabeca">
      <div>
        <h1 class="pagina__titulo">${esc(ct.nome)}</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="selo">${etapa.nome}</span>
          ${l.fechadoEm ? '<span class="selo selo--verde">Fechado</span>' : ""}
          ${perdido ? '<span class="selo selo--vermelho">Perdido</span>' : ""}
          ${l.empresa ? `<span class="pagina__sub">${esc(l.empresa)}</span>` : ""}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn btn--discreto" href="#/vendas">Voltar ao quadro</a>
        ${zap ? `<a class="btn btn--acento" href="${zap}" target="_blank" rel="noreferrer">Abrir no WhatsApp</a>` : ""}
      </div>
    </div>

    <div class="duas-colunas">
      <div style="display:grid;gap:16px;align-content:start">
        <div class="cartao">
          <div class="cartao__cabeca"><strong>Dados</strong>
            <button class="btn btn--pequeno" data-acao="editar-lead" data-id="${l.id}">Editar</button></div>
          <div class="cartao__corpo grade-2">
            ${dado("Telefone", zap ? `<a class="link-acento" href="${zap}" target="_blank" rel="noreferrer">${formatarTelefone(ct.telefone)}</a>` : "")}
            ${dado("E-mail", esc(ct.email || ""))}
            ${dado("Empresa", esc(l.empresa || ""))}
            ${dado("Cidade", esc(l.cidade || ""))}
            ${dado("Origem", esc(l.origem || ""))}
            ${dado("Serviço", esc(l.servico || ""))}
            ${dado("Valor estimado", l.valorEstimado ? moedaExata.format(l.valorEstimado) : "")}
            ${dado("Temperatura", esc(l.temperatura || ""))}
            ${dado("Responsável", esc(resp ? resp.nome : ""))}
            ${dado("Criado em", fmtData.format(new Date(l.criadoEm)))}
          </div>
        </div>

        <div class="cartao">
          <div class="cartao__cabeca"><strong>Atividades</strong>
            <span class="pagina__sub">${atividades.length}</span></div>

          <div class="cartao__corpo" style="border-bottom:1px solid var(--border-2)">
            <form data-form="nova-atividade" data-lead="${l.id}" style="display:grid;gap:10px">
              <div class="erro-form"></div>
              <div style="display:grid;gap:10px;grid-template-columns:150px 1fr">
                <label class="campo"><span>Tipo</span>
                  <select name="tipo">${Object.entries(TIPOS_ATIVIDADE).map(([v, r]) => `<option value="${v}">${r}</option>`).join("")}</select>
                </label>
                <label class="campo"><span>O que aconteceu, ou o que fazer</span>
                  <input name="titulo" required maxlength="200" placeholder="Ligou, sem resposta"></label>
              </div>
              <label class="campo"><span>Agendar para <span class="opcional">· opcional</span></span>
                <input name="agendadaPara" type="datetime-local"></label>
              <p class="pagina__sub" style="margin:0">Com data, vira o próximo contato do lead e aparece no painel.</p>
              <div><button class="btn" type="submit">Registrar</button></div>
            </form>
          </div>

          <div class="cartao__corpo">
            ${atividades.length === 0 ? '<p class="pagina__sub" style="margin:0">Nada registrado ainda.</p>' : `
              <ul class="tempo">${atividades.map((a) => {
                const r = usuarioDe(a.responsavelId);
                const atrasada = !a.concluidaEm && a.agendadaPara && new Date(a.agendadaPara) < new Date();
                const cor = a.concluidaEm ? "var(--good)" : atrasada ? "var(--crit)" : "var(--acento)";
                return `<li class="tempo__item">
                  <span class="tempo__ponto" style="background:${cor}"></span>
                  <div>
                    <p class="tempo__texto"><strong>${TIPOS_ATIVIDADE[a.tipo] || a.tipo}</strong> · ${esc(a.titulo)}</p>
                    <p class="tempo__quando">${a.agendadaPara ? fmtDataHora.format(new Date(a.agendadaPara)) : "sem data"}${r ? " · " + esc(r.nome) : ""}${a.concluidaEm ? " · concluída" : atrasada ? " · atrasada" : ""}</p>
                    ${!a.concluidaEm ? `<button class="btn btn--discreto btn--pequeno" style="margin-top:6px" data-acao="concluir-atividade" data-id="${a.id}">Marcar como feita</button>` : ""}
                  </div></li>`;
              }).join("")}</ul>`}

        </div>

        <div class="cartao">
          <div class="cartao__cabeca"><strong>Histórico</strong></div>
          <div class="cartao__corpo">
            <ul class="tempo">${historicoDe("lead", l.id).map((e) => `
              <li class="tempo__item"><span class="tempo__ponto"></span>
                <div><p class="tempo__texto">${descreverEvento(e)}</p>
                  <p class="tempo__quando">${fmtDataHora.format(new Date(e.criadoEm))}</p></div></li>`).join("")}
            </ul>
          </div>
        </div>
      </div>

      <div style="display:grid;gap:16px;align-content:start">
        ${!perdido && !l.clienteId ? `
          <div class="cartao">
            <div class="cartao__cabeca"><strong>Fechou?</strong></div>
            <div class="cartao__corpo">
              <p class="pagina__sub" style="margin-bottom:12px">
                Vira cliente sem copiar nada: o contato continua o mesmo, então o histórico
                e a conversa de WhatsApp seguem junto.
              </p>
              <form data-form="converter" data-lead="${l.id}" style="display:grid;gap:10px">
                <div class="erro-form"></div>
                <label class="campo"><span>Nome do cliente <span class="opcional">· opcional</span></span>
                  <input name="nomeCliente" value="${esc(l.empresa || ct.nome)}"></label>
                <button class="btn btn--acento" type="submit">Transformar em cliente</button>
              </form>
            </div>
          </div>` : ""}

        ${l.clienteId ? `
          <div class="cartao">
            <div class="cartao__cabeca"><strong>Virou cliente</strong></div>
            <div class="cartao__corpo">
              <a class="btn" href="#/cliente/${l.clienteId}">Abrir ficha do cliente</a>
            </div>
          </div>` : ""}

        ${perdido ? `
          <div class="cartao">
            <div class="cartao__cabeca"><strong>Motivo da perda</strong></div>
            <div class="cartao__corpo">
              ${l.motivoPerda ? `<p style="margin:0">${MOTIVOS[l.motivoPerda] || esc(l.motivoPerda)}</p>` : `
                <form data-form="motivo-perda" data-lead="${l.id}" style="display:grid;gap:10px">
                  <label class="campo"><span class="opcional">Pode pular, se não souber</span>
                    <select name="motivo"><option value="">Não informar</option>
                      ${Object.entries(MOTIVOS).map(([v, r]) => `<option value="${v}">${r}</option>`).join("")}
                    </select></label>
                  <button class="btn" type="submit">Registrar</button>
                </form>`}
            </div>
          </div>` : ""}

        <div class="cartao">
          <div class="cartao__cabeca"><strong>Próximo passo</strong></div>
          <div class="cartao__corpo">
            <div class="dado__rotulo">Ação</div>
            <div class="dado__valor" style="margin-bottom:12px">${esc(l.proximaAcao || "—")}</div>
            <div class="dado__rotulo">Retorno em</div>
            <div class="dado__valor num">${l.proximoContatoEm ? fmtData.format(new Date(l.proximoContatoEm + "T12:00:00")) : "—"}</div>
          </div>
        </div>

        <div class="cartao">
          <div class="cartao__cabeca"><strong>Zona de risco</strong></div>
          <div class="cartao__corpo">
            <p class="pagina__sub" style="margin-bottom:12px">Sai das listas, mas nada é apagado.</p>
            <button class="btn btn--risco" data-acao="excluir-lead" data-id="${l.id}">Enviar para a lixeira</button>
          </div>
        </div>
      </div>
    </div>`;
}

function descreverEvento(e) {
  switch (e.tipo) {
    case "lead.criado": return e.dados.contatoReaproveitado ? "Lead criado — contato já existia, histórico aproveitado" : "Lead criado";
    case "lead.etapa_alterada": return `Etapa: ${esc(e.dados.de)} → ${esc(e.dados.para)}`;
    case "lead.convertido": return `Virou cliente: ${esc(e.dados.cliente)}`;
    case "lead.perdido": return `Perdido${e.dados.motivo ? " · " + (MOTIVOS[e.dados.motivo] || e.dados.motivo) : ""}`;
    case "lead.editado": return "Dados editados";
    case "lead.excluido": return "Enviado para a lixeira";
    case "lead.atividade_criada": return `Atividade: ${esc(e.dados.titulo)}`;
    case "lead.atividade_concluida": return `Concluída: ${esc(e.dados.titulo)}`;
    case "cliente.criado": return e.dados.origem === "onboarding" ? "Cliente criado a partir de um lead" : "Cliente criado";
    case "cliente.editado": return "Dados editados";
    case "demanda.criada": return `Demanda criada: ${esc(e.dados.titulo)}`;
    case "demanda.editada": return "Demanda editada";
    case "demanda.fase_alterada": return `Demanda movida para ${esc(e.dados.para)}`;
    case "demanda.ajuste_pedido": return `Ajuste pedido: ${esc(e.dados.comentario)}`;
    case "aprovacao.aprovada": return `Cliente aprovou: ${esc(e.dados.titulo)}`;
    case "aprovacao.ajuste": return `Cliente pediu ajuste: ${esc(e.dados.titulo)}`;
    case "financeiro.recebido": return `Mensalidade recebida — ${moedaExata.format(e.dados.valor)}`;
    case "estrategia.atualizada": return "Estratégia atualizada";
    case "senha.revelada": return "Senha revelada";
    case "senha.copiada": return "Senha copiada";
    default: return esc(e.tipo);
  }
}

/* ---------------------------------------------------------- tela: clientes */
let filtrosClientes = { q: "", status: "" };

function telaClientes() {
  const lista = S.clientes.filter((c) => {
    if (c.excluidoEm) return false;
    if (filtrosClientes.status && c.status !== filtrosClientes.status) return false;
    if (filtrosClientes.q && !semAcento(c.nome + " " + (c.segmento || "")).includes(semAcento(filtrosClientes.q))) return false;
    return true;
  }).sort((a, b) => b.atualizadoEm.localeCompare(a.atualizadoEm));

  const filtrando = Boolean(filtrosClientes.q || filtrosClientes.status);

  return `
    <div class="pagina__cabeca">
      <div><h1 class="pagina__titulo">Clientes</h1>
        <p class="pagina__sub">${lista.length === 0 ? "Nenhum cliente nesta visão" : `${lista.length} cliente${lista.length > 1 ? "s" : ""}`}</p></div>
      ${pode("clientes.criar") || pode("clientes.editar") ? '<button class="btn btn--acento" data-acao="novo-cliente">Novo cliente</button>' : ""}
    </div>

    <form class="filtros" data-form="filtros-clientes">
      <label class="campo" style="min-width:250px"><span>Buscar</span>
        <input name="q" value="${esc(filtrosClientes.q)}" placeholder="Nome ou segmento"></label>
      <label class="campo" style="min-width:180px"><span>Status</span>
        <select name="status"><option value="">Todos</option>
          ${Object.entries(STATUS_CLIENTE).map(([v, r]) => `<option value="${v}"${filtrosClientes.status === v ? " selected" : ""}>${r}</option>`).join("")}
        </select></label>
      <button class="btn" type="submit">Filtrar</button>
      ${filtrando ? '<button class="btn btn--discreto" type="button" data-acao="limpar-clientes">Limpar</button>' : ""}
    </form>

    <div class="cartao">
      ${lista.length === 0 ? `
        <div class="estado">
          <h2 class="estado__titulo">${filtrando ? "Nada encontrado" : "Nenhum cliente ainda"}</h2>
          <p class="estado__texto">${filtrando ? "Nenhum cliente combina com esses filtros." : "Feche um lead no pipeline, ou cadastre à mão."}</p>
          ${filtrando ? '<button class="btn" data-acao="limpar-clientes">Limpar filtros</button>'
            : '<button class="btn btn--acento" data-acao="novo-cliente">Cadastrar cliente</button>'}
        </div>` : `
        <div class="rolagem"><table>
          <thead><tr><th>Cliente</th><th>Status</th><th>Saúde</th><th>Telefone</th><th>Cidade</th><th>Atualizado</th></tr></thead>
          <tbody>${lista.map((c) => `
            <tr>
              <td><a href="#/cliente/${c.id}">${esc(c.nome)}</a>
                ${c.segmento ? `<div class="pagina__sub">${esc(c.segmento)}</div>` : ""}</td>
              <td>${seloStatus(c.status)}</td>
              <td>${seloSaude(c.saude)}</td>
              <td class="num">${formatarTelefone(c.telefone) || "—"}</td>
              <td>${esc(c.cidade || "—")}</td>
              <td class="pagina__sub">${quando(c.atualizadoEm)}</td>
            </tr>`).join("")}</tbody>
        </table></div>`}
    </div>`;
}

function seloStatus(s) {
  const classe = s === "ativo" ? "selo--verde"
    : ["inadimplente", "cancelado", "encerrado"].includes(s) ? "selo--vermelho"
    : ["em_risco", "pausado"].includes(s) ? "selo--ambar" : "";
  return `<span class="selo ${classe}">${STATUS_CLIENTE[s]}</span>`;
}
function seloSaude(s) {
  const classe = s === "verde" ? "selo--verde" : s === "amarelo" ? "selo--ambar" : "selo--vermelho";
  return `<span class="selo ${classe}">${SAUDE_CLIENTE[s]}</span>`;
}

/* ----------------------------------------------------------- tela: cliente */
let abaCliente = "geral";

function telaCliente(id) {
  const c = clienteDe(id);
  if (!c) return `<div class="cartao"><div class="estado">
    <h2 class="estado__titulo">Cliente não encontrado</h2><a class="btn" href="#/clientes">Voltar</a></div></div>`;

  const abas = [
    { id: "geral", rotulo: "Visão geral", perm: null },
    { id: "entrega", rotulo: "Entrega", perm: "operacional.ler" },
    { id: "financeiro", rotulo: "Financeiro", perm: "financeiro.ler" },
    { id: "estrategia", rotulo: "Estratégia", perm: "estrategia.ler" },
    { id: "acessos", rotulo: "Arquivos e acessos", perm: "arquivos.ler" },
    { id: "historico", rotulo: "Histórico", perm: null },
  ].filter((a) => !a.perm || pode(a.perm));

  const atual = abas.some((a) => a.id === abaCliente) ? abaCliente : "geral";

  return `
    <div class="pagina__cabeca">
      <div><h1 class="pagina__titulo">${esc(c.nome)}</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${seloStatus(c.status)}${seloSaude(c.saude)}
          ${c.segmento ? `<span class="pagina__sub">${esc(c.segmento)}</span>` : ""}
        </div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn btn--discreto" href="#/clientes">Voltar</a>
        ${linkWhatsApp(c.telefone) ? `<a class="btn" href="${linkWhatsApp(c.telefone)}" target="_blank" rel="noreferrer">WhatsApp</a>` : ""}
        ${pode("clientes.editar") ? `<button class="btn btn--acento" data-acao="editar-cliente" data-id="${c.id}">Editar</button>` : ""}
      </div>
    </div>

    <div class="abas" role="tablist">
      ${abas.map((a) => `<button class="aba" role="tab" aria-selected="${a.id === atual}"
        data-acao="aba-cliente" data-aba="${a.id}">${a.rotulo}</button>`).join("")}
    </div>

    ${atual === "geral" ? abaGeral(c)
      : atual === "entrega" ? abaEntrega(c)
      : atual === "financeiro" ? abaFinanceiroCliente(c)
      : atual === "estrategia" ? abaEstrategia(c)
      : atual === "acessos" ? abaAcessos(c)
      : abaHistorico(c)}`;
}

function abaGeral(c) {
  const resp = usuarioDe(c.responsavelId);
  const zap = linkWhatsApp(c.telefone);
  const origem = S.leads.find((l) => l.clienteId === c.id);
  const dado = (r, v) => `<div><div class="dado__rotulo">${r}</div><div class="dado__valor">${v || "—"}</div></div>`;

  const abertas = demandasVivas().filter((d) => d.clienteId === c.id && d.fase !== "concluida");
  const contrato = S.contratos.find((k) => k.clienteId === c.id);
  const pendentes = S.aprovacoes.filter((a) => a.clienteId === c.id && a.status === "pendente");
  const atrasadas = emAberto().filter((b) => b.clienteId === c.id && b.vencimento < hojeISO());

  return `
    <div class="indicadores" style="margin-bottom:18px">
      ${pode("financeiro.ler") ? `<div class="indicador"><p class="indicador__rotulo">Mensalidade</p>
        <p class="indicador__valor">${contrato ? moeda.format(contrato.valorMensal) : "—"}</p>
        <p class="indicador__nota">${contrato ? (contrato.ativo ? "vence dia " + contrato.diaVencimento : "contrato pausado") : "sem contrato"}</p></div>` : ""}
      ${pode("operacional.ler") ? `<div class="indicador"><p class="indicador__rotulo">Demandas abertas</p><p class="indicador__valor">${abertas.length}</p></div>` : ""}
      ${pode("aprovacoes.ler") ? `<div class="indicador"><p class="indicador__rotulo">Esperando o cliente</p><p class="indicador__valor">${pendentes.length}</p></div>` : ""}
      ${pode("financeiro.ler") ? `<div class="indicador"><p class="indicador__rotulo">Em atraso</p>

/* ------------------------------------------------------- tela: operacional */
let filtrosOp = { cliente: "", responsavel: "", q: "" };

function telaOperacional() {
  const vivas = demandasVivas().filter((d) => {
    if (filtrosOp.cliente && d.clienteId !== filtrosOp.cliente) return false;
    if (filtrosOp.responsavel && d.responsavelId !== filtrosOp.responsavel) return false;
    if (filtrosOp.q && !semAcento(`${d.titulo} ${nomeCliente(d.clienteId)}`).includes(semAcento(filtrosOp.q))) return false;
    return true;
  });

  const hoje = hojeISO();
  const abertas = demandasVivas().filter((d) => d.fase !== "concluida");
  const atrasadas = abertas.filter((d) => d.prazo && d.prazo < hoje);

  const colunas = FASES.map((f) => {
    const cards = vivas.filter((d) => d.fase === f.id).sort((a, b) => a.ordem - b.ordem);
    return `
      <section class="quadro__coluna" data-fase="${f.id}" aria-label="${f.nome}">
        <header class="quadro__cabeca"><span>${f.nome}</span><span class="contagem">${cards.length}</span></header>
        <div class="quadro__cards">
          ${cards.length === 0 ? '<p class="vazio">Arraste uma demanda para cá</p>' : ""}
          ${cards.map((d) => {
            const r = usuarioDe(d.responsavelId);
            const atrasada = d.prazo && d.prazo < hoje && d.fase !== "concluida";
            const selo = d.prioridade === "alta" ? "selo--vermelho" : d.prioridade === "baixa" ? "" : "selo--ambar";
            return `
              <article class="card" draggable="true" data-demanda="${d.id}">
                <button class="card__nome" style="background:none;border:none;padding:0;font:inherit;text-align:left"
                        data-acao="editar-demanda" data-id="${d.id}">${esc(d.titulo)}</button>
                <p class="card__linha">${esc(nomeCliente(d.clienteId))}</p>
                <div class="card__pe">
                  <span class="selo ${atrasada ? "selo--vermelho" : ""}" style="font-size:11px">
                    ${d.prazo ? (atrasada ? "Atrasada · " : "") + fmtData.format(new Date(d.prazo + "T12:00:00")) : "sem prazo"}
                  </span>
                  <span class="selo ${selo}" style="font-size:11px">${PRIORIDADES[d.prioridade] || "—"}</span>
                </div>
                <p class="card__resp">${esc(TIPOS_DEMANDA[d.tipo] || d.tipo)}${r ? " · " + esc(r.nome) : ""}</p>
              </article>`;
          }).join("")}
        </div>
      </section>`;
  }).join("");

  return `
    <div class="pagina__cabeca">
      <div><h1 class="pagina__titulo">Operacional</h1>
        <p class="pagina__sub">O que a agência precisa entregar. Arraste entre as fases.</p></div>
      ${pode("operacional.criar") || pode("operacional.editar") ? '<button class="btn btn--acento" data-acao="nova-demanda">Nova demanda</button>' : ""}
    </div>

    <div class="indicadores" style="margin-bottom:18px">
      <div class="indicador"><p class="indicador__rotulo">Em andamento</p><p class="indicador__valor">${abertas.length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Atrasadas</p><p class="indicador__valor"${atrasadas.length ? ' style="color:var(--crit)"' : ""}>${atrasadas.length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Com o cliente</p><p class="indicador__valor">${abertas.filter((d) => d.fase === "cliente").length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Minhas</p><p class="indicador__valor">${abertas.filter((d) => d.responsavelId === S.usuarioId).length}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Concluídas</p><p class="indicador__valor">${demandasVivas().filter((d) => d.fase === "concluida").length}</p></div>
    </div>

    <form class="filtros" data-form="filtros-op">
      <label class="campo" style="min-width:220px"><span>Buscar</span>
        <input name="q" value="${esc(filtrosOp.q)}" placeholder="Título ou cliente"></label>
      <label class="campo" style="min-width:190px"><span>Cliente</span>
        <select name="cliente"><option value="">Todos</option>
          ${clientesVivos().map((c) => `<option value="${c.id}"${filtrosOp.cliente === c.id ? " selected" : ""}>${esc(c.nome)}</option>`).join("")}
        </select></label>
      <label class="campo" style="min-width:170px"><span>Responsável</span>
        <select name="responsavel"><option value="">Todos</option>
          ${EQUIPE.map((u) => `<option value="${u.id}"${filtrosOp.responsavel === u.id ? " selected" : ""}>${u.nome}</option>`).join("")}
        </select></label>
      <button class="btn" type="submit">Filtrar</button>
      ${(filtrosOp.q || filtrosOp.cliente || filtrosOp.responsavel)
        ? '<button class="btn btn--discreto" type="button" data-acao="limpar-op">Limpar</button>' : ""}
    </form>

    <div class="quadro">${colunas}</div>`;
}

/* ------------------------------------------------------------ tela: agenda */
function telaAgenda() {
  const inicio = new Date(); inicio.setHours(0, 0, 0, 0); inicio.setDate(inicio.getDate() - 2);
  const hoje = hojeISO();

  const itens = [];
  if (pode("vendas.ler")) {
    S.atividades.filter((a) => a.agendadaPara && !a.excluidoEm).forEach((a) => {
      const l = leadDe(a.leadId);
      if (!l || l.excluidoEm) return;
      itens.push({ data: a.agendadaPara.slice(0, 10), hora: fmtDataHora.format(new Date(a.agendadaPara)).split(", ")[1] || "",
        tipo: "Comercial", titulo: a.titulo, sub: contatoDe(l.contatoId).nome, href: `#/lead/${l.id}`,
        feito: Boolean(a.concluidaEm), acao: a.concluidaEm ? null : { nome: "concluir-atividade", id: a.id, rotulo: "Feito" } });
    });
  }
  if (pode("operacional.ler")) {
    demandasVivas().filter((d) => d.prazo).forEach((d) => {
      itens.push({ data: d.prazo, hora: "", tipo: "Entrega", titulo: d.titulo, sub: nomeCliente(d.clienteId),
        href: "#/operacional", feito: d.fase === "concluida", acao: null });
    });
  }
  if (pode("financeiro.ler")) {
    S.cobrancas.forEach((b) => {
      itens.push({ data: b.vencimento, hora: "", tipo: "Financeiro", titulo: `Mensalidade — ${moeda.format(b.valor)}`,
        sub: nomeCliente(b.clienteId), href: "#/financeiro", feito: Boolean(b.pagoEm),
        acao: b.pagoEm ? null : { nome: "receber", id: b.id, rotulo: "Recebido" } });
    });
  }

  const blocos = [];
  for (let k = 0; k < 14; k++) {
    const d = new Date(inicio); d.setDate(d.getDate() + k);
    const iso = d.toISOString().slice(0, 10);
    const doDia = itens.filter((x) => x.data === iso).sort((a, b) => a.hora.localeCompare(b.hora));
    if (!doDia.length && iso !== hoje) continue;

    blocos.push(`
      <div class="dia ${iso === hoje ? "dia--hoje" : ""}">
        <div class="dia__cabeca">
          <span class="dia__nome">${iso === hoje ? "Hoje" : new Intl.DateTimeFormat("pt-BR", { weekday: "long" }).format(d)}</span>
          <span class="pagina__sub">${new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "long" }).format(d)}</span>
          ${iso < hoje && doDia.some((x) => !x.feito) ? '<span class="selo selo--vermelho">em atraso</span>' : ""}
        </div>
        ${doDia.length === 0 ? '<p class="pagina__sub" style="margin:0">Nada marcado.</p>' : `
          <ul class="lista-seca">${doDia.map((x) => `
            <li>
              <div style="min-width:0">
                <a class="link-acento" href="${x.href}" style="font-weight:550">${esc(x.titulo)}</a>
                <div class="pagina__sub">${x.hora ? esc(x.hora) + " · " : ""}${esc(x.tipo)} · ${esc(x.sub)}</div>
              </div>
              <div style="flex:none">
                ${x.feito ? '<span class="selo selo--verde">feito</span>'
                  : x.acao ? `<button class="btn btn--pequeno" data-acao="${x.acao.nome}" data-id="${x.acao.id}">${x.acao.rotulo}</button>`
                  : '<span class="selo">aberto</span>'}
              </div>
            </li>`).join("")}</ul>`}
      </div>`);
  }

  return `
    <div class="pagina__cabeca">
      <div><h1 class="pagina__titulo">Agenda</h1>

  const grupo = (status) => S.aprovacoes.filter((a) => a.status === status)

  const cartao = (a) => {

          <span class="selo ${a.status === "aprovado" ? "selo--verde" : a.status === "ajuste" ? "selo--ambar" : ""}">${STATUS_APROVACAO[a.status]}</span>

          </div>` : ""}

/* -------------------------------------------------------- tela: financeiro */
let mesFinanceiro = null;

function telaFinanceiro() {
  const comp = mesFinanceiro || competencia();
  const hoje = hojeISO();

  const doMes = S.cobrancas.filter((b) => b.competencia === comp)
    .sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const recebido = doMes.filter((b) => b.pagoEm).reduce((s, b) => s + b.valor, 0);
  const aReceber = doMes.filter((b) => !b.pagoEm && b.vencimento >= hoje).reduce((s, b) => s + b.valor, 0);
  const atrasado = vencidas().reduce((s, b) => s + b.valor, 0);
  const mrr = S.contratos.filter((k) => k.ativo).reduce((s, k) => s + k.valorMensal, 0);

  const despMes = S.despesas.filter((x) => x.vencimento.startsWith(comp));
  const despPagas = despMes.filter((x) => x.pagoEm).reduce((s, x) => s + x.valor, 0);
  const despAbertas = despMes.filter((x) => !x.pagoEm).reduce((s, x) => s + x.valor, 0);
  const resultado = recebido - despPagas;

  const meses = [mesPassado(-3), mesPassado(-2), mesPassado(-1), competencia()];
  const podeEditar = pode("financeiro.editar") || pode("financeiro.*");

  return `

      <div class="indicador"><p class="indicador__rotulo">Receita recorrente</p><p class="indicador__valor">${moeda.format(mrr)}</p><p class="indicador__nota">${S.contratos.filter((k) => k.ativo).length} contratos ativos</p></div>
      <div class="indicador"><p class="indicador__rotulo">Recebido</p><p class="indicador__valor" style="color:var(--good)">${moeda.format(recebido)}</p></div>
      <div class="indicador"><p class="indicador__rotulo">A receber</p><p class="indicador__valor">${moeda.format(aReceber)}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Vencido</p><p class="indicador__valor"${atrasado ? ' style="color:var(--crit)"' : ""}>${moeda.format(atrasado)}</p>
        <p class="indicador__nota">${vencidas().length} cobrança(s), somando todas as competências</p></div>
      <div class="indicador"><p class="indicador__rotulo">Despesas pagas</p><p class="indicador__valor">${moeda.format(despPagas)}</p><p class="indicador__nota">${moeda.format(despAbertas)} em aberto</p></div>
      <div class="indicador"><p class="indicador__rotulo">Resultado</p><p class="indicador__valor" style="color:${resultado >= 0 ? "var(--good)" : "var(--crit)"}">${moeda.format(resultado)}</p></div>
    </div>

    <div class="cartao" style="margin-bottom:16px">
      <div class="cartao__cabeca"><strong>Mensalidades · ${nomeMes(comp)}</strong>

      ${doMes.length === 0 ? '<div class="estado"><p class="estado__texto" style="margin:0">Nenhuma cobrança nesta competência.</p></div>' : `

        <tbody>${doMes.map((b) => {

          const venceu = !b.pagoEm && b.vencimento < hoje;

            <td><a href="#/cliente/${b.clienteId}">${esc(nomeCliente(b.clienteId))}</a></td>

      <div style="display:grid;gap:16px;align-content:start">
        <div class="cartao">
          <div class="cartao__cabeca"><strong>Contratos</strong></div>

            <ul class="lista-seca">${S.contratos.map((k) => `
              <li>
                <div style="min-width:0">
                  <a class="link-acento" href="#/cliente/${k.clienteId}" style="font-weight:550">${esc(nomeCliente(k.clienteId))}</a>

        <div class="cartao">
          <div class="cartao__cabeca"><strong>Financeiro pessoal</strong>
            <span class="selo">${pode("financeiro.pessoal.ler") ? "liberado" : "restrito"}</span></div>

              </div>

}

/* ----------------------------------------------------------- tela: tráfego */
let clienteTrafego = null;

function telaTrafego() {
  const ativos = clientesVivos().filter((c) => S.trafego.some((t) => t.clienteId === c.id));
  if (!ativos.length) return vazio("Sem dados de tráfego", "Nenhum cliente com conta de anúncios conectada.");

  const alvo = ativos.find((c) => c.id === clienteTrafego) || ativos[0];
  const serie = S.trafego.filter((t) => t.clienteId === alvo.id).sort((a, b) => a.data.localeCompare(b.data));
  const ult7 = serie.slice(-7), ant7 = serie.slice(-14, -7);

  const soma = (arr, campo) => arr.reduce((s, x) => s + x[campo], 0);
  const gasto = soma(serie, "gasto"), resultados = soma(serie, "resultados");
  const cliques = soma(serie, "cliques"), impressoes = soma(serie, "impressoes");
  const cpl = resultados ? gasto / resultados : 0;
  const ctr = impressoes ? (cliques / impressoes) * 100 : 0;

  const variacao = (campo) => {
    const a = soma(ant7, campo), b = soma(ult7, campo);
    if (!a) return null;
    return ((b - a) / a) * 100;
  };
  const setaVar = (v, bomSubir = true) => {
    if (v === null) return "";
    const bom = bomSubir ? v >= 0 : v <= 0;
    return `<p class="indicador__nota" style="color:${bom ? "var(--good)" : "var(--crit)"}">${v >= 0 ? "▲" : "▼"} ${Math.abs(v).toFixed(0)}% vs. 7 dias antes</p>`;
  };

  const maximo = Math.max(...serie.map((t) => t.gasto));

  return `
    <div class="pagina__cabeca">
      <div><h1 class="pagina__titulo">Gestão de tráfego</h1>
        <p class="pagina__sub">Últimos 30 dias · dados do Meta Ads</p></div>
      <form data-form="cliente-trafego" style="display:flex;gap:8px;align-items:flex-end">
        <label class="campo" style="min-width:210px"><span>Cliente</span>
          <select name="cliente">${ativos.map((c) => `<option value="${c.id}"${c.id === alvo.id ? " selected" : ""}>${esc(c.nome)}</option>`).join("")}</select></label>
        <button class="btn" type="submit">Ver</button>
      </form>
    </div>

    <div class="indicadores" style="margin-bottom:20px">
      <div class="indicador"><p class="indicador__rotulo">Investido</p><p class="indicador__valor">${moeda.format(gasto)}</p>${setaVar(variacao("gasto"))}</div>
      <div class="indicador"><p class="indicador__rotulo">Resultados</p><p class="indicador__valor">${inteiro.format(resultados)}</p>${setaVar(variacao("resultados"))}</div>
      <div class="indicador"><p class="indicador__rotulo">Custo por resultado</p><p class="indicador__valor">${moedaExata.format(cpl)}</p></div>
      <div class="indicador"><p class="indicador__rotulo">Cliques</p><p class="indicador__valor">${inteiro.format(cliques)}</p>${setaVar(variacao("cliques"))}</div>
      <div class="indicador"><p class="indicador__rotulo">CTR</p><p class="indicador__valor">${ctr.toFixed(2).replace(".", ",")}%</p></div>
    </div>

    <div class="cartao" style="margin-bottom:16px">
      <div class="cartao__cabeca"><strong>Investimento diário</strong>
        <span class="pagina__sub">30 dias</span></div>
      <div class="cartao__corpo">
        <div class="colunas-mini" style="height:96px">
          ${serie.map((t) => `<i style="height:${Math.max(2, (t.gasto / maximo) * 100)}%" title="${fmtData.format(new Date(t.data + "T12:00:00"))} · ${moedaExata.format(t.gasto)}"></i>`).join("")}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px" class="pagina__sub">
          <span>${fmtData.format(new Date(serie[0].data + "T12:00:00"))}</span>
          <span>${fmtData.format(new Date(serie[serie.length - 1].data + "T12:00:00"))}</span>
        </div>
      </div>
    </div>

    <div class="cartao">
      <div class="cartao__cabeca"><strong>Últimos 7 dias</strong></div>
      <div class="rolagem"><table>
        <thead><tr><th>Dia</th><th>Investido</th><th>Impressões</th><th>Cliques</th><th>Resultados</th><th>Custo/result.</th></tr></thead>
        <tbody>${[...ult7].reverse().map((t) => `
          <tr>
            <td>${fmtData.format(new Date(t.data + "T12:00:00"))}</td>
            <td class="num">${moedaExata.format(t.gasto)}</td>
            <td class="num">${inteiro.format(t.impressoes)}</td>
            <td class="num">${inteiro.format(t.cliques)}</td>
            <td class="num">${inteiro.format(t.resultados)}</td>
            <td class="num">${t.resultados ? moedaExata.format(t.gasto / t.resultados) : "—"}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </div>

    <div class="caixa-aviso" style="margin-top:16px">
      No sistema real esses números <strong>não</strong> são buscados quando a tela abre.
      Um processo separado sincroniza a Graph API e grava as métricas; a tela só lê o banco.
      É o que faz o painel abrir rápido mesmo quando a Meta está lenta ou fora do ar.
    </div>`;
}

/* ------------------------------------------------------------------ modais */
let modalAberto = null;

function abrirModal(html) {
  fecharModal();
  const fundo = document.createElement("div");
  fundo.className = "fundo";
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  fundo.addEventListener("click", (e) => { if (e.target === fundo) fecharModal(); });
  document.body.appendChild(fundo);
  modalAberto = fundo;
  const primeiro = fundo.querySelector("input, select, textarea");
  if (primeiro) primeiro.focus();
}

function fecharModal() {
  if (modalAberto) { modalAberto.remove(); modalAberto = null; }
}

/* ------------------------------------------------------------------- busca */
let buscaAberta = false, buscaResultados = [], buscaSel = 0;

function buscar(termo) {
  const alvo = termo.trim();
  if (alvo.length < 2) return [];
  const tel = normalizarTelefone(alvo);
  const achados = [];

  // A busca respeita a permissão como qualquer tela: não é atalho para ver o
  // que o menu escondeu.
  if (pode("clientes.ler")) clientesVivos().forEach((c) => {
    const s = Math.max(similaridade(c.nome, alvo), c.telefone === tel ? 1 : 0);
    if (s > 0.25) achados.push({ tipo: "Cliente", titulo: c.nome, sub: [c.segmento, c.cidade].filter(Boolean).join(" · "), href: `#/cliente/${c.id}`, s });
  });

  if (pode("vendas.ler")) leadsVivos().forEach((l) => {
    const ct = contatoDe(l.contatoId);
    const s = Math.max(similaridade(ct.nome, alvo), similaridade(l.empresa || "", alvo), ct.telefone === tel ? 1 : 0);
    if (s > 0.25) achados.push({ tipo: "Lead", titulo: ct.nome, sub: l.empresa || formatarTelefone(ct.telefone), href: `#/lead/${l.id}`, s });
  });

  if (pode("operacional.ler")) demandasVivas().forEach((d) => {
    const s = similaridade(d.titulo, alvo);
    if (s > 0.3) achados.push({ tipo: "Demanda", titulo: d.titulo, sub: nomeCliente(d.clienteId), href: "#/operacional", s });
  });

  return achados.sort((a, b) => b.s - a.s).slice(0, 8);
}

function abrirBusca() {
  buscaAberta = true; buscaResultados = []; buscaSel = 0;
  fecharModal();
  const fundo = document.createElement("div");
  fundo.className = "fundo";
  fundo.innerHTML = `
    <div class="busca-caixa" role="dialog" aria-modal="true" aria-label="Busca global">
      <input class="busca-campo" id="busca-campo" placeholder="Cliente, lead, telefone…" aria-label="Termo de busca">
      <div class="busca-lista" id="busca-lista">
        <p class="busca-aviso">Digite ao menos duas letras. Acento não faz diferença.</p>
      </div>
    </div>`;
  fundo.addEventListener("click", (e) => { if (e.target === fundo) fecharBusca(); });
  document.body.appendChild(fundo);
  modalAberto = fundo;

  const campo = document.getElementById("busca-campo");
  campo.focus();
  campo.addEventListener("input", () => {
    buscaResultados = buscar(campo.value);
    buscaSel = 0;
    pintarBusca(campo.value);
  });
  campo.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); buscaSel = Math.min(buscaSel + 1, buscaResultados.length - 1); pintarBusca(campo.value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); buscaSel = Math.max(buscaSel - 1, 0); pintarBusca(campo.value); }
    else if (e.key === "Enter") { e.preventDefault(); const r = buscaResultados[buscaSel]; if (r) { fecharBusca(); ir(r.href); } }
  });
}

function pintarBusca(termo) {
  const lista = document.getElementById("busca-lista");
  if (!lista) return;
  if (termo.trim().length < 2) {
    lista.innerHTML = '<p class="busca-aviso">Digite ao menos duas letras. Acento não faz diferença.</p>';
    return;
  }
  if (buscaResultados.length === 0) {
    lista.innerHTML = `<p class="busca-aviso">Nada encontrado para “${esc(termo)}”.</p>`;
    return;
  }
  lista.innerHTML = buscaResultados.map((r, i) => `
    <button type="button" class="busca-item ${i === buscaSel ? "busca-item--ativo" : ""}" data-href="${r.href}">
      <span class="busca-tipo">${r.tipo}</span>
      <span class="busca-titulo">${esc(r.titulo)}</span>
      ${r.sub ? `<span class="busca-sub">${esc(r.sub)}</span>` : ""}
    </button>`).join("");
}

function fecharBusca() { buscaAberta = false; fecharModal(); }

  else if (rota.startsWith("#/cliente/")) conteudo = telaCliente(rota.slice(10).split("?")[0]);
  else if (rota.startsWith("#/vendas")) conteudo = telaVendas();
  else if (rota.startsWith("#/clientes")) {
    const q = rota.split("?")[1];
    if (q) { const p = new URLSearchParams(q); filtrosClientes.status = p.get("status") || ""; }
    conteudo = telaClientes();
  }
  else if (rota.startsWith("#/operacional")) {
    const q = rota.split("?")[1];
    if (q && new URLSearchParams(q).get("resp") === "eu") filtrosOp.responsavel = S.usuarioId;
    conteudo = telaOperacional();
  }
  else if (rota.startsWith("#/agenda")) conteudo = telaAgenda();
  else if (rota.startsWith("#/aprovacoes")) conteudo = telaAprovacoes();
  else if (rota.startsWith("#/financeiro")) conteudo = telaFinanceiro();
  else if (rota.startsWith("#/trafego")) conteudo = telaTrafego();
  else if (rota.startsWith("#/estrategias")) conteudo = telaEstrategias();
  else if (rota.startsWith("#/arquivos")) conteudo = telaArquivos();
  else if (rota.startsWith("#/cofre")) conteudo = telaCofre();
  else if (rota.startsWith("#/config") || rota.startsWith("#/equipe")) conteudo = telaConfig();
  else conteudo = telaPainel();

  document.getElementById("raiz").innerHTML = casca(conteudo);
