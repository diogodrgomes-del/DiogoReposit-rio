/* ==================================================================
   SatTrack Plus — Controle de Sinistros
   Identidade: fundo branco, azul-escuro e azul-claro na navegação,
   verde para confirmar, vermelho para urgência, cinza-claro para
   divisórias e apoio.
   ================================================================== */

:root {
  --azul-escuro: #0d2c4e;
  --azul-medio: #14477a;
  --azul-claro: #2f80d2;
  --azul-suave: #eaf2fb;
  --verde: #148f4b;
  --verde-escuro: #0f7a3f;
  --verde-suave: #e6f5ec;
  --vermelho: #c62828;
  --vermelho-suave: #fdecea;
  --amarelo: #b97e04;
  --amarelo-suave: #fdf3dd;
  --cinza-borda: #e2e7ee;
  --cinza-fundo: #f5f7fa;
  --cinza-texto: #61708a;
  --texto: #1b2536;
  --branco: #ffffff;

  --raio: 10px;
  --raio-g: 14px;
  --sombra: 0 1px 2px rgba(13, 44, 78, .06), 0 4px 14px rgba(13, 44, 78, .06);
  --sombra-forte: 0 10px 40px rgba(13, 44, 78, .18);
  --lateral-larg: 246px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cinza-fundo);
  color: var(--texto);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3, h4 { margin: 0; color: var(--azul-escuro); font-weight: 700; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------------ */
/* Botões                                                              */
/* ------------------------------------------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 15px;
  border: 1px solid transparent;
  border-radius: var(--raio);
  background: var(--azul-medio);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: filter .15s, background .15s, border-color .15s;
}
a.btn { text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn:active { filter: brightness(.94); }
.btn:focus-visible { outline: 3px solid var(--azul-claro); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }

.btn-verde { background: var(--verde); }
.btn-vermelho { background: var(--vermelho); }
.btn-azul-claro { background: var(--azul-claro); }
.btn-vazio { background: #fff; color: var(--azul-escuro); border-color: var(--cinza-borda); }
.btn-vazio:hover { background: var(--azul-suave); }
.btn-perigo-vazio { background: #fff; color: var(--vermelho); border-color: #f0c6c2; }
.btn-perigo-vazio:hover { background: var(--vermelho-suave); }
.btn-bloco { width: 100%; }
.btn-pequeno { padding: 6px 11px; font-size: 13px; }

.icone-btn {
  background: transparent;
  border: 0;
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 16px;
  line-height: 1;
  color: inherit;
  cursor: pointer;
}
.icone-btn:hover { background: rgba(13, 44, 78, .08); }

.link {
  background: none;
  border: 0;
  padding: 0;
  color: var(--azul-claro);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
}

/* ------------------------------------------------------------------ */
/* Login                                                               */
/* ------------------------------------------------------------------ */
.login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(1100px 520px at 12% -10%, #17538e 0%, transparent 60%),
    linear-gradient(160deg, var(--azul-escuro), #071c33);
}
.login-caixa {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: var(--raio-g);
  padding: 28px;
  box-shadow: var(--sombra-forte);
  display: grid;
  gap: 14px;
}
.login-marca { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.login-marca strong { display: block; color: var(--azul-escuro); font-size: 18px; }
.login-marca small { color: var(--cinza-texto); }
.login-erro {
  background: var(--vermelho-suave);
  color: var(--vermelho);
  border: 1px solid #f2cbc7;
  border-radius: var(--raio);
  padding: 8px 11px;
  font-size: 13px;
  font-weight: 600;
}
.login-dica { color: var(--cinza-texto); font-size: 12.5px; text-align: center; }

.marca-simbolo {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: 11px;
  background: linear-gradient(140deg, var(--azul-claro), var(--azul-escuro));
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: .5px;
}

/* ------------------------------------------------------------------ */
/* Estrutura                                                           */
/* ------------------------------------------------------------------ */
.app { display: flex; min-height: 100vh; }

.lateral {
  width: var(--lateral-larg);
  flex: 0 0 var(--lateral-larg);
  background: var(--azul-escuro);
  color: #cfe0f2;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
}
.lateral-topo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, .12);
}
.lateral-marca { flex: 1; min-width: 0; }
.lateral-marca strong { color: #fff; font-size: 15px; display: block; }
.lateral-marca small { color: #9fbcdc; font-size: 11.5px; }
.lateral-topo .icone-btn { color: #fff; }

.menu { flex: 1; overflow-y: auto; padding: 10px 8px; display: grid; gap: 2px; align-content: start; }
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 11px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #cfe0f2;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}
.menu-item:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.menu-item.ativo { background: var(--azul-claro); color: #fff; font-weight: 600; }
.menu-item .menu-icone { width: 18px; text-align: center; opacity: .95; }
.menu-item .selo {
  margin-left: auto;
  background: rgba(255, 255, 255, .18);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 11.5px;
  font-weight: 700;
}
.menu-item.ativo .selo { background: rgba(0, 0, 0, .22); }
.menu-item .selo.selo-vermelho { background: var(--vermelho); color: #fff; }
.menu-titulo {
  padding: 14px 12px 4px;
  font-size: 10.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #7fa3ca;
  font-weight: 700;
}

.lateral-rodape { padding: 12px; border-top: 1px solid rgba(255, 255, 255, .12); display: grid; gap: 10px; }
.usuario-box { display: flex; align-items: center; gap: 10px; min-width: 0; }
.usuario-box strong { color: #fff; font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usuario-box small { color: #9fbcdc; font-size: 11.5px; }
.avatar {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 50%;
  background: var(--azul-claro);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
}
.lateral-rodape .btn-vazio { background: transparent; color: #cfe0f2; border-color: rgba(255, 255, 255, .25); }
.lateral-rodape .btn-vazio:hover { background: rgba(255, 255, 255, .12); color: #fff; }

.lateral-fundo { position: fixed; inset: 0; background: rgba(6, 20, 36, .5); z-index: 35; }

.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Topo ------------------------------------------------------------- */
.topo {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: #fff;
  border-bottom: 1px solid var(--cinza-borda);
  position: sticky;
  top: 0;
  z-index: 30;
  flex-wrap: wrap;
}
.topo-titulo { min-width: 180px; flex: 1; }
.topo-titulo h1 { font-size: 19px; }
.topo-titulo p { color: var(--cinza-texto); font-size: 12.5px; }
.topo-acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.busca {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--cinza-fundo);
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio);
  padding: 0 10px;
  min-width: 280px;
  flex: 1;
}
.busca input { border: 0; background: transparent; padding: 9px 0; width: 100%; outline: none; font-size: 14px; }
.busca:focus-within { border-color: var(--azul-claro); box-shadow: 0 0 0 3px rgba(47, 128, 210, .15); }

/* Indicadores ------------------------------------------------------- */
.indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 10px;
  padding: 14px 20px 0;
}
.indicador {
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-left: 4px solid var(--azul-claro);
  border-radius: var(--raio);
  padding: 8px 11px;
  box-shadow: var(--sombra);
}
.indicador span { display: block; color: var(--cinza-texto); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.indicador strong { display: block; font-size: 21px; color: var(--azul-escuro); line-height: 1.25; }
.indicador small { color: var(--cinza-texto); font-size: 11.5px; }
.indicador.vermelho { border-left-color: var(--vermelho); }
.indicador.vermelho strong { color: var(--vermelho); }
.indicador.verde { border-left-color: var(--verde); }
.indicador.verde strong { color: var(--verde-escuro); }
.indicador.amarelo { border-left-color: var(--amarelo); }
.indicador.amarelo strong { color: var(--amarelo); }

.conteudo { padding: 16px 20px 28px; flex: 1; min-width: 0; }

/* ------------------------------------------------------------------ */
/* Blocos genéricos                                                    */
/* ------------------------------------------------------------------ */
.cartao {
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio-g);
  box-shadow: var(--sombra);
  padding: 16px;
}
.cartao + .cartao { margin-top: 14px; }
.cartao-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.cartao-topo h2 { font-size: 15.5px; }
.cartao-topo p { color: var(--cinza-texto); font-size: 12.5px; }

.grade-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grade-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

.vazio {
  text-align: center;
  color: var(--cinza-texto);
  padding: 26px 14px;
  border: 1px dashed var(--cinza-borda);
  border-radius: var(--raio);
  background: var(--cinza-fundo);
  font-size: 13.5px;
}

/* Filtros ----------------------------------------------------------- */
.filtros-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filtros-resumo { color: var(--cinza-texto); font-size: 12.5px; }
.selo-num {
  background: var(--azul-claro);
  color: #fff;
  border-radius: 999px;
  padding: 0 7px;
  font-size: 11.5px;
  font-weight: 700;
  margin-left: 4px;
}

.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio-g);
  padding: 12px;
  margin-bottom: 14px;
  box-shadow: var(--sombra);
}
.filtro { display: grid; gap: 3px; }
.filtro span { font-size: 11.5px; font-weight: 700; color: var(--cinza-texto); text-transform: uppercase; letter-spacing: .04em; }
.filtro select, .filtro input {
  border: 1px solid var(--cinza-borda);
  border-radius: 8px;
  padding: 7px 9px;
  background: #fff;
  min-width: 140px;
  font-size: 13.5px;
}
.filtro select:focus, .filtro input:focus { outline: none; border-color: var(--azul-claro); box-shadow: 0 0 0 3px rgba(47, 128, 210, .15); }
.filtros-marcas { display: flex; flex-wrap: wrap; gap: 6px; }
.marca-filtro {
  border: 1px solid var(--cinza-borda);
  background: #fff;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--cinza-texto);
  cursor: pointer;
}
.marca-filtro:hover { border-color: var(--azul-claro); color: var(--azul-medio); }
.marca-filtro.ativo { background: var(--azul-suave); border-color: var(--azul-claro); color: var(--azul-medio); }

/* ------------------------------------------------------------------ */
/* Kanban                                                              */
/* ------------------------------------------------------------------ */
.quadro {
  display: grid;
  grid-template-columns: repeat(4, minmax(268px, 1fr));
  gap: 12px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 8px;
}
.coluna {
  background: var(--cinza-fundo);
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio-g);
  display: flex;
  flex-direction: column;
  min-height: 220px;
  max-height: calc(100vh - 250px);
}
.coluna-topo {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 12px;
  border-bottom: 1px solid var(--cinza-borda);
  border-top: 3px solid var(--azul-claro);
  border-radius: var(--raio-g) var(--raio-g) 0 0;
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 2;
}
.coluna-topo h3 { font-size: 13.5px; }
.coluna-topo .contador {
  margin-left: auto;
  background: var(--azul-suave);
  color: var(--azul-medio);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 12px;
  font-weight: 700;
}
.coluna[data-status="entrou"] .coluna-topo { border-top-color: var(--azul-claro); }
.coluna[data-status="urgente"] .coluna-topo { border-top-color: var(--vermelho); }
.coluna[data-status="urgente"] .contador { background: var(--vermelho-suave); color: var(--vermelho); }
.coluna[data-status="resolvendo"] .coluna-topo { border-top-color: var(--amarelo); }
.coluna[data-status="resolvendo"] .contador { background: var(--amarelo-suave); color: var(--amarelo); }
.coluna[data-status="concluido"] .coluna-topo { border-top-color: var(--verde); }
.coluna[data-status="concluido"] .contador { background: var(--verde-suave); color: var(--verde-escuro); }

.coluna-lista { padding: 10px; display: grid; gap: 10px; align-content: start; overflow-y: auto; flex: 1; }
.coluna-lista.recebendo { background: var(--azul-suave); outline: 2px dashed var(--azul-claro); outline-offset: -6px; border-radius: 0 0 var(--raio-g) var(--raio-g); }

/* Card -------------------------------------------------------------- */
.card {
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-left: 4px solid var(--azul-claro);
  border-radius: var(--raio);
  padding: 11px 12px;
  box-shadow: var(--sombra);
  cursor: pointer;
  position: relative;
}
.card:hover { border-color: var(--azul-claro); box-shadow: 0 4px 16px rgba(13, 44, 78, .12); }
.card.arrastando { opacity: .45; }
.card.prioridade-normal { border-left-color: var(--verde); }
.card.prioridade-atencao { border-left-color: var(--amarelo); }
.card.prioridade-urgente { border-left-color: var(--vermelho); background: #fffafa; }
.card.concluido { opacity: .92; }

.card-topo { display: flex; align-items: flex-start; gap: 8px; }
.card-nome { font-weight: 700; color: var(--azul-escuro); font-size: 14px; flex: 1; word-break: break-word; }
.card-numero { color: var(--cinza-texto); font-size: 11.5px; font-weight: 600; }
.card-linha { display: flex; flex-wrap: wrap; gap: 5px 10px; font-size: 12.5px; color: var(--cinza-texto); margin-top: 6px; }
.card-linha b { color: var(--texto); font-weight: 600; }
.card-veiculo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  background: var(--cinza-fundo);
  border: 1px solid var(--cinza-borda);
  border-radius: 7px;
  padding: 4px 8px;
  font-size: 12.5px;
}
.placa {
  font-family: "Roboto Mono", ui-monospace, Consolas, monospace;
  font-weight: 700;
  letter-spacing: .06em;
  background: var(--azul-escuro);
  color: #fff;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11.5px;
}
.card-rodape {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid var(--cinza-borda);
  flex-wrap: wrap;
}
.card-tempo { color: var(--cinza-texto); font-size: 11.5px; margin-left: auto; }
.card-mover { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }

/* Etiquetas --------------------------------------------------------- */
.etiqueta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;
  white-space: nowrap;
}
.etiqueta.normal { background: var(--verde-suave); color: var(--verde-escuro); border-color: #c3e7d2; }
.etiqueta.atencao { background: var(--amarelo-suave); color: var(--amarelo); border-color: #f0dcae; }
.etiqueta.urgente { background: var(--vermelho-suave); color: var(--vermelho); border-color: #f2cbc7; }
.etiqueta.azul { background: var(--azul-suave); color: var(--azul-medio); border-color: #c9dcf3; }
.etiqueta.cinza { background: var(--cinza-fundo); color: var(--cinza-texto); border-color: var(--cinza-borda); }
.etiqueta.verde { background: var(--verde-suave); color: var(--verde-escuro); border-color: #c3e7d2; }
.etiqueta.vermelha { background: var(--vermelho-suave); color: var(--vermelho); border-color: #f2cbc7; }
.etiqueta.amarela { background: var(--amarelo-suave); color: var(--amarelo); border-color: #f0dcae; }
.etiqueta.pulsa { animation: pulsa 1.9s ease-in-out infinite; }
@keyframes pulsa { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }

.alertas-card { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.alerta-mini {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--vermelho-suave);
  color: var(--vermelho);
  border: 1px solid #f2cbc7;
  border-radius: 6px;
  padding: 1px 7px;
  font-size: 11px;
  font-weight: 600;
}
.alerta-mini.aviso { background: var(--amarelo-suave); color: var(--amarelo); border-color: #f0dcae; }

/* ------------------------------------------------------------------ */
/* Tabelas                                                             */
/* ------------------------------------------------------------------ */
.tabela-rolagem { overflow-x: auto; }
table.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.tabela th, table.tabela td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--cinza-borda); vertical-align: top; }
table.tabela th {
  color: var(--cinza-texto);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: .04em;
  background: var(--cinza-fundo);
  white-space: nowrap;
  position: sticky;
  top: 0;
}
table.tabela tbody tr:hover { background: var(--azul-suave); }
table.tabela tbody tr.clicavel { cursor: pointer; }
table.tabela td.num, table.tabela th.num { text-align: right; }
table.tabela td.num { font-variant-numeric: tabular-nums; }

.barra-medida { background: var(--cinza-borda); border-radius: 999px; height: 8px; overflow: hidden; min-width: 90px; }
.barra-medida i { display: block; height: 100%; background: var(--azul-claro); border-radius: 999px; }

/* ------------------------------------------------------------------ */
/* Formulários                                                         */
/* ------------------------------------------------------------------ */
.campo { display: grid; gap: 4px; }
.campo > span { font-size: 12.5px; font-weight: 600; color: var(--azul-escuro); }
.campo > span .obrig { color: var(--vermelho); }
.campo input, .campo select, .campo textarea {
  border: 1px solid var(--cinza-borda);
  border-radius: 8px;
  padding: 9px 10px;
  background: #fff;
  width: 100%;
  font-size: 14px;
}
.campo textarea { min-height: 84px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none;
  border-color: var(--azul-claro);
  box-shadow: 0 0 0 3px rgba(47, 128, 210, .15);
}
.campo input.erro, .campo select.erro { border-color: var(--vermelho); background: #fffafa; }
.campo .aviso-campo { color: var(--vermelho); font-size: 11.5px; font-weight: 600; }
.campo-linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.campo-largo { grid-column: 1 / -1; }
.campo-check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--azul-escuro); }
.campo-check input { width: auto; }

fieldset.secao {
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio-g);
  padding: 14px;
  margin: 0 0 14px;
  background: #fff;
}
fieldset.secao > legend {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--azul-claro);
  padding: 0 6px;
}

/* ------------------------------------------------------------------ */
/* Gaveta lateral                                                      */
/* ------------------------------------------------------------------ */
.gaveta-fundo { position: fixed; inset: 0; background: rgba(6, 20, 36, .45); z-index: 50; }
.gaveta {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(720px, 100vw);
  background: var(--cinza-fundo);
  z-index: 51;
  display: flex;
  flex-direction: column;
  box-shadow: var(--sombra-forte);
}
.gaveta-topo {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--azul-escuro);
  color: #fff;
}
.gaveta-topo h2 { color: #fff; font-size: 16.5px; }
.gaveta-topo p { color: #9fbcdc; font-size: 12.5px; }
.gaveta-topo .icone-btn { color: #fff; margin-left: auto; }
.gaveta-corpo { flex: 1; overflow-y: auto; padding: 16px; }
.gaveta-rodape {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid var(--cinza-borda);
  flex-wrap: wrap;
}
.gaveta-rodape .direita { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* Abas -------------------------------------------------------------- */
.abas { display: flex; gap: 4px; border-bottom: 2px solid var(--cinza-borda); margin-bottom: 14px; overflow-x: auto; }
.aba {
  border: 0;
  background: transparent;
  padding: 9px 13px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--cinza-texto);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
}
.aba:hover { color: var(--azul-medio); }
.aba.ativa { color: var(--azul-escuro); border-bottom-color: var(--azul-claro); }

/* Dados exibidos ---------------------------------------------------- */
.dados-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
.dado span { display: block; font-size: 11.5px; color: var(--cinza-texto); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.dado strong { font-weight: 600; color: var(--texto); word-break: break-word; }

/* Linha do tempo ---------------------------------------------------- */
.linha-tempo { display: grid; gap: 10px; }
.evento {
  position: relative;
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-left: 3px solid var(--azul-claro);
  border-radius: var(--raio);
  padding: 10px 12px;
}
.evento-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.evento-topo strong { font-size: 13.5px; color: var(--azul-escuro); }
.evento-quando { color: var(--cinza-texto); font-size: 11.5px; margin-left: auto; }
.evento p { font-size: 13.5px; }
.evento .detalhe { color: var(--cinza-texto); font-size: 12.5px; margin-top: 4px; }
.evento.historico { border-left-color: var(--cinza-borda); background: #fff; }
.evento.contato { border-left-color: var(--verde); }

/* Anexos ------------------------------------------------------------ */
.anexos { display: grid; gap: 8px; }
.anexo {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--cinza-borda);
  border-radius: var(--raio);
  padding: 8px 10px;
}
.anexo img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid var(--cinza-borda); }
.anexo .anexo-icone {
  width: 42px; height: 42px; flex: 0 0 42px;
  display: grid; place-items: center;
  background: var(--azul-suave); color: var(--azul-medio);
  border-radius: 6px; font-size: 18px;
}
.anexo-info { flex: 1; min-width: 0; }
.anexo-info strong { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anexo-info small { color: var(--cinza-texto); font-size: 11.5px; }

/* ------------------------------------------------------------------ */
/* Modal e avisos                                                      */
/* ------------------------------------------------------------------ */
.modal-fundo { position: fixed; inset: 0; background: rgba(6, 20, 36, .5); display: grid; place-items: center; z-index: 60; padding: 20px; }
.modal { background: #fff; border-radius: var(--raio-g); padding: 20px; width: min(430px, 100%); box-shadow: var(--sombra-forte); }
.modal h3 { font-size: 16.5px; margin-bottom: 8px; }
.modal p { color: var(--cinza-texto); font-size: 14px; }
.modal-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.avisos { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 70; max-width: min(360px, calc(100vw - 32px)); }
.aviso {
  background: var(--azul-escuro);
  color: #fff;
  border-radius: var(--raio);
  padding: 11px 14px;
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--sombra-forte);
  animation: entra .18s ease-out;
}
.aviso.sucesso { background: var(--verde); }
.aviso.erro { background: var(--vermelho); }
.aviso.alerta { background: var(--amarelo); }
@keyframes entra { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ------------------------------------------------------------------ */
/* Responsivo                                                          */
/* ------------------------------------------------------------------ */
.so-mobile { display: none; }

@media (max-width: 1100px) {
  .quadro { grid-template-columns: repeat(4, minmax(252px, 1fr)); }
}

@media (max-width: 900px) {
  .so-mobile { display: inline-flex; }
  .lateral {
    position: fixed;
    left: 0;
    top: 0;
    transform: translateX(-100%);
    transition: transform .2s ease-out;
  }
  .lateral.aberta { transform: none; }
  .topo { padding: 12px 14px; }
  .topo-titulo h1 { font-size: 17px; }
  .busca { min-width: 100%; order: 3; }
  /* No celular os indicadores viram uma faixa que rola para o lado, para
     o quadro Kanban continuar visível sem precisar rolar a página. */
  .indicadores {
    display: flex;
    padding: 12px 14px 0;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .indicadores .indicador { flex: 0 0 auto; min-width: 152px; scroll-snap-align: start; }
  .conteudo { padding: 14px; }
  .quadro { grid-template-columns: 1fr; overflow-x: visible; }
  .coluna { max-height: none; }
  .gaveta { width: 100vw; }
  .card-mover { display: flex; }
}

@media (min-width: 901px) {
  /* Em telas grandes o arrastar-e-soltar basta; os botões ficam ocultos
     para não poluir o card, e reaparecem no toque. */
  .card-mover { display: none; }
  .card:hover .card-mover, .card:focus-within .card-mover { display: flex; }
}

@media (max-width: 520px) {
  .topo-acoes { width: 100%; }
  .topo-acoes .btn { flex: 1; }
  .gaveta-rodape { flex-direction: column; }
  .gaveta-rodape .direita { margin-left: 0; flex-direction: column; }
  .gaveta-rodape .btn { width: 100%; }
}

/* ------------------------------------------------------------------ */
/* Impressão (relatórios em PDF)                                       */
/* ------------------------------------------------------------------ */
@media print {
  .lateral, .topo-acoes, .indicadores, .filtros, .gaveta, .gaveta-fundo,
  .modal-fundo, .avisos, .lateral-fundo, .nao-imprime { display: none !important; }
  body, html { background: #fff; }
  .app { display: block; }
  .topo { position: static; border: 0; padding: 0 0 10px; }
  .conteudo { padding: 0; }
  .cartao { break-inside: avoid; box-shadow: none; border-color: #ccc; }
  table.tabela th { background: #eee !important; }
  @page { margin: 14mm; }
}

<script>
/* ===== js/util.js ===== */
/* ==================================================================
   Util — formatação, máscaras e apoio geral.
   Tudo em pt-BR: o sistema é usado por uma equipe brasileira.
   ================================================================== */
const Util = (() => {

  /* ---------------------------------------------------------------- */
  /* Identificadores                                                   */
  /* ---------------------------------------------------------------- */
  function id(prefixo) {
    return (prefixo || "id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------------------------------------------------------------- */
  /* Datas e horários                                                  */
  /* ---------------------------------------------------------------- */
  const agora = () => new Date();
  const agoraISO = () => new Date().toISOString();

  /** "2026-08-04" no fuso local (input type=date). */
  function dataLocal(d) {
    const x = d || new Date();
    const mes = String(x.getMonth() + 1).padStart(2, "0");
    const dia = String(x.getDate()).padStart(2, "0");
    return `${x.getFullYear()}-${mes}-${dia}`;
  }

  /** "16:20" no fuso local (input type=time). */
  function horaLocal(d) {
    const x = d || new Date();
    return `${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`;
  }

  /** Junta "2026-08-04" + "16:20" num Date local. */
  function juntarDataHora(data, hora) {
    if (!data) return null;
    const [a, m, d] = data.split("-").map(Number);
    const [h, min] = (hora || "00:00").split(":").map(Number);
    const dt = new Date(a, (m || 1) - 1, d || 1, h || 0, min || 0, 0, 0);
    return isNaN(dt.getTime()) ? null : dt;
  }

  function paraData(valor) {
    if (!valor) return null;
    const d = valor instanceof Date ? valor : new Date(valor);
    return isNaN(d.getTime()) ? null : d;
  }

  /** 04/08/2026 */
  function fmtData(valor) {
    if (!valor) return "—";
    if (typeof valor === "string" && /^\d{4}-\d{2}-\d{2}$/.test(valor)) {
      const [a, m, d] = valor.split("-");
      return `${d}/${m}/${a}`;
    }
    const d = paraData(valor);
    return d ? d.toLocaleDateString("pt-BR") : "—";
  }

  /** 16:20 */
  function fmtHora(valor) {
    if (!valor) return "—";
    if (typeof valor === "string" && /^\d{2}:\d{2}/.test(valor)) return valor.slice(0, 5);
    const d = paraData(valor);
    return d ? horaLocal(d) : "—";
  }

  /** 04/08/2026 às 16h20 — formato usado no histórico. */
  function fmtDataHora(valor) {
    const d = paraData(valor);
    if (!d) return "—";
    return `${d.toLocaleDateString("pt-BR")} às ${String(d.getHours()).padStart(2, "0")}h${String(d.getMinutes()).padStart(2, "0")}`;
  }

  /** "20 minutos", "4 horas", "3 dias" — sem o prefixo. */
  function duracao(ms) {
    const min = Math.max(0, Math.floor(ms / 60000));
    if (min < 1) return "menos de 1 minuto";
    if (min < 60) return min === 1 ? "1 minuto" : `${min} minutos`;
    const horas = Math.floor(min / 60);
    if (horas < 24) return horas === 1 ? "1 hora" : `${horas} horas`;
    const dias = Math.floor(horas / 24);
    if (dias < 30) return dias === 1 ? "1 dia" : `${dias} dias`;
    const meses = Math.floor(dias / 30);
    return meses === 1 ? "1 mês" : `${meses} meses`;
  }

  /** "Aberto há 4 horas" a partir de uma data de referência. */
  function tempoDesde(valor) {
    const d = paraData(valor);
    if (!d) return "—";
    return duracao(Date.now() - d.getTime());
  }

  function horasDesde(valor) {
    const d = paraData(valor);
    if (!d) return Infinity;
    return (Date.now() - d.getTime()) / 3600000;
  }

  function mesmoDia(a, b) {
    const x = paraData(a), y = paraData(b);
    if (!x || !y) return false;
    return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
  }

  /* ---------------------------------------------------------------- */
  /* Máscaras e normalizações                                          */
  /* ---------------------------------------------------------------- */
  const soNumeros = (v) => String(v || "").replace(/\D+/g, "");

  /** (11) 98765-4321 — máscara brasileira, com 10 ou 11 dígitos. */
  function mascaraTelefone(valor) {
    const n = soNumeros(valor).slice(0, 11);
    if (n.length <= 2) return n.length ? `(${n}` : "";
    if (n.length <= 6) return `(${n.slice(0, 2)}) ${n.slice(2)}`;
    if (n.length <= 10) return `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}`;
    return `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`;
  }

  /** 123.456.789-01 quando parecer CPF; caso contrário devolve como veio. */
  function mascaraDocumento(valor) {
    const bruto = String(valor || "");
    const n = soNumeros(bruto);
    if (n.length !== bruto.replace(/[.\-\/\s]/g, "").length) return bruto; // tem letras: outro documento
    const c = n.slice(0, 11);
    if (c.length <= 3) return c;
    if (c.length <= 6) return `${c.slice(0, 3)}.${c.slice(3)}`;
    if (c.length <= 9) return `${c.slice(0, 3)}.${c.slice(3, 6)}.${c.slice(6)}`;
    return `${c.slice(0, 3)}.${c.slice(3, 6)}.${c.slice(6, 9)}-${c.slice(9)}`;
  }

  /** Placa sempre em maiúsculas: ABC1D23 / ABC-1234. */
  function mascaraPlaca(valor) {
    return String(valor || "").toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 8);
  }

  /** Texto sem acentos e em minúsculas — usado na busca. */
  function normalizar(texto) {
    return String(texto == null ? "" : texto)
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().trim();
  }

  function inteiro(valor, minimo) {
    const n = parseInt(soNumeros(valor), 10);
    const piso = minimo == null ? 0 : minimo;
    return isNaN(n) ? piso : Math.max(piso, n);
  }

  function tamanhoArquivo(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1048576) return `${(bytes / 1024).toFixed(0)} KB`;
    return `${(bytes / 1048576).toFixed(1)} MB`;
  }

  function iniciais(nome) {
    const partes = String(nome || "?").trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return "?";
    if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
    return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  }

  /* ---------------------------------------------------------------- */
  /* HTML                                                              */
  /* ---------------------------------------------------------------- */
  /** Escapa tudo que vem do usuário antes de entrar em innerHTML. */
  function esc(texto) {
    return String(texto == null ? "" : texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /** Valor de exibição: cai para "—" quando vazio. */
  function ou(valor, alternativa) {
    const v = valor == null ? "" : String(valor).trim();
    return v === "" ? (alternativa || "—") : v;
  }

  function plural(n, singular, pluralPalavra) {
    return `${n} ${n === 1 ? singular : pluralPalavra}`;
  }

  /* ---------------------------------------------------------------- */
  /* Exportação de arquivos                                            */
  /* ---------------------------------------------------------------- */
  function baixar(nomeArquivo, conteudo, mime) {
    const blob = new Blob([conteudo], { type: (mime || "text/plain") + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  /** CSV com ponto-e-vírgula e BOM: abre direto no Excel em pt-BR. */
  function baixarCSV(nomeArquivo, linhas) {
    const corpo = linhas
      .map((linha) => linha.map((celula) => {
        const v = celula == null ? "" : String(celula).replace(/"/g, '""');
        return `"${v}"`;
      }).join(";"))
      .join("\r\n");
    baixar(nomeArquivo, "﻿" + corpo, "text/csv");
  }

  return {
    id, agora, agoraISO, dataLocal, horaLocal, juntarDataHora, paraData,
    fmtData, fmtHora, fmtDataHora, duracao, tempoDesde, horasDesde, mesmoDia,
    soNumeros, mascaraTelefone, mascaraDocumento, mascaraPlaca, normalizar,
    inteiro, tamanhoArquivo, iniciais, esc, ou, plural, baixar, baixarCSV,
  };
})();

/* ===== js/dados.js ===== */

   Dados — modelo, persistência e regras do controle de sinistros.

   Tudo fica no navegador (localStorage), sob uma única chave. É o que
   garante que nada se perde ao atualizar a página: toda escrita passa

   ================================================================== */
const Dados = (() => {

  const CHAVE = "sattrack.plus.sinistros.v1";

  /* ---------------------------------------------------------------- */

  const STATUS = [

  const CLASSIFICACOES = [
    "Em análise", "Dano parcial", "Perda total", "Danos a terceiros",

  ];

  const TIPOS_ACOMPANHAMENTO = [
    "Contato realizado com o associado",

    "Documentação recebida",
    "Veículo encaminhado para oficina",

    "Reparo iniciado",
    "Reparo concluído",
    "Veículo entregue",
    "Caso encerrado",
    "Observação interna",
  ];

  const PERFIS = [
    { id: "admin", nome: "Administrador" },
    { id: "atendente", nome: "Atendente" },
  ];

  const CONFIG_PADRAO = {
    empresa: "SatTrack Proteção Veicular",
    setor: "Setor Plus",
    horasUrgenteSemAtualizacao: 24,
    horasSemAtualizacao: 48,
    diasParado: 7,
    diasSemContato: 5,
    limiteAnexoMB: 2,
  };

  const nomeStatus = (id) => (STATUS.find((s) => s.id === id) || {}).nome || id || "—";
  const nomePrioridade = (id) => (PRIORIDADES.find((p) => p.id === id) || {}).nome || id || "—";
  const corStatus = (id) => (STATUS.find((s) => s.id === id) || {}).cor || "cinza";
  const nomePerfil = (id) => (PERFIS.find((p) => p.id === id) || {}).nome || id;

  /* ---------------------------------------------------------------- */
  /* Estado em memória                                                 */
  /* ---------------------------------------------------------------- */
  let estado = {
    versao: 1,
    sinistros: [],
    usuarios: [],
    config: Object.assign({}, CONFIG_PADRAO),
    sessao: null,
    proximoNumero: 1,
  };

  const ouvintes = [];
  const aoMudar = (fn) => ouvintes.push(fn);
  const notificar = () => ouvintes.forEach((fn) => fn());

  /** Alguns navegadores bloqueiam o armazenamento (aba anônima, arquivo
      aberto direto do disco com restrição, política do sistema). Nesse caso
      o sistema continua funcionando na memória e avisa uma única vez. */
  let semArmazenamento = false;
  const armazenamentoIndisponivel = () => semArmazenamento;

  function ehCotaCheia(e) {
    return e && (e.name === "QuotaExceededError" || e.name === "NS_ERROR_DOM_QUOTA_REACHED" || e.code === 22);
  }

  function salvar() {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(estado));
      return true;
    } catch (e) {
      if (ehCotaCheia(e)) {
        // Cota estourada normalmente é anexo grande demais.
        throw new Error(
          "Não foi possível salvar: o armazenamento do navegador está cheio. " +
          "Remova anexos antigos e tente de novo."
        );
      }
      // Armazenamento indisponível: nada de travar o trabalho da equipe.
      console.error("Armazenamento indisponível; trabalhando apenas na memória.", e);
      if (!semArmazenamento) {
        semArmazenamento = true;
        setTimeout(() => {
          if (typeof UI !== "undefined") {
            UI.erro("Este navegador está bloqueando o armazenamento local. O trabalho continua, mas os dados se perdem ao fechar a página. Use um servidor local ou saia da janela anônima.");
          }
        }, 400);
      }
      return false;
    }
  }

  function carregar() {
    let bruto = null;
    try { bruto = localStorage.getItem(CHAVE); } catch (e) { bruto = null; }

    if (bruto) {
      try {
        const lido = JSON.parse(bruto);
        estado = Object.assign(estado, lido);
        estado.config = Object.assign({}, CONFIG_PADRAO, lido.config || {});
        estado.sinistros = (lido.sinistros || []).map(normalizarSinistro);
        if (!estado.usuarios || !estado.usuarios.length) estado.usuarios = usuariosPadrao();
        return;
      } catch (e) {
        console.error("Base local corrompida; recriando com dados de demonstração.", e);
      }
    }

    estado.usuarios = usuariosPadrao();
    estado.sinistros = semente();
    estado.proximoNumero = estado.sinistros.length + 1;
    salvar();
  }

  /** Garante os campos novos em registros gravados por versões anteriores. */
  function normalizarSinistro(s) {
    return Object.assign({
      acompanhamentos: [], historico: [], anexos: [], contatos: [],
      documentosPendentes: false, vitimas: 0, veiculosEnvolvidos: 1,
    }, s);
  }

  /* ---------------------------------------------------------------- */
  /* Usuários e sessão                                                 */
  /* ---------------------------------------------------------------- */
  function usuariosPadrao() {
    return [
      { id: "u_admin", usuario: "admin", senha: "admin123", nome: "Diogo Gomes", perfil: "admin", ativo: true, criadoEm: Util.agoraISO() },
      { id: "u_fernanda", usuario: "fernanda", senha: "1234", nome: "Fernanda Alves", perfil: "atendente", ativo: true, criadoEm: Util.agoraISO() },
      { id: "u_carla", usuario: "carla", senha: "1234", nome: "Carla Menezes", perfil: "atendente", ativo: true, criadoEm: Util.agoraISO() },
      { id: "u_rafael", usuario: "rafael", senha: "1234", nome: "Rafael Souza", perfil: "atendente", ativo: true, criadoEm: Util.agoraISO() },
    ];
  }

  function entrar(usuario, senha) {
    const achado = estado.usuarios.find(
      (u) => Util.normalizar(u.usuario) === Util.normalizar(usuario) && u.senha === senha
    );
    if (!achado) return { ok: false, erro: "Usuário ou senha inválidos." };
    if (!achado.ativo) return { ok: false, erro: "Usuário desativado. Procure um administrador." };
    estado.sessao = { usuarioId: achado.id, desde: Util.agoraISO() };
    salvar();
    return { ok: true, usuario: achado };
  }

  function sair() {
    estado.sessao = null;
    salvar();
  }

  function usuarioAtual() {
    if (!estado.sessao) return null;
    return estado.usuarios.find((u) => u.id === estado.sessao.usuarioId) || null;
  }

  const ehAdmin = () => {
    const u = usuarioAtual();
    return !!u && u.perfil === "admin";
  };

  function listaUsuarios() { return estado.usuarios.slice(); }

  function salvarUsuario(dados) {
    if (!ehAdmin()) throw new Error("Somente administradores podem gerenciar usuários.");
    const login = Util.normalizar(dados.usuario);
    if (!login) throw new Error("Informe o nome de acesso.");
    if (!String(dados.nome || "").trim()) throw new Error("Informe o nome completo.");

    const repetido = estado.usuarios.some((u) => Util.normalizar(u.usuario) === login && u.id !== dados.id);
    if (repetido) throw new Error("Já existe um usuário com esse nome de acesso.");

    if (dados.id) {
      const u = estado.usuarios.find((x) => x.id === dados.id);
      if (!u) throw new Error("Usuário não encontrado.");
      u.nome = dados.nome.trim();
      u.usuario = dados.usuario.trim();
      u.perfil = dados.perfil;
      u.ativo = !!dados.ativo;
      if (dados.senha) u.senha = dados.senha;
    } else {
      if (!dados.senha) throw new Error("Informe uma senha para o novo usuário.");
      estado.usuarios.push({
        id: Util.id("u"), usuario: dados.usuario.trim(), senha: dados.senha,
        nome: dados.nome.trim(), perfil: dados.perfil || "atendente",
        ativo: dados.ativo !== false, criadoEm: Util.agoraISO(),
      });
    }
    salvar();
    notificar();
  }

  function excluirUsuario(id) {
    if (!ehAdmin()) throw new Error("Somente administradores podem excluir usuários.");
    const atual = usuarioAtual();
    if (atual && atual.id === id) throw new Error("Você não pode excluir o próprio usuário.");
    estado.usuarios = estado.usuarios.filter((u) => u.id !== id);
    salvar();
    notificar();
  }

  /* ---------------------------------------------------------------- */
  /* Histórico automático                                              */
  /* ---------------------------------------------------------------- */
  function registrar(sin, acao, detalhe, de, para) {
    const u = usuarioAtual();
    sin.historico = sin.historico || [];
    sin.historico.push({
      id: Util.id("h"),
      criadoEm: Util.agoraISO(),
      usuario: u ? u.nome : "Sistema",
      acao,
      detalhe: detalhe || "",
      de: de || "",
      para: para || "",
    });
    sin.atualizadoEm = Util.agoraISO();
  }

  /* ---------------------------------------------------------------- */
  /* Sinistros — leitura                                               */
  /* ---------------------------------------------------------------- */
  const lista = () => estado.sinistros.slice();
  const obter = (id) => estado.sinistros.find((s) => s.id === id) || null;
  const porStatus = (status) => estado.sinistros.filter((s) => s.status === status);

  function proximoNumeroSinistro() {
    const ano = new Date().getFullYear();
    const usados = estado.sinistros
      .map((s) => parseInt(String(s.numero || "").split("-").pop(), 10))
      .filter((n) => !isNaN(n));
    const seq = (usados.length ? Math.max.apply(null, usados) : 0) + 1;
    return `SIN-${ano}-${String(seq).padStart(4, "0")}`;
  }

  function proximoProtocolo() {
    const ano = new Date().getFullYear();
    return `PLUS-${ano}-${String(estado.sinistros.length + 1).padStart(4, "0")}`;
  }

  /** Última movimentação de verdade: acompanhamento, contato ou abertura. */
  function ultimaAtualizacao(sin) {
    const datas = [sin.criadoEm];
    (sin.acompanhamentos || []).forEach((a) => datas.push(a.criadoEm));
    (sin.contatos || []).forEach((c) => datas.push(c.criadoEm));
    return datas.filter(Boolean).sort().pop();
  }

  function ultimoContatoAssociado(sin) {
    const datas = (sin.contatos || [])
      .filter((c) => c.tipo === "associado")
      .map((c) => c.criadoEm)
      .concat(
        (sin.acompanhamentos || [])
          .filter((a) => Util.normalizar(a.tipo).indexOf("contato realizado") === 0)
          .map((a) => a.criadoEm)
      );
    return datas.filter(Boolean).sort().pop() || null;
  }

  /* ---------------------------------------------------------------- */
  /* Validação                                                         */
  /* ---------------------------------------------------------------- */
  const OBRIGATORIOS = [
    ["associado", "Nome completo do associado"],
    ["whatsapp", "Número do WhatsApp"],
    ["placa", "Placa do veículo"],
    ["numero", "Número do sinistro"],
    ["dataIncidente", "Data do incidente"],
    ["horaIncidente", "Horário do incidente"],
    ["atendente", "Nome da atendente"],
    ["responsavel", "Responsável pelo caso"],
  ];

  function validar(dados) {
    const erros = {};
    OBRIGATORIOS.forEach(([campo, rotulo]) => {
      if (!String(dados[campo] || "").trim()) erros[campo] = `${rotulo} é obrigatório.`;
    });
    if (dados.whatsapp && Util.soNumeros(dados.whatsapp).length < 10) {
      erros.whatsapp = "Informe DDD e número (10 ou 11 dígitos).";
    }
    if (dados.placa && Util.soNumeros(dados.placa).length + dados.placa.replace(/[^A-Za-z]/g, "").length < 7) {
      erros.placa = "Placa incompleta.";
    }
    return erros;
  }

  /* ---------------------------------------------------------------- */
  /* Sinistros — escrita                                               */
  /* ---------------------------------------------------------------- */
  function limpar(dados) {
    return {
      // Registro
      dataAtendimento: dados.dataAtendimento || Util.dataLocal(),
      horaAtendimento: dados.horaAtendimento || Util.horaLocal(),
      atendente: String(dados.atendente || "").trim(),
      responsavel: String(dados.responsavel || "").trim(),
      status: dados.status || "entrou",
      prioridade: dados.prioridade || "normal",
      // Associado
      associado: String(dados.associado || "").trim(),
      whatsapp: Util.mascaraTelefone(dados.whatsapp),
      documento: String(dados.documento || "").trim(),
      contrato: String(dados.contrato || "").trim(),
      // Incidente
      dataIncidente: dados.dataIncidente || "",
      horaIncidente: dados.horaIncidente || "",
      local: String(dados.local || "").trim(),
      tipo: dados.tipo || "Colisão",
      descricao: String(dados.descricao || "").trim(),
      vitimas: Util.inteiro(dados.vitimas, 0),
      veiculosEnvolvidos: Util.inteiro(dados.veiculosEnvolvidos, 0),
      temBO: !!dados.temBO,
      numeroBO: String(dados.numeroBO || "").trim(),
      guincho: !!dados.guincho,
      atendimentoMedico: !!dados.atendimentoMedico,
      // Veículo
      placa: Util.mascaraPlaca(dados.placa),
      marca: String(dados.marca || "").trim(),
      modelo: String(dados.modelo || "").trim(),
      ano: String(dados.ano || "").trim(),
      cor: String(dados.cor || "").trim(),
      // Sinistro
      numero: String(dados.numero || "").trim().toUpperCase(),
      protocolo: String(dados.protocolo || "").trim().toUpperCase(),
      classificacao: dados.classificacao || "Em análise",
      prestador: String(dados.prestador || "").trim(),
      observacoes: String(dados.observacoes || "").trim(),
      // Prazos
      proximaAcao: String(dados.proximaAcao || "").trim(),
      prazoRetorno: dados.prazoRetorno || "",
      documentosPendentes: !!dados.documentosPendentes,
    };
  }

  function criar(dadosBrutos) {
    const dados = limpar(dadosBrutos);
    const erros = validar(dados);
    if (Object.keys(erros).length) return { ok: false, erros };

    if (estado.sinistros.some((s) => Util.normalizar(s.numero) === Util.normalizar(dados.numero))) {
      return { ok: false, erros: { numero: "Já existe um sinistro com esse número." } };
    }

    const sin = Object.assign({
      id: Util.id("sin"),
      criadoEm: Util.agoraISO(),
      atualizadoEm: Util.agoraISO(),
      concluidoEm: dados.status === "concluido" ? Util.agoraISO() : null,
      acompanhamentos: [], historico: [], anexos: [], contatos: [],
    }, dados);

    registrar(sin, "Sinistro cadastrado", `Aberto em ${nomeStatus(sin.status)} com prioridade ${nomePrioridade(sin.prioridade)}.`, "", nomeStatus(sin.status));
    estado.sinistros.unshift(sin);
    salvar();
    notificar();
    return { ok: true, sinistro: sin };
  }

  /** Atualiza e registra no histórico cada campo relevante que mudou. */
  function atualizar(id, dadosBrutos) {
    const sin = obter(id);
    if (!sin) return { ok: false, erros: { geral: "Sinistro não encontrado." } };

    const dados = limpar(dadosBrutos);
    const erros = validar(dados);
    if (Object.keys(erros).length) return { ok: false, erros };

    const repetido = estado.sinistros.some(
      (s) => s.id !== id && Util.normalizar(s.numero) === Util.normalizar(dados.numero)
    );
    if (repetido) return { ok: false, erros: { numero: "Já existe um sinistro com esse número." } };

    const antes = Object.assign({}, sin);
    Object.assign(sin, dados);

    if (antes.status !== sin.status) {
      registrar(sin, "Status alterado", `Sinistro movido de “${nomeStatus(antes.status)}” para “${nomeStatus(sin.status)}”.`, nomeStatus(antes.status), nomeStatus(sin.status));
      sin.concluidoEm = sin.status === "concluido" ? Util.agoraISO() : null;
    }
    if (antes.prioridade !== sin.prioridade) {
      registrar(sin, "Prioridade alterada", `Prioridade alterada de ${nomePrioridade(antes.prioridade)} para ${nomePrioridade(sin.prioridade)}.`, nomePrioridade(antes.prioridade), nomePrioridade(sin.prioridade));
    }
    if (antes.responsavel !== sin.responsavel) {
      registrar(sin, "Responsável alterado", `Responsável alterado de ${Util.ou(antes.responsavel, "sem responsável")} para ${Util.ou(sin.responsavel, "sem responsável")}.`, antes.responsavel, sin.responsavel);
    }
    if (antes.atendente !== sin.atendente) {
      registrar(sin, "Atendente alterada", `Atendimento alterado de ${Util.ou(antes.atendente, "não informada")} para ${Util.ou(sin.atendente, "não informada")}.`, antes.atendente, sin.atendente);
    }
    if (antes.observacoes !== sin.observacoes && sin.observacoes) {
      registrar(sin, "Observação adicionada", "Observações internas atualizadas.");
    }
    if (antes.prazoRetorno !== sin.prazoRetorno) {
      registrar(sin, "Prazo alterado", `Prazo de retorno definido para ${Util.ou(Util.fmtData(sin.prazoRetorno), "sem prazo")}.`, Util.fmtData(antes.prazoRetorno), Util.fmtData(sin.prazoRetorno));
    }
    if (antes.documentosPendentes !== sin.documentosPendentes) {
      registrar(sin, "Documentação", sin.documentosPendentes ? "Marcado como aguardando documentos." : "Documentação regularizada.");
    }

    registrar(sin, "Cadastro editado", "Dados do sinistro atualizados.");
    salvar();
    notificar();
    return { ok: true, sinistro: sin };
  }

  /** Movimentação entre colunas — sempre salva e sempre registra. */
  function mover(id, novoStatus) {
    const sin = obter(id);
    if (!sin || sin.status === novoStatus) return null;

    const de = sin.status;
    sin.status = novoStatus;
    if (novoStatus === "concluido") {
      sin.concluidoEm = Util.agoraISO();
    } else if (de === "concluido") {
      sin.concluidoEm = null;
      registrar(sin, "Caso reaberto", `Sinistro reaberto e movido para “${nomeStatus(novoStatus)}”.`, nomeStatus(de), nomeStatus(novoStatus));
      salvar();
      notificar();
      return sin;
    }
    if (novoStatus === "urgente" && sin.prioridade !== "urgente") {
      const antiga = sin.prioridade;
      sin.prioridade = "urgente";
      registrar(sin, "Prioridade alterada", `Prioridade alterada de ${nomePrioridade(antiga)} para Urgente ao entrar em “Caso urgente”.`, nomePrioridade(antiga), "Urgente");
    }
    registrar(sin, "Movimentação", `Sinistro movido de “${nomeStatus(de)}” para “${nomeStatus(novoStatus)}”.`, nomeStatus(de), nomeStatus(novoStatus));
    salvar();
    notificar();
    return sin;
  }

  function alterarPrioridade(id, prioridade) {
    const sin = obter(id);
    if (!sin || sin.prioridade === prioridade) return null;
    const de = sin.prioridade;
    sin.prioridade = prioridade;
    registrar(sin, "Prioridade alterada", `Prioridade alterada de ${nomePrioridade(de)} para ${nomePrioridade(prioridade)}.`, nomePrioridade(de), nomePrioridade(prioridade));
    salvar();
    notificar();
    return sin;
  }

  function alterarPessoa(id, campo, valor) {
    const sin = obter(id);
    if (!sin) return null;
    const de = sin[campo] || "";
    if (de === valor) return sin;
    sin[campo] = valor;
    registrar(
      sin,
      campo === "responsavel" ? "Responsável alterado" : "Atendente alterada",
      `${campo === "responsavel" ? "Responsável" : "Atendimento"} alterado de ${Util.ou(de, "não informado")} para ${Util.ou(valor, "não informado")}.`,
      de, valor
    );
    salvar();
    notificar();
    return sin;
  }

  /** Só administradores excluem — e casos concluídos ficam preservados. */
  function excluir(id) {
    if (!ehAdmin()) throw new Error("Somente administradores podem excluir registros.");
    const sin = obter(id);
    if (!sin) throw new Error("Sinistro não encontrado.");
    estado.sinistros = estado.sinistros.filter((s) => s.id !== id);
    salvar();
    notificar();
    return sin;
  }

  /* ---------------------------------------------------------------- */
  /* Acompanhamento, contatos e anexos                                 */
  /* ---------------------------------------------------------------- */
  function adicionarAcompanhamento(id, dados) {
    const sin = obter(id);
    if (!sin) throw new Error("Sinistro não encontrado.");
    if (!String(dados.descricao || "").trim()) throw new Error("Descreva a atualização.");

    const u = usuarioAtual();
    const registro = {
      id: Util.id("acomp"),
      criadoEm: Util.agoraISO(),
      data: dados.data || Util.dataLocal(),
      hora: dados.hora || Util.horaLocal(),
      autor: String(dados.autor || (u ? u.nome : "")).trim() || "Equipe Plus",
      tipo: dados.tipo || "Análise em andamento",
      descricao: String(dados.descricao).trim(),
      proximaAcao: String(dados.proximaAcao || "").trim(),
      prazoRetorno: dados.prazoRetorno || "",
    };
    sin.acompanhamentos = sin.acompanhamentos || [];
    sin.acompanhamentos.push(registro);

    // A próxima ação e o prazo do caso acompanham a última atualização.
    if (registro.proximaAcao) sin.proximaAcao = registro.proximaAcao;
    if (registro.prazoRetorno) sin.prazoRetorno = registro.prazoRetorno;

    registrar(sin, "Atualização registrada", `${registro.tipo} — ${registro.descricao}`);
    salvar();
    notificar();
    return registro;
  }

    if (!String(dados.resumo || "").trim()) throw new Error("Descreva o contato realizado.");

      sin, "Contato registrado",

  function adicionarAnexo(id, arquivo) {
    const sin = obter(id);
    if (!sin) return Promise.reject(new Error("Sinistro não encontrado."));

    const limite = (estado.config.limiteAnexoMB || 2) * 1024 * 1024;
    if (arquivo.size > limite) {
      return Promise.reject(new Error(
        `“${arquivo.name}” tem ${Util.tamanhoArquivo(arquivo.size)}. O limite por arquivo é ${estado.config.limiteAnexoMB} MB.`
      ));
    }

    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onerror = () => reject(new Error("Não foi possível ler o arquivo."));
      leitor.onload = () => {
        const u = usuarioAtual();
        const anexo = {
          id: Util.id("anx"),
          nome: arquivo.name,
          tipo: arquivo.type || "application/octet-stream",
          tamanho: arquivo.size,
          conteudo: leitor.result,
          enviadoPor: u ? u.nome : "Equipe Plus",
          criadoEm: Util.agoraISO(),
        };
        sin.anexos = sin.anexos || [];
        sin.anexos.push(anexo);
        registrar(sin, "Documento anexado", `Arquivo “${anexo.nome}” (${Util.tamanhoArquivo(anexo.tamanho)}).`);
        try {
          salvar();
        } catch (e) {
          // Desfaz para não deixar o estado em memória diferente do salvo.
          sin.anexos = sin.anexos.filter((a) => a.id !== anexo.id);
          sin.historico.pop();
          reject(e);
          return;
        }
        notificar();
        resolve(anexo);
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  function removerAnexo(id, anexoId) {
    const sin = obter(id);
    if (!sin) return;
    const anexo = (sin.anexos || []).find((a) => a.id === anexoId);
    sin.anexos = (sin.anexos || []).filter((a) => a.id !== anexoId);
    registrar(sin, "Documento removido", anexo ? `Arquivo “${anexo.nome}” removido.` : "Anexo removido.");
    salvar();
    notificar();
  }

  /* ---------------------------------------------------------------- */
  /* Alertas e prazos                                                  */
  /* ---------------------------------------------------------------- */
  function prazoVencido(sin) {
    if (sin.status === "concluido" || !sin.prazoRetorno) return false;
    const limite = Util.juntarDataHora(sin.prazoRetorno, "23:59");
    return !!limite && limite.getTime() < Date.now();
  }

  function alertas(sin) {
    const c = estado.config;
    const saida = [];
    if (sin.status === "concluido") return saida;

    const horas = Util.horasDesde(ultimaAtualizacao(sin));

    if ((sin.status === "urgente" || sin.prioridade === "urgente") && horas > c.horasUrgenteSemAtualizacao) {
      saida.push({ chave: "urgente-parado", nivel: "grave", texto: `Urgente sem atualização há ${Util.duracao(horas * 3600000)}` });
    }
    if (prazoVencido(sin)) {
      saida.push({ chave: "prazo", nivel: "grave", texto: `Prazo de retorno vencido em ${Util.fmtData(sin.prazoRetorno)}` });
    }
    if (sin.documentosPendentes) {
      saida.push({ chave: "documentos", nivel: "aviso", texto: "Documentos pendentes" });
    }
    if (horas > c.diasParado * 24) {
      saida.push({ chave: "parado", nivel: "aviso", texto: `Parado há ${Util.duracao(horas * 3600000)}` });
    } else if (horas > c.horasSemAtualizacao) {
      saida.push({ chave: "sem-atualizacao", nivel: "aviso", texto: `Sem atualização há ${Util.duracao(horas * 3600000)}` });
    }
    if (!String(sin.responsavel || "").trim()) {
      saida.push({ chave: "sem-responsavel", nivel: "aviso", texto: "Caso sem responsável" });
    }
    const contato = ultimoContatoAssociado(sin);
    if (!contato) {
      saida.push({ chave: "sem-contato", nivel: "aviso", texto: "Sem contato registrado com o associado" });
    } else if (Util.horasDesde(contato) > c.diasSemContato * 24) {
      saida.push({ chave: "sem-contato", nivel: "aviso", texto: `Sem contato com o associado há ${Util.duracao(Util.horasDesde(contato) * 3600000)}` });
    }
    return saida;
  }

  const temAlerta = (sin, chave) => alertas(sin).some((a) => a.chave === chave);
  const semAtualizacao = (sin) =>
    sin.status !== "concluido" && Util.horasDesde(ultimaAtualizacao(sin)) > estado.config.horasSemAtualizacao;

  /* ---------------------------------------------------------------- */
  /* Indicadores                                                       */
  /* ---------------------------------------------------------------- */
  function indicadores() {
    const todos = estado.sinistros;
    const abertos = todos.filter((s) => s.status !== "concluido");
    const concluidos = todos.filter((s) => s.status === "concluido");

    const tempos = concluidos
      .filter((s) => s.concluidoEm && s.criadoEm)
      .map((s) => new Date(s.concluidoEm) - new Date(s.criadoEm))
      .filter((ms) => ms >= 0);
    const media = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : 0;

    return {
      total: todos.length,
      abertos: abertos.length,
      entrou: todos.filter((s) => s.status === "entrou").length,
      urgentes: todos.filter((s) => s.status === "urgente" || (s.prioridade === "urgente" && s.status !== "concluido")).length,
      resolvendo: todos.filter((s) => s.status === "resolvendo").length,
      concluidos: concluidos.length,
      concluidosHoje: concluidos.filter((s) => Util.mesmoDia(s.concluidoEm, new Date())).length,
      comVitimas: todos.filter((s) => Number(s.vitimas) > 0 && s.status !== "concluido").length,
      prazoVencido: abertos.filter(prazoVencido).length,
      semAtualizacao: abertos.filter(semAtualizacao).length,
      documentosPendentes: abertos.filter((s) => s.documentosPendentes).length,
      semResponsavel: abertos.filter((s) => !String(s.responsavel || "").trim()).length,
      tempoMedio: media ? Util.duracao(media) : "—",
      tempoMedioMs: media,
    };
  }

  /* ---------------------------------------------------------------- */
  /* Busca e filtros                                                   */
  /* ---------------------------------------------------------------- */
  const CAMPOS_BUSCA = ["associado", "numero", "protocolo", "documento", "whatsapp", "placa", "modelo", "marca", "atendente", "responsavel", "local", "tipo"];

  function combina(sin, termo) {
    if (!termo) return true;
    const alvo = Util.normalizar(CAMPOS_BUSCA.map((c) => sin[c]).join(" ") + " " + Util.soNumeros(sin.whatsapp) + " " + Util.soNumeros(sin.documento));
    return Util.normalizar(termo).split(/\s+/).every((p) => alvo.indexOf(p) >= 0);
  }

  function filtrar(termo, filtros) {
    const f = filtros || {};
    return estado.sinistros.filter((s) => {
      if (!combina(s, termo)) return false;
      if (f.status && s.status !== f.status) return false;
      if (f.prioridade && s.prioridade !== f.prioridade) return false;
      if (f.tipo && s.tipo !== f.tipo) return false;
      if (f.atendente && s.atendente !== f.atendente) return false;
      if (f.responsavel && s.responsavel !== f.responsavel) return false;
      if (f.incidenteDe && (!s.dataIncidente || s.dataIncidente < f.incidenteDe)) return false;
      if (f.incidenteAte && (!s.dataIncidente || s.dataIncidente > f.incidenteAte)) return false;
      if (f.aberturaDe && Util.dataLocal(Util.paraData(s.criadoEm)) < f.aberturaDe) return false;
      if (f.aberturaAte && Util.dataLocal(Util.paraData(s.criadoEm)) > f.aberturaAte) return false;
      if (f.comVitimas && !(Number(s.vitimas) > 0)) return false;
      if (f.urgentes && !(s.prioridade === "urgente" || s.status === "urgente")) return false;
      if (f.documentosPendentes && !s.documentosPendentes) return false;
      if (f.prazoVencido && !prazoVencido(s)) return false;
      if (f.concluidos && s.status !== "concluido") return false;
      if (f.semAtualizacao && !semAtualizacao(s)) return false;
      if (f.semResponsavel && String(s.responsavel || "").trim()) return false;
      return true;
    });
  }

  /** Nomes já usados em atendimento/responsabilidade + usuários cadastrados. */
  function pessoas() {
    const nomes = new Set(estado.usuarios.filter((u) => u.ativo).map((u) => u.nome));
    estado.sinistros.forEach((s) => {
      if (s.atendente) nomes.add(s.atendente);
      if (s.responsavel) nomes.add(s.responsavel);
    });
    return Array.from(nomes).sort((a, b) => a.localeCompare(b, "pt-BR"));
  }

  function historicoGlobal(limite) {
    const linhas = [];
    estado.sinistros.forEach((s) => {
      (s.historico || []).forEach((h) => linhas.push(Object.assign({ sinistroId: s.id, numero: s.numero, associado: s.associado }, h)));
    });
    linhas.sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
    return limite ? linhas.slice(0, limite) : linhas;
  }

    estado.config = Object.assign({}, estado.config, nova);

    return JSON.stringify({
      versao: estado.versao, exportadoEm: Util.agoraISO(),
      sinistros: estado.sinistros, usuarios: estado.usuarios, config: estado.config,
    }, null, 2);

  function importarBackup(texto) {
    const lido = JSON.parse(texto);
    if (!lido || !Array.isArray(lido.sinistros)) throw new Error("Arquivo de backup inválido.");
    estado.sinistros = lido.sinistros.map(normalizarSinistro);
    if (Array.isArray(lido.usuarios) && lido.usuarios.length) estado.usuarios = lido.usuarios;
    if (lido.config) estado.config = Object.assign({}, CONFIG_PADRAO, lido.config);
    salvar();
    notificar();
  }

/* ===== js/ui.js ===== */
/* ==================================================================
   UI — avisos, confirmações, gaveta lateral e pedaços de HTML
   reaproveitados pelas telas.
   ================================================================== */
const UI = (() => {

  const $ = (sel, raiz) => (raiz || document).querySelector(sel);
  const $$ = (sel, raiz) => Array.from((raiz || document).querySelectorAll(sel));

  /* ---------------------------------------------------------------- */
  /* Avisos                                                            */
  /* ---------------------------------------------------------------- */
  function aviso(texto, tipo) {
    const caixa = $("#avisos");
    const el = document.createElement("div");
    el.className = "aviso " + (tipo || "");
    el.textContent = texto;
    caixa.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .25s";
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 250);
    }, tipo === "erro" ? 5200 : 3200);
  }
  const sucesso = (t) => aviso(t, "sucesso");
  const erro = (t) => aviso(t, "erro");
  const alerta = (t) => aviso(t, "alerta");

  /* ---------------------------------------------------------------- */
  /* Confirmação (usada antes de excluir, concluir e reabrir)          */
  /* ---------------------------------------------------------------- */
  let confirmarResolver = null;

  function confirmar(opcoes) {
    const o = typeof opcoes === "string" ? { texto: opcoes } : (opcoes || {});
    $("#modal-titulo").textContent = o.titulo || "Confirmar";
    $("#modal-texto").textContent = o.texto || "";
    const btn = $("#modal-confirmar");
    btn.textContent = o.rotulo || "Confirmar";
    btn.className = "btn " + (o.perigo ? "btn-vermelho" : "btn-verde");
    $("#modal-fundo").hidden = false;
    btn.focus();
    return new Promise((resolve) => { confirmarResolver = resolve; });
  }

  function fecharModal(resposta) {
    $("#modal-fundo").hidden = true;
    if (confirmarResolver) { confirmarResolver(resposta); confirmarResolver = null; }
  }

  /* ---------------------------------------------------------------- */
  /* Gaveta lateral                                                    */
  /* ---------------------------------------------------------------- */
  let aoFecharGaveta = null;

  function abrirGaveta(opcoes) {
    $("#gaveta-titulo").textContent = opcoes.titulo || "";
    $("#gaveta-subtitulo").innerHTML = opcoes.subtitulo || "";
    $("#gaveta-corpo").innerHTML = opcoes.corpo || "";
    $("#gaveta-rodape").innerHTML = opcoes.rodape || "";
    $("#gaveta").hidden = false;
    $("#gaveta-fundo").hidden = false;
    document.body.style.overflow = "hidden";
    aoFecharGaveta = opcoes.aoFechar || null;
    if (typeof opcoes.depois === "function") opcoes.depois($("#gaveta-corpo"), $("#gaveta-rodape"));
  }

  function fecharGaveta() {
    $("#gaveta").hidden = true;
    $("#gaveta-fundo").hidden = true;
    document.body.style.overflow = "";
    $("#gaveta-corpo").innerHTML = "";
    $("#gaveta-rodape").innerHTML = "";
    const fn = aoFecharGaveta;
    aoFecharGaveta = null;
    if (fn) fn();
  }

  const gavetaAberta = () => !$("#gaveta").hidden;

  /* ---------------------------------------------------------------- */
  /* Pedaços de HTML reaproveitados                                    */
  /* ---------------------------------------------------------------- */
  const etiquetaPrioridade = (p) =>
    `<span class="etiqueta ${Util.esc(p)}${p === "urgente" ? " pulsa" : ""}">${Util.esc(Dados.nomePrioridade(p))}</span>`;

  const etiquetaStatus = (s) =>
    `<span class="etiqueta ${Util.esc(Dados.corStatus(s))}">${Util.esc(Dados.nomeStatus(s))}</span>`;

  const dado = (rotulo, valor) =>
    `<div class="dado"><span>${Util.esc(rotulo)}</span><strong>${Util.esc(Util.ou(valor))}</strong></div>`;

  function opcoes(itens, selecionado, vazio) {
    const inicio = vazio ? `<option value="">${Util.esc(vazio)}</option>` : "";
    return inicio + itens.map((i) => {
      const valor = typeof i === "string" ? i : i.id;
      const nome = typeof i === "string" ? i : i.nome;
      return `<option value="${Util.esc(valor)}"${Util.normalizar(valor) === Util.normalizar(selecionado) ? " selected" : ""}>${Util.esc(nome)}</option>`;
    }).join("");
  }

  /** Barra proporcional usada nos relatórios e na visão geral. */
  function barra(valor, maximo, cor) {
    const pct = maximo > 0 ? Math.round((valor / maximo) * 100) : 0;
    const cores = { vermelho: "var(--vermelho)", verde: "var(--verde)", amarelo: "var(--amarelo)" };
    return `<div class="barra-medida" title="${pct}%"><i style="width:${pct}%${cor ? `;background:${cores[cor] || cor}` : ""}"></i></div>`;
  }

  function alertasHTML(sin) {
    const lista = Dados.alertas(sin);
    if (!lista.length) return "";
    return `<div class="alertas-card">${lista.map((a) =>
      `<span class="alerta-mini${a.nivel === "aviso" ? " aviso" : ""}">${a.nivel === "aviso" ? "•" : "!"} ${Util.esc(a.texto)}</span>`
    ).join("")}</div>`;
  }

  /* ---------------------------------------------------------------- */
  /* Ligações fixas                                                    */
  /* ---------------------------------------------------------------- */
  function iniciar() {
    $("#modal-cancelar").addEventListener("click", () => fecharModal(false));
    $("#modal-confirmar").addEventListener("click", () => fecharModal(true));
    $("#modal-fundo").addEventListener("click", (e) => { if (e.target.id === "modal-fundo") fecharModal(false); });
    $("#gaveta-fechar").addEventListener("click", fecharGaveta);
    $("#gaveta-fundo").addEventListener("click", fecharGaveta);
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!$("#modal-fundo").hidden) fecharModal(false);
      else if (gavetaAberta()) fecharGaveta();
    });
  }

  return {
    $, $$, aviso, sucesso, erro, alerta, confirmar,
    abrirGaveta, fecharGaveta, gavetaAberta,
    etiquetaPrioridade, etiquetaStatus, dado, opcoes, barra, alertasHTML, iniciar,
  };
})();

   Formulários — cadastro de sinistro e página interna do caso.

const Formularios = (() => {

  /* ================================================================ */
  /* Cadastro / edição                                                 */
  /* ================================================================ */
  function campo(nome, rotulo, valor, opcoes) {
    const o = opcoes || {};
    const obrig = o.obrigatorio ? ' <span class="obrig" title="Campo obrigatório">*</span>' : "";
    const attrs = [
      `name="${nome}"`,
      `id="c-${nome}"`,
      o.tipo ? `type="${o.tipo}"` : 'type="text"',
      o.placeholder ? `placeholder="${Util.esc(o.placeholder)}"` : "",
      o.min != null ? `min="${o.min}"` : "",
      o.maxlength ? `maxlength="${o.maxlength}"` : "",
      o.inputmode ? `inputmode="${o.inputmode}"` : "",
      o.obrigatorio ? "required" : "",
    ].filter(Boolean).join(" ");

    return `<label class="campo${o.largo ? " campo-largo" : ""}">
      <span>${Util.esc(rotulo)}${obrig}</span>
      <input ${attrs} value="${Util.esc(valor == null ? "" : valor)}" />
      <em class="aviso-campo" data-erro="${nome}" hidden></em>
    </label>`;
  }

  function selecao(nome, rotulo, itens, valor, opcoes) {
    const o = opcoes || {};
    return `<label class="campo${o.largo ? " campo-largo" : ""}">
      <span>${Util.esc(rotulo)}${o.obrigatorio ? ' <span class="obrig">*</span>' : ""}</span>
      <select name="${nome}" id="c-${nome}">${UI.opcoes(itens, valor, o.vazio)}</select>
      <em class="aviso-campo" data-erro="${nome}" hidden></em>
    </label>`;
  }

  function area(nome, rotulo, valor, placeholder) {
    return `<label class="campo campo-largo">
      <span>${Util.esc(rotulo)}</span>
      <textarea name="${nome}" id="c-${nome}" placeholder="${Util.esc(placeholder || "")}">${Util.esc(valor || "")}</textarea>
      <em class="aviso-campo" data-erro="${nome}" hidden></em>
    </label>`;

  function marcador(nome, rotulo, marcado) {

  /** Máscaras e travas de digitação. */

    const wpp = $("#c-whatsapp", raiz);
    if (wpp) wpp.addEventListener("input", () => { wpp.value = Util.mascaraTelefone(wpp.value); });

    const placa = $("#c-placa", raiz);
    if (placa) placa.addEventListener("input", () => { placa.value = Util.mascaraPlaca(placa.value); });

    const doc = $("#c-documento", raiz);
    if (doc) doc.addEventListener("input", () => { doc.value = Util.mascaraDocumento(doc.value); });

    ["vitimas", "veiculosEnvolvidos", "ano"].forEach((nome) => {
      const el = $("#c-" + nome, raiz);
      if (!el) return;
      el.addEventListener("input", () => { el.value = Util.soNumeros(el.value); });
    });
  }

  function lerFormulario(form) {
    const dados = {};
    Array.from(form.elements).forEach((el) => {
      if (!el.name) return;
      dados[el.name] = el.type === "checkbox" ? el.checked : el.value;
    });
    return dados;
  }

  function mostrarErros(raiz, erros) {
    $$("[data-erro]", raiz).forEach((el) => { el.hidden = true; el.textContent = ""; });
    $$(".erro", raiz).forEach((el) => el.classList.remove("erro"));

    let primeiro = null;
    Object.keys(erros).forEach((campoNome) => {
      const alvo = $(`[data-erro="${campoNome}"]`, raiz);
      const entrada = $(`#c-${campoNome}`, raiz);
      if (alvo) { alvo.textContent = erros[campoNome]; alvo.hidden = false; }
      if (entrada) { entrada.classList.add("erro"); if (!primeiro) primeiro = entrada; }
    });
    if (primeiro) primeiro.scrollIntoView({ behavior: "smooth", block: "center" });
    UI.erro("Confira os campos obrigatórios destacados.");

  function abrirCadastro(preset) {
