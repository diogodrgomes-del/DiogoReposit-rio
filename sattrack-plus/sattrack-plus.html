  /* ================================================================ */
  function abrirDetalhe(id, aba) {
    detalheId = id;
    abaAtual = aba || "resumo";
    desenharDetalhe();
  }

  const ABAS = [
    { id: "resumo", nome: "Resumo" },
    { id: "acompanhamento", nome: "Acompanhamento do caso" },
    { id: "contatos", nome: "Contatos" },
    { id: "anexos", nome: "Documentos" },
    { id: "historico", nome: "Histórico do sinistro" },
    { id: "editar", nome: "Editar cadastro" },
  ];

  function desenharDetalhe() {
    const sin = Dados.obter(detalheId);
    if (!sin) { UI.fecharGaveta(); return; }

    const abas = `<div class="abas">${ABAS.map((a) =>
      `<button class="aba${a.id === abaAtual ? " ativa" : ""}" data-aba="${a.id}">${Util.esc(a.nome)}${
        a.id === "acompanhamento" ? ` (${(sin.acompanhamentos || []).length})` :
        a.id === "anexos" ? ` (${(sin.anexos || []).length})` :
        a.id === "contatos" ? ` (${(sin.contatos || []).length})` : ""
      }</button>`).join("")}</div>`;

    const corpos = {
      resumo: corpoResumo, acompanhamento: corpoAcompanhamento, contatos: corpoContatos,
      anexos: corpoAnexos, historico: corpoHistorico, editar: () => formularioHTML(sin),
    };

    UI.abrirGaveta({
      titulo: `${sin.associado}`,
      subtitulo: `${Util.esc(sin.numero)} · ${Util.esc(sin.tipo)} · Aberto há ${Util.esc(Util.tempoDesde(sin.criadoEm))}`,
      corpo: abas + `<div id="detalhe-corpo">${corpos[abaAtual](sin)}</div>`,
      rodape: rodapeDetalhe(sin),
      depois: (corpo, rodape) => ligarDetalhe(sin, corpo, rodape),
    });
  }

  function rodapeDetalhe(sin) {
    const admin = Dados.ehAdmin();
    const botoes = [];

    if (abaAtual === "editar") {
      botoes.push('<button class="btn btn-vazio" data-acao="cancelar-edicao">Cancelar</button>');
      botoes.push('<div class="direita"><button class="btn btn-verde" data-acao="salvar-edicao">Salvar alterações</button></div>');
      return botoes.join("");
    }

    botoes.push('<button class="btn btn-vazio" data-acao="fechar">Fechar</button>');
    if (admin) botoes.push(`<button class="btn btn-perigo-vazio" data-acao="excluir">Excluir</button>`);

    const direita = ['<button class="btn btn-azul-claro" data-acao="editar">Editar</button>'];
    if (sin.status !== "urgente" && sin.status !== "concluido") {
      direita.push('<button class="btn btn-vermelho" data-acao="urgente">Marcar como urgente</button>');
    }
    if (sin.status !== "resolvendo" && sin.status !== "concluido") {
      direita.push('<button class="btn" data-acao="resolvendo">Mover para resolvendo</button>');
    }
    if (sin.status === "concluido") {
      direita.push('<button class="btn btn-azul-claro" data-acao="reabrir">Reabrir caso</button>');
    } else {
      direita.push('<button class="btn btn-verde" data-acao="concluir">Concluir caso</button>');
    }
    botoes.push(`<div class="direita">${direita.join("")}</div>`);
    return botoes.join("");
  }

  /* --- Aba: resumo -------------------------------------------------- */
  function corpoResumo(sin) {
    const alertas = Dados.alertas(sin);
    const pessoas = Dados.pessoas();

    const faixaAlertas = alertas.length
      ? `<div class="cartao" style="border-left:4px solid var(--vermelho)">
           <div class="cartao-topo"><h2>Alertas do caso</h2></div>
           <div class="alertas-card">${alertas.map((a) =>
             `<span class="alerta-mini${a.nivel === "aviso" ? " aviso" : ""}">${a.nivel === "aviso" ? "•" : "!"} ${Util.esc(a.texto)}</span>`).join("")}</div>
         </div>`
      : "";

    return `
    <div class="cartao">
      <div class="cartao-topo">
        <div>
          <h2>${Util.esc(sin.associado)}</h2>
          <p>${Util.esc(sin.numero)} · Protocolo ${Util.esc(Util.ou(sin.protocolo))} · Aberto há ${Util.esc(Util.tempoDesde(sin.criadoEm))}</p>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${UI.etiquetaStatus(sin.status)} ${UI.etiquetaPrioridade(sin.prioridade)}
          ${Number(sin.vitimas) > 0 ? `<span class="etiqueta vermelha">${Util.plural(Number(sin.vitimas), "vítima", "vítimas")}</span>` : ""}
        </div>
      </div>
      <div class="campo-linha">
        <label class="campo"><span>Status</span>
          <select data-rapido="status">${UI.opcoes(Dados.STATUS, sin.status)}</select></label>
        <label class="campo"><span>Prioridade</span>
          <select data-rapido="prioridade">${UI.opcoes(Dados.PRIORIDADES, sin.prioridade)}</select></label>
        <label class="campo"><span>Atendente</span>
          <select data-rapido="atendente">${UI.opcoes(pessoas, sin.atendente, "Não informada")}</select></label>
        <label class="campo"><span>Responsável</span>
          <select data-rapido="responsavel">${UI.opcoes(pessoas, sin.responsavel, "Sem responsável")}</select></label>
      </div>
    </div>

    ${faixaAlertas}

    <div class="cartao">
      <div class="cartao-topo"><h2>Associado</h2></div>
      <div class="dados-grade">
        ${UI.dado("Nome completo", sin.associado)}
        ${UI.dado("WhatsApp", sin.whatsapp)}
        ${UI.dado("CPF ou documento", sin.documento)}
        ${UI.dado("Contrato/associação", sin.contrato)}
      </div>
      ${sin.whatsapp ? `<div style="margin-top:12px"><a class="btn btn-verde btn-pequeno" target="_blank" rel="noopener"
          href="https://wa.me/55${Util.esc(Util.soNumeros(sin.whatsapp))}">Abrir conversa no WhatsApp</a></div>` : ""}
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Incidente</h2></div>
      <div class="dados-grade">
        ${UI.dado("Data do incidente", Util.fmtData(sin.dataIncidente))}
        ${UI.dado("Horário do incidente", Util.fmtHora(sin.horaIncidente))}
        ${UI.dado("Tipo de sinistro", sin.tipo)}
        ${UI.dado("Classificação", sin.classificacao)}
        ${UI.dado("Local", sin.local)}
        ${UI.dado("Vítimas", sin.vitimas)}
        ${UI.dado("Veículos envolvidos", sin.veiculosEnvolvidos)}
        ${UI.dado("Boletim de ocorrência", sin.temBO ? Util.ou(sin.numeroBO, "Sim") : "Não")}
        ${UI.dado("Guincho", sin.guincho ? "Sim" : "Não")}
        ${UI.dado("Atendimento médico", sin.atendimentoMedico ? "Sim" : "Não")}
      </div>
      <div style="margin-top:12px">
        <div class="dado"><span>Descrição do ocorrido</span></div>
        <p style="white-space:pre-wrap;margin-top:4px">${Util.esc(Util.ou(sin.descricao, "Sem descrição registrada."))}</p>
      </div>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Veículo protegido</h2></div>
      <div class="dados-grade">
        ${UI.dado("Placa", sin.placa)}
        ${UI.dado("Marca", sin.marca)}
        ${UI.dado("Modelo", sin.modelo)}
        ${UI.dado("Ano", sin.ano)}
        ${UI.dado("Cor", sin.cor)}
      </div>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Registro e prazos</h2></div>
      <div class="dados-grade">
        ${UI.dado("Data do atendimento", Util.fmtData(sin.dataAtendimento))}
        ${UI.dado("Horário do atendimento", Util.fmtHora(sin.horaAtendimento))}
        ${UI.dado("Atendente", sin.atendente)}
        ${UI.dado("Responsável", sin.responsavel)}
        ${UI.dado("Seguradora/oficina/prestador", sin.prestador)}
        ${UI.dado("Próxima ação", sin.proximaAcao)}
        ${UI.dado("Prazo de retorno", sin.prazoRetorno ? Util.fmtData(sin.prazoRetorno) : "—")}
        ${UI.dado("Documentos pendentes", sin.documentosPendentes ? "Sim" : "Não")}
        ${UI.dado("Última atualização", Util.fmtDataHora(Dados.ultimaAtualizacao(sin)))}
        ${UI.dado("Concluído em", sin.concluidoEm ? Util.fmtDataHora(sin.concluidoEm) : "—")}
      </div>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Observações internas</h2></div>
      <p style="white-space:pre-wrap">${Util.esc(Util.ou(sin.observacoes, "Nenhuma observação registrada."))}</p>
      <div class="campo" style="margin-top:12px">
        <span>Adicionar observação</span>
        <textarea id="nova-observacao" placeholder="A observação fica carimbada com data, horário e autor."></textarea>
      </div>
      <div style="margin-top:8px"><button class="btn btn-verde btn-pequeno" data-acao="observacao">Adicionar observação</button></div>
    </div>`;
  }

  /* --- Aba: acompanhamento ------------------------------------------ */
  function corpoAcompanhamento(sin) {
    const usuario = Dados.usuarioAtual();
    const itens = (sin.acompanhamentos || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));

    const lista = itens.length ? `<div class="linha-tempo">${itens.map((a) => `
      <div class="evento">
        <div class="evento-topo">
          <strong>${Util.esc(a.tipo)}</strong>
          <span class="etiqueta cinza">${Util.esc(a.autor)}</span>
          <span class="evento-quando">${Util.esc(Util.fmtData(a.data))} às ${Util.esc(Util.fmtHora(a.hora))}</span>
        </div>
        <p>${Util.esc(a.descricao)}</p>
        ${a.proximaAcao || a.prazoRetorno ? `<p class="detalhe">
          ${a.proximaAcao ? `<b>Próxima ação:</b> ${Util.esc(a.proximaAcao)}` : ""}
          ${a.prazoRetorno ? ` · <b>Prazo:</b> ${Util.esc(Util.fmtData(a.prazoRetorno))}` : ""}</p>` : ""}
        <div style="margin-top:8px"><button class="btn btn-perigo-vazio btn-pequeno" data-remover-acomp="${a.id}">Remover</button></div>
      </div>`).join("")}</div>`
      : `<div class="vazio">Nenhuma atualização registrada até agora.</div>`;

    return `
    <div class="cartao">
      <div class="cartao-topo">
        <div><h2>Registrar atualização</h2><p>Cada atualização entra no histórico do sinistro.</p></div>
      </div>
      <div class="campo-linha">
        <label class="campo"><span>Tipo de atualização</span>
          <select id="acomp-tipo">${UI.opcoes(Dados.TIPOS_ACOMPANHAMENTO, "Análise em andamento")}</select></label>
        <label class="campo"><span>Data</span><input type="date" id="acomp-data" value="${Util.dataLocal()}" /></label>
        <label class="campo"><span>Horário</span><input type="time" id="acomp-hora" value="${Util.horaLocal()}" /></label>
        <label class="campo"><span>Registrado por</span>
          <select id="acomp-autor">${UI.opcoes(Dados.pessoas(), usuario ? usuario.nome : "")}</select></label>
      </div>
      <div class="campo" style="margin-top:12px">
        <span>Descrição da atualização <span class="obrig">*</span></span>
        <textarea id="acomp-descricao" placeholder="O que foi feito, com quem foi falado, o que ficou definido."></textarea>
      </div>
      <div class="campo-linha" style="margin-top:12px">
        <label class="campo"><span>Próxima ação</span><input id="acomp-proxima" placeholder="O que precisa ser feito a seguir" /></label>
        <label class="campo"><span>Prazo para retorno</span><input type="date" id="acomp-prazo" /></label>
      </div>
      <div style="margin-top:12px"><button class="btn btn-verde" data-acao="add-acomp">Adicionar atualização</button></div>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Acompanhamento do caso</h2><p>${Util.plural(itens.length, "atualização registrada", "atualizações registradas")}</p></div>
      ${lista}
    </div>`;
  }

  /* --- Aba: contatos ------------------------------------------------ */
  function corpoContatos(sin) {
    const itens = (sin.contatos || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
    const lista = itens.length ? `<div class="linha-tempo">${itens.map((c) => `
      <div class="evento contato">
        <div class="evento-topo">
          <strong>${c.tipo === "associado" ? "Contato com o associado" : "Contato com oficina/prestador"}</strong>
          <span class="etiqueta cinza">${Util.esc(c.canal)}</span>
          <span class="evento-quando">${Util.esc(Util.fmtDataHora(c.criadoEm))}</span>
        </div>
        ${c.quem ? `<p class="detalhe"><b>Com:</b> ${Util.esc(c.quem)}</p>` : ""}
        <p>${Util.esc(c.resumo)}</p>
        <p class="detalhe">Registrado por ${Util.esc(c.autor)}</p>
      </div>`).join("")}</div>`
      : `<div class="vazio">Nenhum contato registrado.</div>`;

    return `
    <div class="cartao">
      <div class="cartao-topo"><h2>Registrar contato</h2></div>
      <div class="campo-linha">
        <label class="campo"><span>Tipo de contato</span>
          <select id="contato-tipo">
            <option value="associado">Associado</option>
            <option value="prestador">Oficina, seguradora ou prestador</option>
          </select></label>
        <label class="campo"><span>Canal</span>
          <select id="contato-canal">${UI.opcoes(["WhatsApp", "Telefone", "E-mail", "Presencial", "Outro"], "WhatsApp")}</select></label>
        <label class="campo"><span>Com quem</span><input id="contato-quem" placeholder="Nome de quem atendeu" /></label>
      </div>
      <div class="campo" style="margin-top:12px">
        <span>Resumo do contato <span class="obrig">*</span></span>
        <textarea id="contato-resumo" placeholder="O que foi tratado no contato."></textarea>
      </div>
      <div style="margin-top:12px"><button class="btn btn-verde" data-acao="add-contato">Registrar contato</button></div>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Contatos do caso</h2><p>${Util.plural(itens.length, "contato registrado", "contatos registrados")}</p></div>
      ${lista}
    </div>`;
  }

  /* --- Aba: anexos -------------------------------------------------- */
  function corpoAnexos(sin) {
    const limite = Dados.config().limiteAnexoMB;
    const itens = (sin.anexos || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));

    const lista = itens.length ? `<div class="anexos">${itens.map((a) => `
      <div class="anexo">
        ${String(a.tipo).indexOf("image/") === 0
          ? `<img src="${Util.esc(a.conteudo)}" alt="${Util.esc(a.nome)}" />`
          : `<span class="anexo-icone">📄</span>`}
        <div class="anexo-info">
          <strong>${Util.esc(a.nome)}</strong>
          <small>${Util.esc(Util.tamanhoArquivo(a.tamanho))} · ${Util.esc(a.enviadoPor)} · ${Util.esc(Util.fmtDataHora(a.criadoEm))}</small>
        </div>
        <a class="btn btn-vazio btn-pequeno" href="${Util.esc(a.conteudo)}" download="${Util.esc(a.nome)}" target="_blank" rel="noopener">Abrir</a>
        <button class="btn btn-perigo-vazio btn-pequeno" data-remover-anexo="${a.id}">Remover</button>
      </div>`).join("")}</div>`
      : `<div class="vazio">Nenhum documento anexado.</div>`;

    return `
    <div class="cartao">
      <div class="cartao-topo"><h2>Anexar documento ou imagem</h2><p>Até ${limite} MB por arquivo.</p></div>
      <label class="campo">
        <span>Selecionar arquivos</span>
        <input type="file" id="anexo-arquivo" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" />
      </label>
      <p class="detalhe" style="color:var(--cinza-texto);font-size:12.5px;margin-top:8px">
        Fotos do veículo, boletim de ocorrência, CNH, orçamento da oficina e comprovantes.
      </p>
    </div>

    <div class="cartao">
      <div class="cartao-topo"><h2>Documentos do sinistro</h2><p>${Util.plural(itens.length, "arquivo", "arquivos")}</p></div>
      ${lista}
    </div>`;
  }

  /* --- Aba: histórico ----------------------------------------------- */
  function corpoHistorico(sin) {
    const itens = (sin.historico || []).slice().sort((a, b) => String(b.criadoEm).localeCompare(String(a.criadoEm)));
    if (!itens.length) return `<div class="cartao"><div class="vazio">Sem histórico.</div></div>`;

    return `<div class="cartao">
      <div class="cartao-topo"><h2>Histórico do sinistro</h2><p>Registro automático de tudo que aconteceu no caso.</p></div>
      <div class="linha-tempo">${itens.map((h) => `
        <div class="evento historico">
          <div class="evento-topo">
            <strong>${Util.esc(h.acao)}</strong>
            <span class="etiqueta cinza">${Util.esc(h.usuario)}</span>
            <span class="evento-quando">${Util.esc(Util.fmtDataHora(h.criadoEm))}</span>
          </div>
          <p>${Util.esc(h.detalhe)}</p>
          ${h.de || h.para ? `<p class="detalhe">${Util.esc(Util.ou(h.de, "—"))} → ${Util.esc(Util.ou(h.para, "—"))}</p>` : ""}
        </div>`).join("")}</div>
    </div>`;
  }

  /* --- Eventos do detalhe -------------------------------------------- */
  function ligarDetalhe(sin, corpo, rodape) {
    $$("[data-aba]", corpo).forEach((btn) => {
      btn.addEventListener("click", () => { abaAtual = btn.dataset.aba; desenharDetalhe(); });
    });

    if (abaAtual === "editar") ligarMascaras(corpo);

    // Alterações rápidas de status, prioridade, atendente e responsável.
    $$("[data-rapido]", corpo).forEach((sel) => {
      sel.addEventListener("change", () => {
        const campoNome = sel.dataset.rapido;
        const valor = sel.value;
        if (campoNome === "status") {
          if (valor === "concluido") return pedirConclusao(sin.id);
          if (sin.status === "concluido") return pedirReabertura(sin.id, valor);
          Dados.mover(sin.id, valor);
          UI.sucesso(`Movido para “${Dados.nomeStatus(valor)}”.`);
        } else if (campoNome === "prioridade") {
          Dados.alterarPrioridade(sin.id, valor);
          UI.sucesso(`Prioridade alterada para ${Dados.nomePrioridade(valor)}.`);
        } else {
          Dados.alterarPessoa(sin.id, campoNome, valor);
          UI.sucesso("Equipe do caso atualizada.");
        }
        desenharDetalhe();
      });
    });

    const clicar = (seletor, fn) => { const el = $(seletor, corpo) || $(seletor, rodape); if (el) el.addEventListener("click", fn); };

    clicar('[data-acao="observacao"]', () => {
      const txt = $("#nova-observacao", corpo);
      try {
        Dados.adicionarObservacao(sin.id, txt.value);
        UI.sucesso("Observação adicionada.");
        desenharDetalhe();
      } catch (e) { UI.erro(e.message); }
    });

    clicar('[data-acao="add-acomp"]', () => {
      try {
        Dados.adicionarAcompanhamento(sin.id, {
          tipo: $("#acomp-tipo", corpo).value,
          data: $("#acomp-data", corpo).value,
          hora: $("#acomp-hora", corpo).value,
          autor: $("#acomp-autor", corpo).value,
          descricao: $("#acomp-descricao", corpo).value,
          proximaAcao: $("#acomp-proxima", corpo).value,
          prazoRetorno: $("#acomp-prazo", corpo).value,
        });
        UI.sucesso("Atualização registrada.");
        desenharDetalhe();
      } catch (e) { UI.erro(e.message); }
    });

    $$("[data-remover-acomp]", corpo).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const ok = await UI.confirmar({ titulo: "Remover atualização", texto: "A atualização sai do acompanhamento, mas a remoção fica registrada no histórico.", rotulo: "Remover", perigo: true });
        if (!ok) return;
        Dados.removerAcompanhamento(sin.id, btn.dataset.removerAcomp);
        UI.sucesso("Atualização removida.");
        desenharDetalhe();
      });
    });

    clicar('[data-acao="add-contato"]', () => {
      try {
        Dados.adicionarContato(sin.id, {
          tipo: $("#contato-tipo", corpo).value,
          canal: $("#contato-canal", corpo).value,
          quem: $("#contato-quem", corpo).value,
          resumo: $("#contato-resumo", corpo).value,
        });
        UI.sucesso("Contato registrado.");
        desenharDetalhe();
      } catch (e) { UI.erro(e.message); }
    });

    const entradaAnexo = $("#anexo-arquivo", corpo);
    if (entradaAnexo) {
      entradaAnexo.addEventListener("change", async () => {
        const arquivos = Array.from(entradaAnexo.files || []);
        for (const arquivo of arquivos) {
          try {
            await Dados.adicionarAnexo(sin.id, arquivo);
            UI.sucesso(`“${arquivo.name}” anexado.`);
          } catch (e) { UI.erro(e.message); }
        }
        desenharDetalhe();
      });
    }

    $$("[data-remover-anexo]", corpo).forEach((btn) => {
      btn.addEventListener("click", async () => {
        const ok = await UI.confirmar({ titulo: "Remover documento", texto: "O arquivo será apagado deste sinistro.", rotulo: "Remover", perigo: true });
        if (!ok) return;
        Dados.removerAnexo(sin.id, btn.dataset.removerAnexo);
        UI.sucesso("Documento removido.");
        desenharDetalhe();
      });
    });

    // Rodapé
    clicar('[data-acao="fechar"]', UI.fecharGaveta);
    clicar('[data-acao="editar"]', () => { abaAtual = "editar"; desenharDetalhe(); });
    clicar('[data-acao="cancelar-edicao"]', () => { abaAtual = "resumo"; desenharDetalhe(); });

    clicar('[data-acao="salvar-edicao"]', () => {
      const form = $("#form-sinistro", corpo);
      const r = Dados.atualizar(sin.id, lerFormulario(form));
      if (!r.ok) return mostrarErros(corpo, r.erros);
      UI.sucesso("Sinistro atualizado.");
      abaAtual = "resumo";
      desenharDetalhe();
    });

    clicar('[data-acao="urgente"]', () => {
      Dados.mover(sin.id, "urgente");
      UI.alerta("Caso marcado como urgente.");
      desenharDetalhe();
    });

    clicar('[data-acao="resolvendo"]', () => {
      Dados.mover(sin.id, "resolvendo");
      UI.sucesso("Caso movido para Resolvendo.");
      desenharDetalhe();
    });

    clicar('[data-acao="concluir"]', () => pedirConclusao(sin.id));
    clicar('[data-acao="reabrir"]', () => pedirReabertura(sin.id, "resolvendo"));

    clicar('[data-acao="excluir"]', async () => {
      const ok = await UI.confirmar({
        titulo: "Excluir sinistro",
        texto: `O cadastro ${sin.numero} — ${sin.associado} será apagado definitivamente, junto com o histórico e os anexos. Essa ação não pode ser desfeita.`,
        rotulo: "Excluir definitivamente", perigo: true,
      });
      if (!ok) return;
      try {
        Dados.excluir(sin.id);
        UI.sucesso("Sinistro excluído.");
        UI.fecharGaveta();
      } catch (e) { UI.erro(e.message); }
    });
  }

  async function pedirConclusao(id) {
    const sin = Dados.obter(id);
    const ok = await UI.confirmar({
      titulo: "Concluir caso",
      texto: `Confirmar a conclusão do sinistro ${sin.numero} — ${sin.associado}? O caso vai para a coluna “Caso concluído” e continua disponível para consulta.`,
      rotulo: "Concluir caso",
    });
    if (!ok) { desenharDetalhe(); return; }
    Dados.mover(id, "concluido");
    UI.sucesso("Caso concluído.");
    desenharDetalhe();
  }

  async function pedirReabertura(id, destino) {
    const sin = Dados.obter(id);
    const alvo = destino && destino !== "concluido" ? destino : "resolvendo";
    const ok = await UI.confirmar({
      titulo: "Reabrir caso",
      texto: `Reabrir o sinistro ${sin.numero} e mover para “${Dados.nomeStatus(alvo)}”?`,
      rotulo: "Reabrir caso",
    });
    if (!ok) { desenharDetalhe(); return; }
    Dados.mover(id, alvo);
    UI.sucesso("Caso reaberto.");
    desenharDetalhe();
  }

  return { abrirCadastro, abrirDetalhe, formularioHTML, ligarMascaras, lerFormulario, mostrarErros };
})();

/* ===== js/kanban.js ===== */
/* ==================================================================
   Kanban — o coração do sistema.
   Quatro colunas, cards arrastáveis e movimentação salva na hora.
   No toque (celular/tablet), os botões de mover fazem o mesmo papel
   do arrastar.
   ================================================================== */
const Kanban = (() => {

  const $ = UI.$;
  const $$ = UI.$$;

  let arrastandoId = null;

  /* ---------------------------------------------------------------- */
  /* Card                                                              */
  /* ---------------------------------------------------------------- */
  function cardHTML(sin) {
    const veiculo = [sin.marca, sin.modelo].filter(Boolean).join(" ");
    const destinos = Dados.STATUS.filter((s) => s.id !== sin.status);

    return `<article class="card prioridade-${Util.esc(sin.prioridade)}${sin.status === "concluido" ? " concluido" : ""}"
      draggable="true" data-id="${Util.esc(sin.id)}" tabindex="0"
      aria-label="Sinistro ${Util.esc(sin.numero)} de ${Util.esc(sin.associado)}">

      <div class="card-topo">
        <div>
          <div class="card-nome">${Util.esc(sin.associado)}</div>
          <div class="card-numero">${Util.esc(sin.numero)}${sin.protocolo ? ` · ${Util.esc(sin.protocolo)}` : ""}</div>
        </div>
        ${UI.etiquetaPrioridade(sin.prioridade)}
      </div>

      <div class="card-linha">
        <span class="etiqueta azul">${Util.esc(sin.tipo)}</span>
        ${Number(sin.vitimas) > 0 ? `<span class="etiqueta vermelha">${Util.plural(Number(sin.vitimas), "vítima", "vítimas")}</span>` : ""}
        ${Number(sin.veiculosEnvolvidos) > 1 ? `<span class="etiqueta cinza">${Number(sin.veiculosEnvolvidos)} veículos</span>` : ""}
      </div>

      <div class="card-veiculo">
        <span class="placa">${Util.esc(Util.ou(sin.placa, "SEM PLACA"))}</span>
        <span>${Util.esc(Util.ou(veiculo, "Veículo não informado"))}</span>
      </div>

      <div class="card-linha">
        <span><b>Incidente:</b> ${Util.esc(Util.fmtData(sin.dataIncidente))} às ${Util.esc(Util.fmtHora(sin.horaIncidente))}</span>
      </div>
      <div class="card-linha">
        <span><b>Atendente:</b> ${Util.esc(Util.ou(sin.atendente))}</span>
        <span><b>Responsável:</b> ${Util.esc(Util.ou(sin.responsavel, "sem responsável"))}</span>
      </div>

      ${UI.alertasHTML(sin)}

      <div class="card-rodape">
        ${UI.etiquetaStatus(sin.status)}
        <span class="card-tempo">${sin.status === "concluido"
          ? `Concluído ${sin.concluidoEm ? "há " + Util.esc(Util.tempoDesde(sin.concluidoEm)) : ""}`
          : `Aberto há ${Util.esc(Util.tempoDesde(sin.criadoEm))}`}</span>
      </div>

      <div class="card-mover">
        ${destinos.map((d) => `<button class="btn btn-vazio btn-pequeno" data-mover="${d.id}" data-sin="${Util.esc(sin.id)}"
          title="Mover para ${Util.esc(d.nome)}">→ ${Util.esc(d.nome)}</button>`).join("")}
      </div>
    </article>`;
  }

  /* ---------------------------------------------------------------- */
  /* Quadro                                                            */
  /* ---------------------------------------------------------------- */
  function quadroHTML(sinistros) {
    return `<div class="quadro" id="quadro">${Dados.STATUS.map((coluna) => {
      const itens = sinistros
        .filter((s) => s.status === coluna.id)
        .sort(ordenar);

      return `<section class="coluna" data-status="${coluna.id}">
        <header class="coluna-topo">
          <h3>${Util.esc(coluna.nome)}</h3>
          <span class="contador">${itens.length}</span>
        </header>
        <div class="coluna-lista" data-lista="${coluna.id}">
          ${itens.length ? itens.map(cardHTML).join("") : `<div class="vazio">Nenhum sinistro nesta etapa.</div>`}
        </div>
      </section>`;
    }).join("")}</div>`;
  }

  /** Urgentes primeiro, depois prazo vencido, depois mais antigos no topo. */
  function ordenar(a, b) {
    const peso = (s) => (s.prioridade === "urgente" ? 0 : s.prioridade === "atencao" ? 1 : 2);
    if (peso(a) !== peso(b)) return peso(a) - peso(b);
    const venc = (s) => (Dados.prazoVencido(s) ? 0 : 1);
    if (venc(a) !== venc(b)) return venc(a) - venc(b);
    if (a.status === "concluido") return String(b.concluidoEm || "").localeCompare(String(a.concluidoEm || ""));
    return String(a.criadoEm).localeCompare(String(b.criadoEm));
  }

  /* ---------------------------------------------------------------- */
  /* Interação                                                         */
  /* ---------------------------------------------------------------- */
  function ligar(raiz) {
    $$(".card", raiz).forEach((card) => {
      card.addEventListener("dragstart", (e) => {
        arrastandoId = card.dataset.id;
        card.classList.add("arrastando");
        try {
          e.dataTransfer.setData("text/plain", arrastandoId);
          e.dataTransfer.effectAllowed = "move";
        } catch (err) { /* navegadores antigos */ }
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("arrastando");
        arrastandoId = null;
        $$(".coluna-lista", raiz).forEach((l) => l.classList.remove("recebendo"));
      });

      card.addEventListener("click", (e) => {
        if (e.target.closest("[data-mover]")) return;
        Formularios.abrirDetalhe(card.dataset.id);
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          Formularios.abrirDetalhe(card.dataset.id);
        }
      });
    });

    $$("[data-mover]", raiz).forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        mover(btn.dataset.sin, btn.dataset.mover);
      });
    });

    $$(".coluna-lista", raiz).forEach((lista) => {
      lista.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        lista.classList.add("recebendo");
      });
      lista.addEventListener("dragleave", (e) => {
        if (!lista.contains(e.relatedTarget)) lista.classList.remove("recebendo");
      });
      lista.addEventListener("drop", (e) => {
        e.preventDefault();
        lista.classList.remove("recebendo");
        let id = arrastandoId;
        try { id = e.dataTransfer.getData("text/plain") || arrastandoId; } catch (err) { /* ignora */ }
        if (id) mover(id, lista.dataset.lista);
      });
    });
  }

  /** Movimentação: conclusão e reabertura pedem confirmação; o resto salva direto. */
  async function mover(id, destino) {
    const sin = Dados.obter(id);
    if (!sin || sin.status === destino) return;

    if (destino === "concluido") {
      const ok = await UI.confirmar({
        titulo: "Concluir caso",
        texto: `Confirmar a conclusão do sinistro ${sin.numero} — ${sin.associado}? O caso continua guardado no sistema.`,
        rotulo: "Concluir caso",
      });
      if (!ok) { App.desenhar(); return; }
    } else if (sin.status === "concluido") {
      const ok = await UI.confirmar({
        titulo: "Reabrir caso",
        texto: `Reabrir o sinistro ${sin.numero} e mover para “${Dados.nomeStatus(destino)}”?`,
        rotulo: "Reabrir caso",
      });
      if (!ok) { App.desenhar(); return; }
    }

    Dados.mover(id, destino);
    if (destino === "concluido") UI.sucesso("Caso concluído.");
    else if (destino === "urgente") UI.alerta(`${sin.numero} movido para Caso urgente.`);
    else UI.sucesso(`${sin.numero} movido para “${Dados.nomeStatus(destino)}”.`);
  }

  return { quadroHTML, cardHTML, ligar, mover, ordenar };
})();

        ${UI.dado("Documentos pendentes", ind.documentosPendentes)}
        ${UI.dado("Prazo vencido", ind.prazoVencido)}
        ${UI.dado("Sem atualização", ind.semAtualizacao)}
        ${UI.dado("Sem responsável", ind.semResponsavel)}
        ${UI.dado("Concluídos hoje", ind.concluidosHoje)}
        ${UI.dado("Tempo médio de conclusão", ind.tempoMedio)}
      </div>
    </div>`;
  }

  /* ---------------------------------------------------------------- */
  /* Prazos e pendências                                               */
  /* ---------------------------------------------------------------- */
  function prazos() {
    const abertos = Dados.lista().filter((s) => s.status !== "concluido");

    const grupos = [
      { chave: "urgente-parado", titulo: "Casos urgentes sem atualização", cor: "var(--vermelho)" },
      { chave: "prazo", titulo: "Prazo de retorno vencido", cor: "var(--vermelho)" },
      { chave: "documentos", titulo: "Documentos pendentes", cor: "var(--amarelo)" },
      { chave: "parado", titulo: "Parados há muito tempo", cor: "var(--amarelo)" },
      { chave: "sem-atualizacao", titulo: "Sem atualização recente", cor: "var(--amarelo)" },
      { chave: "sem-responsavel", titulo: "Casos sem responsável", cor: "var(--amarelo)" },
      { chave: "sem-contato", titulo: "Sem contato recente com o associado", cor: "var(--amarelo)" },
    ];

    const proximos = abertos
      .filter((s) => s.prazoRetorno && !Dados.prazoVencido(s))
      .sort((a, b) => String(a.prazoRetorno).localeCompare(String(b.prazoRetorno)))
      .slice(0, 10);

    const blocos = grupos.map((g) => {
      const itens = abertos.filter((s) => Dados.temAlerta(s, g.chave));
      return `<div class="cartao" style="border-left:4px solid ${g.cor}">
        <div class="cartao-topo">
          <div><h2>${Util.esc(g.titulo)}</h2><p>${Util.plural(itens.length, "caso", "casos")}</p></div>
        </div>
        ${tabelaHTML(itens, { vazio: "Nenhum caso nesta condição." })}
      </div>`;
    }).join("");

    return `
    <div class="cartao">
      <div class="cartao-topo"><h2>Próximos prazos de retorno</h2><p>Casos em aberto com prazo definido</p></div>
      ${proximos.length ? `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Prazo</th><th>Sinistro</th><th>Associado</th><th>Próxima ação</th><th>Responsável</th><th>Status</th></tr></thead>
        <tbody>${proximos.map((s) => `<tr class="clicavel" data-abrir="${Util.esc(s.id)}">
          <td><strong>${Util.esc(Util.fmtData(s.prazoRetorno))}</strong></td>
          <td>${Util.esc(s.numero)}</td>
          <td>${Util.esc(s.associado)}</td>
          <td>${Util.esc(Util.ou(s.proximaAcao, "—"))}</td>
          <td>${Util.esc(Util.ou(s.responsavel, "—"))}</td>
          <td>${UI.etiquetaStatus(s.status)}</td>
        </tr>`).join("")}</tbody></table></div>` : '<div class="vazio">Nenhum prazo futuro cadastrado.</div>'}
    </div>
    ${blocos}`;
  }

  /* ---------------------------------------------------------------- */
  /* Histórico geral                                                   */
  /* ---------------------------------------------------------------- */
  function historico(estado) {
    const termo = Util.normalizar(estado.busca);
    const acoes = Array.from(new Set(Dados.historicoGlobal().map((h) => h.acao))).sort();
    const usuarios = Array.from(new Set(Dados.historicoGlobal().map((h) => h.usuario))).sort();

    const linhas = Dados.historicoGlobal().filter((h) => {
      if (estado.historicoAcao && h.acao !== estado.historicoAcao) return false;
      if (estado.historicoUsuario && h.usuario !== estado.historicoUsuario) return false;
      if (!termo) return true;
      return Util.normalizar([h.numero, h.associado, h.acao, h.detalhe, h.usuario].join(" ")).indexOf(termo) >= 0;
    });

    return `
    <div class="filtros nao-imprime">
      <label class="filtro"><span>Tipo de alteração</span>
        <select data-hist="historicoAcao">${UI.opcoes(acoes, estado.historicoAcao, "Todas")}</select></label>
      <label class="filtro"><span>Usuário</span>
        <select data-hist="historicoUsuario">${UI.opcoes(usuarios, estado.historicoUsuario, "Todos")}</select></label>
      <div class="filtros-marcas">
        <button class="marca-filtro" data-exportar-historico>Exportar planilha</button>
      </div>
    </div>

    <div class="cartao">
      <div class="cartao-topo">
        <div><h2>Histórico de todos os sinistros</h2><p>${Util.plural(linhas.length, "registro", "registros")}</p></div>
      </div>
      ${linhas.length ? `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Data e horário</th><th>Sinistro</th><th>Usuário</th><th>Alteração</th><th>Detalhe</th><th>De → Para</th></tr></thead>
        <tbody>${linhas.slice(0, 400).map((h) => `<tr class="clicavel" data-abrir="${Util.esc(h.sinistroId)}">
          <td>${Util.esc(Util.fmtDataHora(h.criadoEm))}</td>
          <td><strong>${Util.esc(h.numero)}</strong><br /><small>${Util.esc(h.associado)}</small></td>
          <td>${Util.esc(h.usuario)}</td>
          <td>${Util.esc(h.acao)}</td>
          <td>${Util.esc(h.detalhe)}</td>

        </tr>`).join("")}</tbody></table></div>
        ${linhas.length > 400 ? '<p class="detalhe" style="margin-top:10px;color:var(--cinza-texto)">Exibindo os 400 registros mais recentes. Use os filtros ou a busca para refinar.</p>' : ""}`

    const backup = $("[data-exportar-backup]", raiz);
    if (backup) backup.addEventListener("click", () => {

    if (importar) importar.addEventListener("change", async () => {
      const arquivo = importar.files && importar.files[0];
      if (!arquivo) return;
      const ok = await UI.confirmar({
        titulo: "Importar backup",

      if (!ok) { importar.value = ""; return; }

        try { Dados.importarBackup(leitor.result); UI.sucesso("Backup importado."); redesenhar(); }

    const demo = $("[data-restaurar-demo]", raiz);
    if (demo) demo.addEventListener("click", async () => {
      const ok = await UI.confirmar({

      if (!ok) return;
      try { Dados.restaurarDemonstracao(); UI.sucesso("Base de demonstração recriada."); redesenhar(); }
      catch (e) { UI.erro(e.message); }
    });
  }

  return {
    tabelaHTML, ligarTabela, filtrosHTML, ligarFiltros,
    visaoGeral, prazos, historico, ligarHistorico,
    usuarios, ligarUsuarios, configuracoes, ligarConfiguracoes,
  };
})();

/* ===== js/relatorios.js ===== */
/* ==================================================================
   Relatórios — números do Setor Plus por período, com exportação
   em planilha (CSV) e em PDF (impressão do navegador).
   ================================================================== */
const Relatorios = (() => {

  const $ = UI.$;
  const $$ = UI.$$;

  const PERIODOS = [
    { id: "hoje", nome: "Hoje" },
    { id: "7", nome: "Últimos 7 dias" },
    { id: "30", nome: "Últimos 30 dias" },
    { id: "mes", nome: "Este mês" },
    { id: "mespassado", nome: "Mês passado" },
    { id: "ano", nome: "Este ano" },
    { id: "tudo", nome: "Todo o período" },
    { id: "personalizado", nome: "Personalizado" },
  ];

  /** Converte o período escolhido em duas datas (aaaa-mm-dd). */
  function intervalo(estado) {
    const hoje = new Date();
    const dia = (d) => Util.dataLocal(d);
    const menos = (n) => dia(new Date(Date.now() - n * 86400000));

    switch (estado.periodo) {
      case "hoje": return { de: dia(hoje), ate: dia(hoje) };
      case "7": return { de: menos(6), ate: dia(hoje) };
      case "30": return { de: menos(29), ate: dia(hoje) };
      case "mes": return { de: dia(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), ate: dia(hoje) };
      case "mespassado": {
        const inicio = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
        const fim = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
        return { de: dia(inicio), ate: dia(fim) };
      }
      case "ano": return { de: dia(new Date(hoje.getFullYear(), 0, 1)), ate: dia(hoje) };
      case "personalizado": return { de: estado.relDe || "", ate: estado.relAte || "" };
      default: return { de: "", ate: "" };
    }
  }

  function selecionados(estado) {
    const { de, ate } = intervalo(estado);
    return Dados.lista().filter((s) => {
      const abertura = Util.dataLocal(Util.paraData(s.criadoEm));
      if (de && abertura < de) return false;
      if (ate && abertura > ate) return false;
      return true;
    });
  }

  /* ---------------------------------------------------------------- */
  /* Blocos                                                            */
  /* ---------------------------------------------------------------- */
  function agrupar(lista, obterChave) {
    const mapa = new Map();
    lista.forEach((s) => {
      const chave = obterChave(s) || "Não informado";
      mapa.set(chave, (mapa.get(chave) || 0) + 1);
    });
    return Array.from(mapa.entries())
      .map(([nome, valor]) => ({ nome, valor }))
      .sort((a, b) => b.valor - a.valor);
  }

  function tabelaAgrupada(titulo, subtitulo, linhas, total) {
    const max = Math.max.apply(null, linhas.map((l) => l.valor).concat([1]));
    return `<div class="cartao">
      <div class="cartao-topo"><div><h2>${Util.esc(titulo)}</h2><p>${Util.esc(subtitulo || "")}</p></div></div>
      ${linhas.length ? `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>${Util.esc(titulo)}</th><th class="num">Sinistros</th><th class="num">Participação</th><th style="width:180px"></th></tr></thead>
        <tbody>${linhas.map((l) => `<tr>
          <td>${Util.esc(l.nome)}</td>
          <td class="num">${l.valor}</td>
          <td class="num">${total ? Math.round((l.valor / total) * 100) : 0}%</td>
          <td>${UI.barra(l.valor, max)}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : '<div class="vazio">Sem dados no período selecionado.</div>'}
    </div>`;
  }

  /** Distribuição por mês de abertura. */
  function porMes(lista) {
    const mapa = new Map();
    lista.forEach((s) => {
      const d = Util.paraData(s.criadoEm);
      if (!d) return;
      const chave = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      mapa.set(chave, (mapa.get(chave) || 0) + 1);
    });
    return Array.from(mapa.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([chave, valor]) => {
        const [ano, mes] = chave.split("-");
        return { nome: `${mes}/${ano}`, valor };
      });
  }

  /* ---------------------------------------------------------------- */
  /* Página                                                            */
  /* ---------------------------------------------------------------- */
  function pagina(estado) {
    const lista = selecionados(estado);
    const { de, ate } = intervalo(estado);
    const c = Dados.config();

    const concluidos = lista.filter((s) => s.status === "concluido");
    const pendentes = lista.filter((s) => s.status !== "concluido");
    const urgentes = lista.filter((s) => s.status === "urgente" || s.prioridade === "urgente");
    const comVitimas = lista.filter((s) => Number(s.vitimas) > 0);
    const vencidos = lista.filter(Dados.prazoVencido);

    const tempos = concluidos
      .filter((s) => s.concluidoEm)
      .map((s) => new Date(s.concluidoEm) - new Date(s.criadoEm))
      .filter((ms) => ms >= 0);
    const medio = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : 0;
    const totalVitimas = lista.reduce((soma, s) => soma + Number(s.vitimas || 0), 0);
    const totalVeiculos = lista.reduce((soma, s) => soma + Number(s.veiculosEnvolvidos || 0), 0);

    return `
    <div class="filtros nao-imprime">
      <label class="filtro"><span>Período</span>
        <select data-rel="periodo">${UI.opcoes(PERIODOS, estado.periodo || "30")}</select></label>
      <label class="filtro"><span>De</span>
        <input type="date" data-rel="relDe" value="${Util.esc(estado.relDe || de || "")}" /></label>
      <label class="filtro"><span>Até</span>
        <input type="date" data-rel="relAte" value="${Util.esc(estado.relAte || ate || "")}" /></label>
      <div class="filtros-marcas">
        <button class="marca-filtro" data-rel-csv>Exportar planilha (CSV)</button>
        <button class="marca-filtro" data-rel-pdf>Gerar PDF</button>
      </div>
    </div>

    <div class="cartao">
      <div class="cartao-topo">
        <div>
          <h2>${Util.esc(c.empresa)} — ${Util.esc(c.setor)}</h2>
          <p>Relatório de sinistros · ${de ? Util.fmtData(de) : "início"} a ${ate ? Util.fmtData(ate) : "hoje"} · gerado em ${Util.fmtDataHora(Util.agoraISO())}</p>
        </div>
      </div>
      <div class="dados-grade">
        ${UI.dado("Sinistros no período", lista.length)}
        ${UI.dado("Casos concluídos", concluidos.length)}
        ${UI.dado("Casos pendentes", pendentes.length)}
        ${UI.dado("Casos urgentes", urgentes.length)}
        ${UI.dado("Casos com vítimas", comVitimas.length)}
        ${UI.dado("Total de vítimas", totalVitimas)}
        ${UI.dado("Veículos envolvidos", totalVeiculos)}
        ${UI.dado("Sinistros com prazo vencido", vencidos.length)}
        ${UI.dado("Tempo médio de resolução", medio ? Util.duracao(medio) : "—")}
      </div>
    </div>

    ${tabelaAgrupada("Sinistros por período (mês de abertura)", "Volume de casos abertos por mês", porMes(lista), lista.length)}
    ${tabelaAgrupada("Sinistros por tipo", "Natureza das ocorrências", agrupar(lista, (s) => s.tipo), lista.length)}
    ${tabelaAgrupada("Sinistros por atendente", "Quem registrou o atendimento", agrupar(lista, (s) => s.atendente), lista.length)}
    ${tabelaAgrupada("Sinistros por responsável", "Quem conduz o caso", agrupar(lista, (s) => s.responsavel), lista.length)}
    ${tabelaAgrupada("Sinistros por status", "Situação atual no quadro", agrupar(lista, (s) => Dados.nomeStatus(s.status)), lista.length)}
    ${tabelaAgrupada("Sinistros por classificação", "Enquadramento do caso", agrupar(lista, (s) => s.classificacao), lista.length)}

    <div class="cartao">
      <div class="cartao-topo"><div><h2>Casos urgentes</h2><p>${Util.plural(urgentes.length, "caso", "casos")}</p></div></div>
      ${Paginas.tabelaHTML(urgentes, { vazio: "Nenhum caso urgente no período." })}
    </div>

    <div class="cartao">
      <div class="cartao-topo"><div><h2>Casos com vítimas</h2><p>${Util.plural(comVitimas.length, "caso", "casos")} · ${Util.plural(totalVitimas, "vítima", "vítimas")}</p></div></div>
      ${Paginas.tabelaHTML(comVitimas, { vazio: "Nenhum caso com vítimas no período." })}
    </div>

    <div class="cartao">
      <div class="cartao-topo"><div><h2>Sinistros com prazo vencido</h2><p>${Util.plural(vencidos.length, "caso", "casos")}</p></div></div>
      ${Paginas.tabelaHTML(vencidos, { vazio: "Nenhum prazo vencido no período." })}
    </div>

    <div class="cartao">
      <div class="cartao-topo"><div><h2>Casos pendentes</h2><p>${Util.plural(pendentes.length, "caso em aberto", "casos em aberto")}</p></div></div>
      ${Paginas.tabelaHTML(pendentes, { vazio: "Nenhum caso pendente no período." })}
    </div>

    <div class="cartao">
      <div class="cartao-topo"><div><h2>Casos concluídos</h2><p>${Util.plural(concluidos.length, "caso", "casos")} · tempo médio ${medio ? Util.duracao(medio) : "—"}</p></div></div>
      ${Paginas.tabelaHTML(concluidos, { vazio: "Nenhum caso concluído no período.", colunaTempo: "Concluído" })}
    </div>`;
  }

  /* ---------------------------------------------------------------- */
  /* Exportação                                                        */
  /* ---------------------------------------------------------------- */
  const CABECALHO = [
    "Número", "Protocolo", "Status", "Prioridade", "Classificação",
    "Associado", "WhatsApp", "CPF/documento", "Contrato",
    "Data do incidente", "Hora do incidente", "Local", "Tipo", "Descrição",
    "Vítimas", "Veículos envolvidos", "Boletim de ocorrência", "Número do BO",
    "Guincho", "Atendimento médico",
    "Placa", "Marca", "Modelo", "Ano", "Cor",
    "Data do atendimento", "Hora do atendimento", "Atendente", "Responsável",
    "Prestador", "Próxima ação", "Prazo de retorno", "Documentos pendentes",
    "Aberto em", "Aberto há", "Última atualização", "Concluído em",
    "Atualizações", "Contatos", "Anexos", "Observações internas",
  ];

  function linhaCSV(s) {
    return [
      s.numero, s.protocolo, Dados.nomeStatus(s.status), Dados.nomePrioridade(s.prioridade), s.classificacao,
      s.associado, s.whatsapp, s.documento, s.contrato,
      Util.fmtData(s.dataIncidente), Util.fmtHora(s.horaIncidente), s.local, s.tipo, s.descricao,
      s.vitimas, s.veiculosEnvolvidos, s.temBO ? "Sim" : "Não", s.numeroBO,
      s.guincho ? "Sim" : "Não", s.atendimentoMedico ? "Sim" : "Não",
      s.placa, s.marca, s.modelo, s.ano, s.cor,
      Util.fmtData(s.dataAtendimento), Util.fmtHora(s.horaAtendimento), s.atendente, s.responsavel,
      s.prestador, s.proximaAcao, s.prazoRetorno ? Util.fmtData(s.prazoRetorno) : "", s.documentosPendentes ? "Sim" : "Não",
      Util.fmtDataHora(s.criadoEm), Util.tempoDesde(s.criadoEm), Util.fmtDataHora(Dados.ultimaAtualizacao(s)),
      s.concluidoEm ? Util.fmtDataHora(s.concluidoEm) : "",
      (s.acompanhamentos || []).length, (s.contatos || []).length, (s.anexos || []).length,
      String(s.observacoes || "").replace(/\s+/g, " "),
    ];
  }

  function exportarSinistros(lista, nome) {
    const linhas = [CABECALHO].concat(lista.map(linhaCSV));
    Util.baixarCSV(nome || `sinistros-${Util.dataLocal()}.csv`, linhas);
    UI.sucesso(`${Util.plural(lista.length, "sinistro exportado", "sinistros exportados")}.`);
  }

  function ligar(raiz, estado, redesenhar) {
    $$("[data-rel]", raiz).forEach((el) => {
      el.addEventListener("change", () => {
        const chave = el.dataset.rel;
        estado[chave] = el.value;
        if (chave === "relDe" || chave === "relAte") estado.periodo = "personalizado";
        redesenhar();
      });
    });

    const csv = $("[data-rel-csv]", raiz);
    if (csv) csv.addEventListener("click", () => {
      const { de, ate } = intervalo(estado);
      exportarSinistros(selecionados(estado), `relatorio-sinistros-${de || "inicio"}-a-${ate || Util.dataLocal()}.csv`);
    });

    const pdf = $("[data-rel-pdf]", raiz);
    if (pdf) pdf.addEventListener("click", () => {
      UI.aviso("Escolha “Salvar como PDF” na janela de impressão.");
      setTimeout(() => window.print(), 350);
    });
  }

  return { pagina, ligar, exportarSinistros, selecionados, intervalo, PERIODOS };
})();

/* ===== js/app.js ===== */
/* ==================================================================
   App — menu lateral, rotas, indicadores e busca.
   ================================================================== */
const App = (() => {

  const $ = UI.$;
  const $$ = UI.$$;

  const estado = {
    pagina: "visao-geral",
    busca: "",
    filtros: {},
    filtrosAbertos: false,
    periodo: "30",
    relDe: "",
    relAte: "",
    historicoAcao: null,
    historicoUsuario: null,
  };

  const MENU = [
    { grupo: "Painel" },
    { id: "visao-geral", nome: "Visão geral", icone: "▦", titulo: "Visão geral", sub: "Resumo dos sinistros do Setor Plus." },
    { id: "workflow", nome: "Workflow de sinistros", icone: "☰", titulo: "Workflow de sinistros", sub: "Arraste os cards entre as etapas. Toda movimentação é salva." },
    { id: "cadastrar", nome: "Cadastrar sinistro", icone: "＋", acao: true },

    { grupo: "Etapas" },
    { id: "urgentes", nome: "Casos urgentes", icone: "!", titulo: "Casos urgentes", sub: "Casos graves ou com atendimento imediato.", contador: () => Dados.lista().filter((s) => s.status === "urgente").length, alerta: true },
    { id: "resolvendo", nome: "Em resolução", icone: "◐", titulo: "Em resolução", sub: "Casos acompanhados pela equipe responsável.", contador: () => Dados.lista().filter((s) => s.status === "resolvendo").length },
    { id: "concluidos", nome: "Casos concluídos", icone: "✓", titulo: "Casos concluídos", sub: "Casos finalizados, resolvidos ou encerrados.", contador: () => Dados.lista().filter((s) => s.status === "concluido").length },

    { grupo: "Controle" },
    { id: "prazos", nome: "Prazos e pendências", icone: "⏱", titulo: "Prazos e pendências", sub: "Alertas de prazo, documentos e casos parados.", contador: () => Dados.indicadores().prazoVencido, alerta: true },
    { id: "historico", nome: "Histórico", icone: "≡", titulo: "Histórico", sub: "Registro automático de tudo que acontece nos sinistros." },
    { id: "relatorios", nome: "Relatórios", icone: "▤", titulo: "Relatórios", sub: "Números do setor por período, com exportação." },

    { grupo: "Administração" },
    { id: "usuarios", nome: "Usuários", icone: "◍", titulo: "Usuários", sub: "Perfis de acesso da equipe." },
    { id: "config", nome: "Configurações", icone: "⚙", titulo: "Configurações", sub: "Alertas, identificação e backup dos dados." },
  ];

  /* ---------------------------------------------------------------- */
  /* Menu                                                              */
  /* ---------------------------------------------------------------- */
  function desenharMenu() {
    $("#menu").innerHTML = MENU.map((item) => {
      if (item.grupo) return `<div class="menu-titulo">${Util.esc(item.grupo)}</div>`;
      const n = item.contador ? item.contador() : 0;
      const selo = item.contador && n > 0
        ? `<span class="selo${item.alerta ? " selo-vermelho" : ""}">${n}</span>` : "";
      return `<button class="menu-item${item.id === estado.pagina ? " ativo" : ""}" data-pagina="${item.id}">
        <span class="menu-icone">${item.icone}</span>${Util.esc(item.nome)}${selo}</button>`;
    }).join("");

    $$("[data-pagina]", $("#menu")).forEach((btn) => {
      btn.addEventListener("click", () => ir(btn.dataset.pagina));
    });
  }

  function ir(pagina) {
    if (pagina === "cadastrar") { Formularios.abrirCadastro(); fecharMenuMobile(); return; }
    estado.pagina = pagina;
    // Cada etapa entra com o filtro de status já aplicado.
    if (pagina === "urgentes") estado.filtros = { status: "urgente" };
    else if (pagina === "resolvendo") estado.filtros = { status: "resolvendo" };
    else if (pagina === "concluidos") estado.filtros = { status: "concluido" };
    else if (["visao-geral", "workflow"].indexOf(pagina) >= 0) estado.filtros = {};
    fecharMenuMobile();
    desenhar();
    window.scrollTo({ top: 0 });
  }

  const fecharMenuMobile = () => {
    $("#lateral").classList.remove("aberta");
    $("#lateral-fundo").hidden = true;
  };

  /* ---------------------------------------------------------------- */
  /* Indicadores                                                       */
  /* ---------------------------------------------------------------- */
  function desenharIndicadores() {
    const i = Dados.indicadores();
    const itens = [
      { rotulo: "Sinistros abertos", valor: i.abertos, sub: `${i.total} no total`, cor: "" },
      { rotulo: "Acabaram de entrar", valor: i.entrou, sub: "aguardando análise", cor: "" },
      { rotulo: "Casos urgentes", valor: i.urgentes, sub: "atenção imediata", cor: "vermelho" },
      { rotulo: "Em resolução", valor: i.resolvendo, sub: "em acompanhamento", cor: "amarelo" },
      { rotulo: "Concluídos hoje", valor: i.concluidosHoje, sub: `${i.concluidos} no total`, cor: "verde" },
      { rotulo: "Casos com vítimas", valor: i.comVitimas, sub: "em aberto", cor: "vermelho" },
      { rotulo: "Prazo vencido", valor: i.prazoVencido, sub: "retorno atrasado", cor: "vermelho" },
      { rotulo: "Sem atualização", valor: i.semAtualizacao, sub: "há muito tempo", cor: "amarelo" },
      { rotulo: "Tempo médio", valor: i.tempoMedio, sub: "até a conclusão", cor: "" },
    ];

    $("#indicadores").innerHTML = itens.map((x) => `<div class="indicador ${x.cor}">
      <span>${Util.esc(x.rotulo)}</span>
      <strong>${Util.esc(x.valor)}</strong>
      <small>${Util.esc(x.sub)}</small>
    </div>`).join("");
  }

  /* ---------------------------------------------------------------- */
  /* Conteúdo                                                          */
  /* ---------------------------------------------------------------- */
  function itemMenu(id) { return MENU.find((m) => m.id === id) || {}; }

  function desenharConteudo() {
    const alvo = $("#conteudo");
    const p = estado.pagina;

    const listaFiltrada = () => Dados.filtrar(estado.busca, estado.filtros).sort(Kanban.ordenar);

    if (p === "visao-geral") {
      alvo.innerHTML = Paginas.visaoGeral();
      Paginas.ligarTabela(alvo);
      $$("[data-ir]", alvo).forEach((b) => b.addEventListener("click", () => ir(b.dataset.ir)));

    } else if (p === "workflow") {
      const lista = Dados.filtrar(estado.busca, estado.filtros);
      alvo.innerHTML = Paginas.filtrosHTML(estado.filtros, ["status"], estado.filtrosAbertos) + Kanban.quadroHTML(lista);
      Paginas.ligarFiltros(alvo, aplicarFiltro);
      Kanban.ligar(alvo);

    } else if (p === "urgentes" || p === "resolvendo" || p === "concluidos") {
      const lista = listaFiltrada();
      const item = itemMenu(p);
      alvo.innerHTML = Paginas.filtrosHTML(estado.filtros, [], estado.filtrosAbertos) + `
        <div class="cartao">
          <div class="cartao-topo">
            <div><h2>${Util.esc(item.titulo)}</h2><p>${Util.plural(lista.length, "sinistro", "sinistros")}</p></div>
            <button class="btn btn-vazio btn-pequeno" data-exportar>Exportar planilha</button>
          </div>
          ${Paginas.tabelaHTML(lista, { colunaTempo: p === "concluidos" ? "Concluído" : "Aberto há" })}
        </div>`;
      Paginas.ligarFiltros(alvo, aplicarFiltro);
      Paginas.ligarTabela(alvo);
      $("[data-exportar]", alvo).addEventListener("click", () => Relatorios.exportarSinistros(lista));

    } else if (p === "prazos") {
      alvo.innerHTML = Paginas.prazos();
      Paginas.ligarTabela(alvo);

    } else if (p === "historico") {
      alvo.innerHTML = Paginas.historico(estado);
      Paginas.ligarTabela(alvo);
      Paginas.ligarHistorico(alvo, estado, desenhar);

    } else if (p === "relatorios") {
      alvo.innerHTML = Relatorios.pagina(estado);
      Relatorios.ligar(alvo, estado, desenhar);
      Paginas.ligarTabela(alvo);

    } else if (p === "usuarios") {
      alvo.innerHTML = Paginas.usuarios();
      Paginas.ligarUsuarios(alvo, desenhar);

    } else if (p === "config") {
      alvo.innerHTML = Paginas.configuracoes();
      Paginas.ligarConfiguracoes(alvo, desenhar);
    }
  }

  function aplicarFiltro(chave, valor) {
    if (chave === "__alternar__") {
      estado.filtrosAbertos = !estado.filtrosAbertos;
      desenhar();
      return;
    }
    if (chave === "__limpar__") {
      estado.filtros = {};
      estado.busca = "";
      $("#busca").value = "";
    } else if (valor === null || valor === "" || valor === false) {
      delete estado.filtros[chave];
    } else {
      estado.filtros[chave] = valor;
    }
    desenhar();
  }

  function desenhar() {
    const usuario = Dados.usuarioAtual();
    if (!usuario) return mostrarLogin();

    const item = itemMenu(estado.pagina);
    $("#titulo-pagina").textContent = item.titulo || "Painel";
    $("#subtitulo-pagina").textContent = item.sub || "";
    $("#limpar-busca").hidden = !estado.busca;

    desenharMenu();
    desenharIndicadores();
    desenharConteudo();
  }

  /* ---------------------------------------------------------------- */
  /* Sessão                                                            */
  /* ---------------------------------------------------------------- */
  function mostrarLogin() {
    $("#app").hidden = true;
    $("#tela-login").hidden = false;
    const campo = $("#form-login").elements.usuario;
    if (campo) campo.focus();
  }

  function mostrarApp() {
    const usuario = Dados.usuarioAtual();
    $("#tela-login").hidden = true;
    $("#app").hidden = false;
    $("#usuario-nome").textContent = usuario.nome;
    $("#usuario-perfil").textContent = Dados.nomePerfil(usuario.perfil);
    $("#usuario-avatar").textContent = Util.iniciais(usuario.nome);
    desenhar();
  }

  /* ---------------------------------------------------------------- */
  /* Início                                                            */
  /* ---------------------------------------------------------------- */
  function iniciar() {
    Dados.carregar();
    UI.iniciar();

    // Login
    $("#form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const r = Dados.entrar(form.elements.usuario.value, form.elements.senha.value);
      const erro = $("#login-erro");
      if (!r.ok) {
        erro.textContent = r.erro;
        erro.hidden = false;
        return;
      }
      erro.hidden = true;
      form.reset();
      estado.pagina = "workflow";
      mostrarApp();
      UI.sucesso(`Bem-vindo(a), ${r.usuario.nome.split(" ")[0]}.`);
    });

    $$("[data-preencher]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const form = $("#form-login");
        const admin = btn.dataset.preencher === "admin";
        form.elements.usuario.value = admin ? "admin" : "fernanda";
        form.elements.senha.value = admin ? "admin123" : "1234";
        form.elements.senha.focus();
      });
    });

    $("#btn-sair").addEventListener("click", async () => {
      const ok = await UI.confirmar({ titulo: "Sair do sistema", texto: "Deseja encerrar a sessão? Os sinistros continuam salvos.", rotulo: "Sair" });
      if (!ok) return;
      Dados.sair();
      mostrarLogin();
    });

    // Topo
    $("#btn-novo").addEventListener("click", () => Formularios.abrirCadastro());

    let tempoBusca = null;
    $("#busca").addEventListener("input", (e) => {
      estado.busca = e.target.value;
      clearTimeout(tempoBusca);
      tempoBusca = setTimeout(() => {
        // A busca só faz sentido nas telas de lista e no quadro.
        if (["visao-geral", "usuarios", "config", "relatorios"].indexOf(estado.pagina) >= 0) estado.pagina = "workflow";
        desenhar();
      }, 180);
    });

    $("#limpar-busca").addEventListener("click", () => {
      estado.busca = "";
      $("#busca").value = "";
      desenhar();
    });

    // Menu no celular
    $("#abrir-menu").addEventListener("click", () => {
      $("#lateral").classList.add("aberta");
      $("#lateral-fundo").hidden = false;
    });
    $("#fechar-menu").addEventListener("click", fecharMenuMobile);
    $("#lateral-fundo").addEventListener("click", fecharMenuMobile);

    // Qualquer escrita nos dados redesenha o painel.
    Dados.aoMudar(() => { if (Dados.usuarioAtual()) desenhar(); });

    // Os tempos ("aberto há…") envelhecem sozinhos.
    setInterval(() => {
      if (Dados.usuarioAtual() && !UI.gavetaAberta() && $("#modal-fundo").hidden) desenhar();
    }, 60000);

    if (Dados.usuarioAtual()) { estado.pagina = "workflow"; mostrarApp(); }
    else mostrarLogin();
  }

  return { iniciar, desenhar, ir, estado };
})();

document.addEventListener("DOMContentLoaded", App.iniciar);

</script>
</body>
</html>
