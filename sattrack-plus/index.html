<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SatTrack Plus — Controle de Sinistros</title>
<meta name="description" content="Controle interno dos sinistros do Setor Plus da SatTrack Proteção Veicular." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

<!-- ------------------------------------------------------------------ -->
<!-- Tela de acesso                                                      -->
<!-- ------------------------------------------------------------------ -->
<div id="tela-login" class="login" hidden>
  <form class="login-caixa" id="form-login" autocomplete="off">
    <div class="login-marca">
      <span class="marca-simbolo" aria-hidden="true">ST</span>
      <div>
        <strong>SatTrack Plus</strong>
        <small>Controle de Sinistros — Setor Plus</small>
      </div>
    </div>

    <label class="campo">
      <span>Usuário</span>
      <input name="usuario" required autocomplete="username" placeholder="ex.: fernanda" />
    </label>

    <label class="campo">
      <span>Senha</span>
      <input name="senha" type="password" required autocomplete="current-password" placeholder="••••••" />
    </label>

    <p class="login-erro" id="login-erro" hidden></p>

    <button class="btn btn-verde btn-bloco" type="submit">Entrar</button>

    <p class="login-dica">
      Acesso de demonstração —
      <button type="button" class="link" data-preencher="admin">administrador</button> ou
      <button type="button" class="link" data-preencher="atendente">atendente</button>.
    </p>
  </form>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Aplicação                                                           -->
<!-- ------------------------------------------------------------------ -->
<div id="app" class="app" hidden>

  <!-- Menu lateral -->
  <aside class="lateral" id="lateral">
    <div class="lateral-topo">
      <span class="marca-simbolo" aria-hidden="true">ST</span>
      <div class="lateral-marca">
        <strong>SatTrack Plus</strong>
        <small>Controle de Sinistros</small>
      </div>
      <button class="icone-btn so-mobile" id="fechar-menu" aria-label="Fechar menu">✕</button>
    </div>

    <nav class="menu" id="menu" aria-label="Menu principal"></nav>

    <div class="lateral-rodape">
      <div class="usuario-box">
        <span class="avatar" id="usuario-avatar">—</span>
        <div>
          <strong id="usuario-nome">—</strong>
          <small id="usuario-perfil">—</small>
        </div>
      </div>
      <button class="btn btn-vazio btn-bloco" id="btn-sair">Sair</button>
    </div>
  </aside>

  <div class="lateral-fundo" id="lateral-fundo" hidden></div>

  <!-- Conteúdo -->
  <div class="principal">
    <header class="topo">
      <button class="icone-btn so-mobile" id="abrir-menu" aria-label="Abrir menu">☰</button>

      <div class="topo-titulo">
        <h1 id="titulo-pagina">Visão geral</h1>
        <p id="subtitulo-pagina">Resumo dos sinistros do Setor Plus.</p>
      </div>

      <div class="topo-acoes">
        <div class="busca">
          <span aria-hidden="true">🔎</span>
          <input id="busca" type="search" placeholder="Buscar por associado, sinistro, protocolo, CPF, WhatsApp, placa…" aria-label="Buscar sinistros" />
          <button class="icone-btn" id="limpar-busca" aria-label="Limpar busca" hidden>✕</button>
        </div>
        <button class="btn btn-verde" id="btn-novo">+ Cadastrar sinistro</button>
      </div>
    </header>

    <section class="indicadores" id="indicadores" aria-label="Indicadores do painel"></section>

    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<!-- Painel lateral (cadastro / detalhe) -->
<div class="gaveta-fundo" id="gaveta-fundo" hidden></div>
<aside class="gaveta" id="gaveta" hidden aria-label="Painel do sinistro">
  <header class="gaveta-topo">
    <div>
      <h2 id="gaveta-titulo">Cadastrar sinistro</h2>
      <p id="gaveta-subtitulo"></p>
    </div>
    <button class="icone-btn" id="gaveta-fechar" aria-label="Fechar painel">✕</button>
  </header>
  <div class="gaveta-corpo" id="gaveta-corpo"></div>
  <footer class="gaveta-rodape" id="gaveta-rodape"></footer>
</aside>

<!-- Caixa de confirmação -->
<div class="modal-fundo" id="modal-fundo" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h3 id="modal-titulo">Confirmar</h3>
    <p id="modal-texto"></p>
    <div class="modal-acoes">
      <button class="btn btn-vazio" id="modal-cancelar">Cancelar</button>
      <button class="btn btn-verde" id="modal-confirmar">Confirmar</button>
    </div>
  </div>
</div>

<div class="avisos" id="avisos" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/dados.js"></script>
<script src="js/ui.js"></script>
<script src="js/formularios.js"></script>
<script src="js/kanban.js"></script>
<script src="js/paginas.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/app.js"></script>
</body>
</html>
